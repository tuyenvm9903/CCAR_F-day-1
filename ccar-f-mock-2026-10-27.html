<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CCAR-F Mock Exam — 2026-10-27</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#1c2230;--mut:#5d6677;--line:#d9dde5;--pri:#c2570b;--pri2:#9a4309;--ok:#157347;--bad:#b42318;--warn:#b7791f;--sel:#fff3e6}
*{box-sizing:border-box}
body{margin:0;font:16px/1.5 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink)}
button{font:inherit;cursor:pointer}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:16px}
h1{margin:0 0 6px;font-size:24px}h2{margin:0 0 10px;font-size:19px}h3{margin:0 0 8px;font-size:16px}
.mut{color:var(--mut)}.small{font-size:13px}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 16px}
.btn:hover{background:#f0f1f4}.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}.btn.pri:hover{background:var(--pri2)}
.btn.bad{background:var(--bad);border-color:var(--bad);color:#fff}.btn:disabled{opacity:.45;cursor:not-allowed}
.top{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.top .title{font-weight:600}.top .sp{flex:1}
.timer{font:700 22px ui-monospace,Menlo,Consolas,monospace;padding:4px 12px;border-radius:8px;background:#eef1f6}
.timer.low{background:#fde8e6;color:var(--bad)}
.layout{display:grid;grid-template-columns:1fr 280px;gap:16px}
@media(max-width:820px){.layout{grid-template-columns:1fr}}
.scen{background:#fff7ee;border:1px solid #f0cfae;border-radius:8px;padding:12px 14px;margin-bottom:14px}
.scen b{color:var(--pri2)}
.qno{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px;flex-wrap:wrap}
.tag{display:inline-block;background:#eef1f6;border-radius:999px;padding:2px 10px;font-size:13px;color:var(--mut)}
.tag.sel{background:#ffe9d1;color:var(--pri2);font-weight:600}
.stem{font-size:17px;margin:8px 0 14px;white-space:pre-wrap}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px;cursor:pointer;background:#fff}
.opt:hover{border-color:#b9bfcc}.opt.on{background:var(--sel);border-color:var(--pri)}
.opt input{margin-top:5px;accent-color:var(--pri)}
.opt .l{font-weight:700;min-width:20px}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.flagbtn.on{background:#fff3cd;border-color:var(--warn);color:#7a5200}
.map{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.map button{padding:6px 0;border:1px solid var(--line);border-radius:6px;background:#fff;font-size:13px;position:relative}
.map button.ans{background:#dff3e6;border-color:#8fcca6}
.map button.cur{outline:2px solid var(--pri)}
.map button.flag::after{content:"⚑";position:absolute;top:-6px;right:-2px;font-size:12px;color:var(--warn)}
.legend span{display:inline-block;margin-right:10px;font-size:12px;color:var(--mut)}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;border:1px solid var(--line);vertical-align:-1px;margin-right:4px}
.dot.a{background:#dff3e6}.dot.f{background:#fff3cd}
.hide{display:none!important}
.result-head{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.score{font-size:54px;font-weight:800;line-height:1}
.pass{color:var(--ok)}.fail{color:var(--bad)}
.bar{height:12px;border-radius:6px;background:#e6e9ef;overflow:hidden;min-width:140px}
.bar i{display:block;height:100%;background:var(--pri)}
table{border-collapse:collapse;width:100%}th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.rv{border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px;background:#fff}
.rv.right{border-left:5px solid var(--ok)}.rv.wrong{border-left:5px solid var(--bad)}.rv.skip{border-left:5px solid var(--warn)}
.ro{border-radius:8px;padding:8px 10px;margin:6px 0;border:1px solid var(--line)}
.ro.c{background:#e8f6ee;border-color:#9fd3b4}.ro.w{background:#fdeceb;border-color:#f0b3ae}
.ro .ex{font-size:14px;color:#33394a;margin-top:4px}
.badge{font-size:12px;font-weight:700;border-radius:4px;padding:1px 6px;margin-left:6px}
.badge.g{background:var(--ok);color:#fff}.badge.r{background:var(--bad);color:#fff}.badge.y{background:#e5e7eb;color:#333}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.filters .btn.on{background:#1c2230;color:#fff}
.modal{position:fixed;inset:0;background:rgba(15,20,30,.55);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
.modal .box{background:#fff;border-radius:12px;padding:22px;max-width:480px;width:100%}
ul.rules li{margin:4px 0}
.againbar{position:sticky;bottom:8px;z-index:20;box-shadow:0 -2px 12px rgba(0,0,0,.25);margin-top:12px}@media(max-width:600px){.againbar{padding:8px 10px}.againbar .small{display:none}}
</style>
</head>

<script type="application/json" id="exam-data">{"examId": "2026-10-27-1256", "date": "2026-10-27", "durationSec": 7200, "blueprint": {"D1": 16, "D2": 11, "D3": 12, "D4": 12, "D5": 9}, "domains": {"D1": "Agentic Architecture & Orchestration", "D2": "Tool Design & MCP Integration", "D3": "Claude Code Configuration & Workflows", "D4": "Prompt Engineering & Structured Output", "D5": "Context Management & Reliability"}, "scenarios": {"1": {"title": "Kịch bản 1 — Customer Support Resolution Agent", "text": "You are building a customer support resolution agent using the Claude Agent SDK. The agent handles high-ambiguity requests such as returns, billing disputes and account issues, using custom MCP tools (get_customer, lookup_order, process_refund, escalate_to_human). Target: 80%+ first-contact resolution while knowing when to escalate.", "vi": "Agent hỗ trợ khách hàng (Agent SDK + MCP tools): xử lý đổi trả, khiếu nại; biết lúc nào phải chuyển cho người."}, "2": {"title": "Kịch bản 2 — Code Generation with Claude Code", "text": "Your team uses Claude Code for code generation, refactoring, debugging and documentation. You need to integrate it into the workflow with custom slash commands, CLAUDE.md configuration, and understand when to use plan mode versus direct execution.", "vi": "Viết code với Claude Code: CLAUDE.md, lệnh tắt riêng, khi nào lập kế hoạch trước, khi nào làm luôn."}, "5": {"title": "Kịch bản 5 — Claude Code for Continuous Integration", "text": "You are integrating Claude Code into your CI/CD pipeline. The system runs automated code reviews, generates test cases and provides feedback on pull requests. You need prompts that give actionable feedback and minimize false positives.", "vi": "Claude Code trong CI/CD: tự review code, sinh test, góp ý pull request mà ít báo sai."}, "6": {"title": "Kịch bản 6 — Structured Data Extraction", "text": "You are building a structured data extraction system with Claude. It extracts information from unstructured documents, validates output with JSON schemas and maintains high accuracy. It must handle edge cases gracefully and integrate with downstream systems.", "vi": "Trích xuất dữ liệu: biến tài liệu thô thành JSON đúng định dạng, xử lý được trường hợp lạ."}}, "scenarioOrder": ["6", "5", "1", "2"], "questions": [{"id": "S6-04", "scenario": 6, "domain": "D1", "select": 1, "stem": "Your extraction agent loop sometimes returns before the extraction tool result is processed. The code stops when the first content block of the response is text. What is the correct fix?", "source": "TS 1.1 · bài 1.1", "options": [{"text": "Stop after exactly three iterations so the loop runs a fixed number of rounds that cover typical extractions.", "explanation": "Sai: cap cố định không phù hợp."}, {"text": "Continue while stop_reason is 'tool_use' and finish when it is 'end_turn', appending tool results to the conversation each iteration.", "explanation": "Đúng: stop_reason là tín hiệu quyết định."}, {"text": "Stop when the response is longer than 100 characters so the loop ends once the reply is long enough to be a real answer.", "explanation": "Sai: tùy tiện."}, {"text": "Search the response for the word 'done' so the loop ends when the model writes a clear completion keyword.", "explanation": "Sai: parse ngôn ngữ tự nhiên."}], "answers": [1]}, {"id": "S6-27", "scenario": 6, "domain": "D5", "select": 2, "stem": "Which TWO kinds of extractions should be routed to human review to use limited reviewer capacity well?", "source": "TS 5.5 · bài 5.5", "options": [{"text": "Only the shortest documents.", "explanation": "Sai: độ dài không phải tiêu chí."}, {"text": "Every extraction with high calibrated confidence, to be safe.", "explanation": "Sai: lãng phí năng lực; dùng lấy mẫu phân tầng thay thế."}, {"text": "Extractions from ambiguous or internally contradictory source documents.", "explanation": "Đúng: nguồn mâu thuẫn cần phán đoán của con người."}, {"text": "A random 50% of all extractions regardless of type.", "explanation": "Sai: không ưu tiên."}, {"text": "Extractions with low model confidence (calibrated on labeled validation data).", "explanation": "Đúng: ưu tiên người xem những ca không chắc chắn."}], "answers": [2, 4]}, {"id": "S6-12", "scenario": 6, "domain": "D3", "select": 1, "stem": "You need to add one optional field (null allowed) to an existing, well-understood schema in a single file. Which approach is best?", "source": "TS 3.4 · bài 3.4", "options": [{"text": "Ask for a design document first so a written plan is approved before the single-file change.", "explanation": "Sai: quá mức."}, {"text": "Plan mode with a full architectural investigation so every change, however small, is first examined against the full architecture.", "explanation": "Sai: quá mức."}, {"text": "Start a forked session to compare architectures so alternative architectures are compared before a field is added.", "explanation": "Sai: không cần."}, {"text": "Direct execution: the change is simple and well-scoped.", "explanation": "Đúng: thay đổi một file rõ ràng không cần lập kế hoạch."}], "answers": [3]}, {"id": "S6-01", "scenario": 6, "domain": "D1", "select": 1, "stem": "Your extraction agent calls several tools: an OCR service returns dates as Unix timestamps, a CRM returns ISO 8601 strings, and a legacy system returns '03/04/24' strings with ambiguous day/month order. Downstream validation keeps failing on date comparisons. What is the best place to fix this?", "source": "TS 1.5 · bài 1.5 Hooks", "options": [{"text": "Ask the model in the system prompt to be careful with dates so the model knows to read each date with extra care.", "explanation": "Sai: không xác định, dễ nhầm ngày/tháng."}, {"text": "A PostToolUse hook that normalizes the date formats from each tool before the model processes the results.", "explanation": "Đúng: PostToolUse chuẩn hóa dữ liệu hỗn hợp một cách xác định trước khi model xử lý."}, {"text": "Retry the extraction until validation passes so a failed validation triggers another attempt until the dates line up.", "explanation": "Sai: lặp lại không sửa nguyên nhân."}, {"text": "Add three few-shot examples with ISO dates only so the model sees a single date format in every worked example.", "explanation": "Sai: không giải quyết định dạng đầu vào hỗn hợp."}], "answers": [1]}, {"id": "S6-03", "scenario": 6, "domain": "D1", "select": 1, "stem": "Your document pipeline always goes: extract fields → validate against the schema → enrich with master data → format for export. Each stage has a different focus. Which design is a good fit?", "source": "TS 1.6 · bài 1.6 Prompt Chaining", "options": [{"text": "Run the stages in random order so the stages are shuffled to avoid order bias during processing.", "explanation": "Sai: vô nghĩa."}, {"text": "A dynamic planner that rewrites the stages for each document so the sequence of stages is decided afresh by the model for each document.", "explanation": "Sai: biến động không cần thiết."}, {"text": "A prompt chain with a focused prompt per stage, validating intermediate results between stages.", "explanation": "Đúng: chuỗi prompt tập trung từng bước, có thể kiểm tra và thử lại riêng từng bước."}, {"text": "One prompt that performs all four stages in one response so all stages are completed in one response with full context.", "explanation": "Sai: giảm độ chính xác từng bước."}], "answers": [2]}, {"id": "S6-10", "scenario": 6, "domain": "D2", "select": 1, "stem": "A load_document tool fails when the PDF is password-protected, when the file server times out, and when the file path is malformed. Which response design best supports recovery?", "source": "TS 2.2 · bài 2.2", "options": [{"text": "A single 'load failed' message for all causes so the agent has just one simple failure signal to handle.", "explanation": "Sai: không thể quyết định phục hồi."}, {"text": "Crash the pipeline for any failure so no inconsistent results can reach later stages of the pipeline.", "explanation": "Sai: quá mức."}, {"text": "Distinct structured errors with category (permission, transient, validation), isRetryable and a clear description.", "explanation": "Đúng: phân loại lỗi cho phép xử lý đúng cách."}, {"text": "Silently return an empty document so the pipeline continues with whatever is left of the document.", "explanation": "Sai: che giấu lỗi, dẫn đến trích xuất rỗng."}], "answers": [2]}, {"id": "S6-13", "scenario": 6, "domain": "D3", "select": 1, "stem": "A migration script mishandles null values in a column. Descriptions of the bug keep producing wrong fixes. What gives Claude the clearest way to fix the edge case?", "source": "TS 3.5 · bài 3.5", "options": [{"text": "Asking the model to ignore nulls so nulls are simply left out of the migration entirely.", "explanation": "Sai: không giải quyết."}, {"text": "A longer prose description of the problem so the problem is explained in more detail in the prompt.", "explanation": "Sai: có thể vẫn bị hiểu sai."}, {"text": "'Fix all edge cases' with no examples so the model is told to fix everything it can find without examples.", "explanation": "Sai: không cụ thể."}, {"text": "Provide specific test cases with example input and expected output covering the null handling.", "explanation": "Đúng: ví dụ vào/ra cụ thể cho trường hợp biên."}], "answers": [3]}, {"id": "S6-08", "scenario": 6, "domain": "D2", "select": 1, "stem": "You want the extract_metadata tool to run first on each document, followed by enrichment in later steps. How do you ensure the first call?", "source": "TS 2.3 · bài 2.3", "options": [{"text": "Use tool_choice \"any\" so the model must call a tool but is free to pick any available one.", "explanation": "Sai: không chỉ định công cụ."}, {"text": "List the tool first in the array so the model sees the tool before others and usually starts with it.", "explanation": "Sai: không cưỡng chế."}, {"text": "Force it with tool_choice {\"type\": \"tool\", \"name\": \"extract_metadata\"}, then handle subsequent steps in follow-up turns.", "explanation": "Đúng: forced tool_choice đảm bảo một công cụ cụ thể chạy trước."}, {"text": "Ask politely in the prompt so the model is asked directly to begin with that tool.", "explanation": "Sai: xác suất."}], "answers": [2]}, {"id": "S6-11", "scenario": 6, "domain": "D3", "select": 1, "stem": "The extraction project's conventions (schema naming, null handling rules) must apply for every developer who clones the repository. Where should they live?", "source": "TS 3.1 · bài 3.1", "options": [{"text": "In a personal note file so each developer keeps their own copy of the conventions.", "explanation": "Sai: không được nạp tự động."}, {"text": "In the project-level CLAUDE.md (or .claude/CLAUDE.md), which is committed to version control.", "explanation": "Đúng: cấu hình cấp dự án được chia sẻ."}, {"text": "In a Slack message so the conventions are communicated when the team is told.", "explanation": "Sai: không phải cấu hình."}, {"text": "In ~/.claude/CLAUDE.md of the tech lead so the lead's own settings define the conventions for the project.", "explanation": "Sai: chỉ áp dụng cho người đó."}], "answers": [1]}, {"id": "S6-05", "scenario": 6, "domain": "D1", "select": 1, "stem": "A batch of related contracts must be checked for consistency of party names and dates across documents. Analyzing all together in one pass gives uneven results. What structure is best?", "source": "TS 1.6 / 4.6 · bài 1.6", "options": [{"text": "Process them in random order and merge results with no review so the results are merged automatically without an extra review step.", "explanation": "Sai: thiếu kiểm tra."}, {"text": "Analyze each contract individually for local fields, then run a separate cross-document integration pass.", "explanation": "Đúng: các lượt tập trung + một lượt tích hợp giảm pha loãng chú ý."}, {"text": "Concatenate all contracts into one huge prompt so every contract is seen in the same context at the same time.", "explanation": "Sai: nguy cơ bỏ sót, pha loãng."}, {"text": "Pick the longest contract and assume the others are similar so one representative contract is analyzed in depth and generalized.", "explanation": "Sai: giả định không có cơ sở."}], "answers": [1]}, {"id": "S6-29", "scenario": 6, "domain": "D2", "select": 1, "stem": "You expose three extraction tools: extract_invoice_fields, extract_receipt_fields, extract_contract_terms. The model sometimes uses the wrong one for credit notes. What is the best first step?", "source": "TS 2.1 · bài 2.1", "options": [{"text": "Merge all three into one tool with a free-text 'type' field so the model has one entry point and decides the type by itself each time.", "explanation": "Sai: làm mờ hợp đồng."}, {"text": "Add 10 more tools for every document subtype so every possible document subtype has its own dedicated tool.", "explanation": "Sai: tăng độ phức tạp."}, {"text": "Clarify each tool's description with accepted document types, example inputs, and boundaries versus the others (for example credit notes belong to the invoice tool).", "explanation": "Đúng: ranh giới trong mô tả là cơ chế chính để chọn công cụ."}, {"text": "Force extract_invoice_fields for all documents so every document goes through the same tool whatever its type.", "explanation": "Sai: sai cho tài liệu khác."}], "answers": [2]}, {"id": "S6-25", "scenario": 6, "domain": "D5", "select": 1, "stem": "A document contains contradictory values for the same field (two different invoice totals) and cannot be resolved from the source alone. What should the pipeline do?", "source": "TS 4.4 / 5.5 · bài 5.5", "options": [{"text": "Flag a conflict_detected indicator and route the extraction to human review.", "explanation": "Đúng: nguồn mâu thuẫn nên chuyển cho người xem xét."}, {"text": "Select the larger total so the extraction reports the value that is more likely to be an upper bound.", "explanation": "Sai: tùy ý."}, {"text": "Drop the document silently so the extraction avoids contradictory data by leaving the document out.", "explanation": "Sai: mất dữ liệu."}, {"text": "Average the totals so the extraction reports a value that is a compromise between the two.", "explanation": "Sai: tạo giá trị không có nguồn."}], "answers": [0]}, {"id": "S6-18", "scenario": 6, "domain": "D4", "select": 1, "stem": "A purchase order says 'see attached master agreement for payment terms', but the agreement was not provided. The extractor fails validation on the payment_terms field repeatedly. What is true about retrying?", "source": "TS 4.4 · bài 4.4 (limits of retry)", "options": [{"text": "Let the model infer typical payment terms so the model supplies the usual terms used in similar agreements.", "explanation": "Sai: bịa."}, {"text": "More retries with stronger wording will eventually succeed so more attempts and firmer instructions eventually find the missing text.", "explanation": "Sai: không thể trích xuất thông tin không có."}, {"text": "Remove validation entirely so the check for missing information is no longer part of the pipeline.", "explanation": "Sai: bỏ kiểm tra."}, {"text": "Retries will not help because the information is absent from the provided source; return null or route for review.", "explanation": "Đúng: retry vô ích khi thông tin không có trong nguồn."}], "answers": [3]}, {"id": "S6-21", "scenario": 6, "domain": "D4", "select": 1, "stem": "A nightly batch of 1,000 documents returns 40 failures, some because the documents exceeded the context limit. What is the best handling strategy?", "source": "TS 4.5 · bài 4.5", "options": [{"text": "Manually process all documents so each failed document is handled one by one by a person.", "explanation": "Sai: không cần."}, {"text": "Identify the failed requests by custom_id, chunk the oversized documents, and resubmit only the failures.", "explanation": "Đúng: sửa theo nguyên nhân và chỉ gửi lại phần lỗi."}, {"text": "Ignore the failures so the failures are accepted as a normal cost of batch processing.", "explanation": "Sai: mất dữ liệu."}, {"text": "Resubmit all 1,000 unchanged so the same documents are retried unchanged and some may succeed.", "explanation": "Sai: tốn chi phí và vẫn lỗi."}], "answers": [1]}, {"id": "S6-15", "scenario": 6, "domain": "D4", "select": 1, "stem": "A 'document_category' field must cover the common types but also handle unexpected types gracefully, and sometimes the type is unclear. Which schema design is best?", "source": "TS 4.3 · bài 4.3", "options": [{"text": "A strict enum with only the known values so only the known types are allowed and anything else is rejected.", "explanation": "Sai: ép phân loại sai cho trường hợp mới."}, {"text": "An enum with the known values plus \"unclear\" and \"other\", with an accompanying detail string for 'other'.", "explanation": "Đúng: enum mở rộng được với 'other' + chi tiết, 'unclear' cho trường hợp mơ hồ."}, {"text": "A numeric code with no documentation so each type is represented by a compact code in the schema.", "explanation": "Sai: không mô tả."}, {"text": "A free-text string with no constraints so any unexpected type can still be captured in a flexible field.", "explanation": "Sai: khó chuẩn hóa."}], "answers": [1]}, {"id": "S6-23", "scenario": 6, "domain": "D5", "select": 1, "stem": "You auto-accept high-confidence extractions. How do you detect novel error patterns hidden in this accepted stream?", "source": "TS 5.5 · bài 5.5", "options": [{"text": "Stratified random sampling of high-confidence extractions for ongoing error-rate measurement.", "explanation": "Đúng: lấy mẫu phân tầng ngẫu nhiên phát hiện lỗi mới."}, {"text": "Never review accepted extractions so accepted results are not reviewed again and no time is wasted.", "explanation": "Sai: không phát hiện được."}, {"text": "Wait for customer complaints so any issues surface through feedback from the customers.", "explanation": "Sai: phản ứng muộn."}, {"text": "Review only the lowest-confidence ones so reviewers concentrate on the extractions the model is least sure about.", "explanation": "Sai: không bao phủ phần tự động chấp nhận."}], "answers": [0]}, {"id": "S5-27", "scenario": 5, "domain": "D3", "select": 2, "stem": "Which TWO choices are appropriate for running Claude Code in a CI pipeline?", "source": "TS 3.6 · bài 3.6", "options": [{"text": "Provide testing standards and review criteria through CLAUDE.md.", "explanation": "Đúng: ngữ cảnh dự án cho CI."}, {"text": "Use the -p flag so the job never waits for interactive input.", "explanation": "Đúng: chế độ không tương tác."}, {"text": "Rely on the interactive permission prompt to approve edits.", "explanation": "Sai: CI không có người tương tác."}, {"text": "Have the same session generate and then approve its own code.", "explanation": "Sai: thiên kiến tự đánh giá."}, {"text": "Parse the free-form text with a regex to create PR comments.", "explanation": "Sai: nên dùng --output-format json + --json-schema."}], "answers": [0, 1]}, {"id": "S5-28", "scenario": 5, "domain": "D1", "select": 1, "stem": "A PR changes 22 files. A single prompt reviewing everything yields detailed comments on early files and shallow ones on later files. Which restructuring addresses the root cause?", "source": "TS 1.6 / 4.6 · bài 1.6", "options": [{"text": "Use the same prompt but with a larger context window model so the model can keep all 22 files in view equally well at once.", "explanation": "Sai: ngữ cảnh lớn không sửa chất lượng chú ý."}, {"text": "Review only files that changed the most lines so the review effort is focused on the files with the most churn.", "explanation": "Sai: bỏ sót."}, {"text": "Review each file separately for local issues, then run an integration pass over the cross-file data flow.", "explanation": "Đúng: giảm pha loãng chú ý và vẫn bắt lỗi liên file."}, {"text": "Require authors to limit PRs to three files so the change is small enough to review in one pass every time.", "explanation": "Sai: đẩy gánh nặng sang con người."}], "answers": [2]}, {"id": "S5-24", "scenario": 5, "domain": "D4", "select": 2, "stem": "Which TWO statements about the Message Batches API are correct?", "source": "TS 4.5 · bài 4.5", "options": [{"text": "Responses always come back in the same order as requests.", "explanation": "Sai: dùng custom_id để đối chiếu."}, {"text": "It cannot execute tools mid-request and return results within a single request.", "explanation": "Đúng: không hỗ trợ gọi công cụ nhiều lượt trong một yêu cầu."}, {"text": "It offers about 50% cost savings but with up to a 24-hour processing window and no guaranteed latency.", "explanation": "Đúng: đánh đổi chi phí lấy độ trễ."}, {"text": "It is the best fit for a blocking pre-merge check.", "explanation": "Sai: không bảo đảm độ trễ."}, {"text": "It guarantees results in under one hour.", "explanation": "Sai: không có SLA độ trễ."}], "answers": [1, 2]}, {"id": "S5-16", "scenario": 5, "domain": "D3", "select": 1, "stem": "A teammate says 'adding -p to our CI command enables plan mode so Claude will not change files'. What is correct?", "source": "TS 3.6 · bài 3.6 (-p)", "options": [{"text": "Incorrect: -p is the flag that switches to batch processing with a 50% discount because -p is the flag that submits work through the Message Batches API for a discount.", "explanation": "Sai: Batches là API khác, không liên quan đến -p."}, {"text": "Correct: -p blocks file edits because -p prevents Claude from changing any file in the working tree.", "explanation": "Sai: không ngăn chỉnh sửa tệp."}, {"text": "Correct: -p is the plan mode flag because the -p flag switches to the mode that stops Claude from editing.", "explanation": "Sai: nhầm lẫn."}, {"text": "Incorrect: -p only enables non-interactive (print) mode; plan mode is a separate working mode.", "explanation": "Đúng: -p là chế độ không tương tác, không phải plan mode."}], "answers": [3]}, {"id": "S5-05", "scenario": 5, "domain": "D1", "select": 1, "stem": "A monorepo PR touches six independent packages and you want the coordinator to review them quickly. Which delegation is best?", "source": "TS 1.3 · bài 1.3", "options": [{"text": "Emit multiple Task calls in a single response to review the packages in parallel, passing each subagent the context it needs.", "explanation": "Đúng: nhiều Task call trong một phản hồi chạy song song; ngữ cảnh truyền tường minh."}, {"text": "Let the first subagent call the second directly so the first subagent can ask the second for help when it needs it.", "explanation": "Sai: nên đi qua coordinator."}, {"text": "Emit one Task call per turn so each package is reviewed in turn and the reviews cannot interfere.", "explanation": "Sai: tuần tự và chậm."}, {"text": "Assume subagents share the coordinator's history so the subagents already know about the review done by the coordinator.", "explanation": "Sai: không thừa hưởng."}], "answers": [0]}, {"id": "S5-06", "scenario": 5, "domain": "D2", "select": 1, "stem": "A CI job needs the team's GitHub MCP server. The token is stored as a CI secret and must not be committed. How should the server be configured?", "source": "TS 2.4 · bài 2.4", "options": [{"text": "In the project's .mcp.json using environment variable expansion such as ${GITHUB_TOKEN}.", "explanation": "Đúng: .mcp.json ở cấp dự án + mở rộng biến môi trường giữ bí mật ngoài repo."}, {"text": "In ~/.claude.json committed to the repo so the file is shared with the whole team through version control.", "explanation": "Sai: file cá nhân; và commit token là lỗi."}, {"text": "Hard-coded token in .mcp.json so the token is written once and reused by every pipeline run.", "explanation": "Sai: lộ bí mật."}, {"text": "In the PR description so reviewers can see which credentials the job relies on.", "explanation": "Sai: không phải cấu hình."}], "answers": [0]}, {"id": "S5-15", "scenario": 5, "domain": "D3", "select": 1, "stem": "One CI job has Claude Code write a feature, and a later step asks the same session to review its own diff. Reviews are consistently lenient. What is the best redesign?", "source": "TS 3.6 / 4.6 · bài 3.6", "options": [{"text": "Ask the same session to review with extended thinking so the same session reasons longer about its own diff.", "explanation": "Sai: vẫn giữ ngữ cảnh lập luận."}, {"text": "Run the review in a separate, independent Claude instance without the generation session's reasoning context.", "explanation": "Đúng: instance độc lập hiệu quả hơn trong phát hiện lỗi tinh vi."}, {"text": "Tell the same session 'be harsher' so the same session is pushed to find more problems in its own work.", "explanation": "Sai: không giải quyết thiên kiến."}, {"text": "Skip review for model-generated code so the pipeline is faster because generated code is trusted.", "explanation": "Sai: bỏ kiểm soát chất lượng."}], "answers": [1]}, {"id": "S5-01", "scenario": 5, "domain": "D1", "select": 1, "stem": "Your CI review always needs to check three aspects of every PR, in this order: style, security, and test coverage. The aspects are predictable and independent in content. Which task decomposition is most suitable?", "source": "TS 1.6 · bài 1.6 Task Decomposition", "options": [{"text": "A fully dynamic plan invented by Claude for each PR so the review adapts its order and depth to each PR on its own.", "explanation": "Sai: không cần tính linh hoạt cho quy trình biết trước, chỉ làm tăng biến động."}, {"text": "Prompt chaining: a fixed sequence of focused prompts, one per aspect.", "explanation": "Đúng: các bước dự đoán được nên chuỗi prompt cố định cho kết quả tập trung và dễ kiểm soát."}, {"text": "A single prompt asking for all three aspects together so the whole review is completed in one pass with all aspects visible together.", "explanation": "Sai: dễ pha loãng chú ý và kém nhất quán."}, {"text": "Three separate agents that argue until they agree so conflicting opinions are resolved before anything is posted.", "explanation": "Sai: phức tạp không cần thiết, có thể không hội tụ."}], "answers": [1]}, {"id": "S5-03", "scenario": 5, "domain": "D1", "select": 1, "stem": "A CI Claude job must never modify files under .github/workflows/, whatever the model decides. What is the best control?", "source": "TS 1.5 · bài 1.5 Hooks", "options": [{"text": "A reviewer comment after the fact so a human catches any unwanted edit once the job has finished.", "explanation": "Sai: phản ứng sau sự việc."}, {"text": "A few-shot example of refusing to edit workflows so Claude has a concrete example of the correct refusal behavior.", "explanation": "Sai: không bảo đảm."}, {"text": "A sentence in CLAUDE.md asking Claude not to touch them so Claude is told clearly which paths must never be changed.", "explanation": "Sai: hướng dẫn xác suất."}, {"text": "A hook that intercepts Write/Edit tool calls and blocks any targeting those paths.", "explanation": "Đúng: hook chặn tool call là cơ chế xác định cho quy tắc bắt buộc."}], "answers": [3]}, {"id": "S5-07", "scenario": 5, "domain": "D2", "select": 1, "stem": "The CI review agent should analyze code but must not alter anything. How should its tools be scoped?", "source": "TS 2.3 · bài 2.3", "options": [{"text": "No tools at all; it will guess so the agent is not constrained by any tool definitions at all.", "explanation": "Sai: không thể phân tích mã."}, {"text": "Restrict it to read-oriented tools such as Read, Grep and Glob.", "explanation": "Đúng: nguyên tắc đặc quyền tối thiểu, công cụ phù hợp vai trò."}, {"text": "Give it every tool including Write and Bash for flexibility so the agent can fix small problems itself while reviewing.", "explanation": "Sai: tăng rủi ro và độ phức tạp chọn công cụ."}, {"text": "Give it only Bash so a single tool is enough to run any command it needs.", "explanation": "Sai: công cụ chuyên biệt tốt hơn; Bash quá rộng."}], "answers": [1]}, {"id": "S5-11", "scenario": 5, "domain": "D3", "select": 1, "stem": "You want findings from a CI Claude run to be posted automatically as inline PR comments by a script. Which flags make the output reliably parseable?", "source": "TS 3.6 · bài 3.6", "options": [{"text": "--output-format json together with --json-schema describing the findings structure.", "explanation": "Đúng: kết hợp hai cờ để có phát hiện có cấu trúc."}, {"text": "--verbose and read the log output so the full run log contains everything the script needs.", "explanation": "Sai: không phải đầu ra có cấu trúc."}, {"text": "Only -p, and parse the text with regular expressions so the findings can be extracted from the text output by a script.", "explanation": "Sai: không bảo đảm cấu trúc."}, {"text": "Ask for 'JSON' in the prompt so the model is asked to format its answer as JSON.", "explanation": "Sai: không bảo đảm."}], "answers": [0]}, {"id": "S5-29", "scenario": 5, "domain": "D4", "select": 1, "stem": "Your team has two Claude workloads: a pre-merge security check developers wait on, and a weekly full-repository audit. How should you apply the Message Batches API?", "source": "TS 4.5 · bài 4.5", "options": [{"text": "Use it only for the weekly audit and keep synchronous calls for the pre-merge check.", "explanation": "Đúng: Batches không có SLA độ trễ nên không phù hợp tác vụ chặn."}, {"text": "Use it only for the pre-merge check so the pre-merge check gets the discount but may take up to a day.", "explanation": "Sai: ngược lại."}, {"text": "Use it for both, with polling to speed it up so both workloads get the cost savings, with polling to shorten the wait.", "explanation": "Sai: polling không tăng tốc."}, {"text": "Use neither because batches cannot be correlated to requests so each request can be traced even though there is no way to match results.", "explanation": "Sai: custom_id dùng để đối chiếu."}], "answers": [0]}, {"id": "S5-09", "scenario": 5, "domain": "D2", "select": 1, "stem": "The post_pr_comment tool returns a 403 when the token lacks permission and a 503 when GitHub is briefly unavailable, but both appear to the agent as 'Failed'. What should be changed?", "source": "TS 2.2 · bài 2.2", "options": [{"text": "Return success when comments fail so the job stays green so the pipeline never fails because of problems on the commenting side.", "explanation": "Sai: che giấu lỗi."}, {"text": "Always retry five times for any failure so every transient failure is eventually overcome by persistence.", "explanation": "Sai: lỗi quyền sẽ không bao giờ thành công khi retry."}, {"text": "Return structured errors: category (permission vs transient) and an isRetryable flag with descriptions.", "explanation": "Đúng: phân biệt lỗi quyền và lỗi tạm thời để agent quyết định retry hay escalate."}, {"text": "Never retry so no failure is ever retried and nothing is repeated by mistake.", "explanation": "Sai: bỏ lỡ phục hồi lỗi tạm thời."}], "answers": [2]}, {"id": "S5-19", "scenario": 5, "domain": "D4", "select": 1, "stem": "Which prompt statement is the most effective way to reduce false positives for a bug-focused reviewer?", "source": "TS 4.1 · bài 4.1", "options": [{"text": "'Be conservative and only flag things you are very sure about.' so the reviewer avoids borderline findings and only raises obvious problems.", "explanation": "Sai: chỉ dẫn chung, không cải thiện độ chính xác."}, {"text": "'Review carefully.' so the reviewer pays close attention to every change.", "explanation": "Sai: vô nghĩa."}, {"text": "'Report bugs and security vulnerabilities; skip minor style issues and patterns consistent with existing local conventions.'", "explanation": "Đúng: tiêu chí danh mục cụ thể về cái cần báo cáo và bỏ qua."}, {"text": "'Flag everything that might be a problem.' so no real issue can be missed and filtering is left to the developers.", "explanation": "Sai: tăng dương tính giả."}], "answers": [2]}, {"id": "S5-25", "scenario": 5, "domain": "D5", "select": 1, "stem": "Your reviewer's overall accuracy is 96%, yet developers say its dependency-upgrade findings are almost always wrong. What is the most appropriate response?", "source": "TS 5.5 · bài 5.5", "options": [{"text": "Increase the sample size of the entire set evenly so the overall evaluation set grows by the same amount for each category.", "explanation": "Sai: không nhắm vào phân khúc yếu."}, {"text": "Ask developers to ignore that category so developers do not spend attention on a category the model handles poorly.", "explanation": "Sai: không sửa."}, {"text": "Analyze accuracy by finding category/segment; aggregate metrics can mask poor performance in specific areas.", "explanation": "Đúng: phân tích theo phân khúc để thấy vùng yếu."}, {"text": "Trust the overall 96% number since a high overall number shows the reviewer is working well in every area.", "explanation": "Sai: số tổng hợp có thể che giấu."}], "answers": [2]}, {"id": "S1-26", "scenario": 1, "domain": "D1", "select": 2, "stem": "Production data shows the agent sometimes processes refunds for an account it never verified. Which TWO changes enforce identity verification deterministically rather than probabilistically?", "source": "TS 1.4 / 1.5 · bài 1.4 & 1.5", "options": [{"text": "A tool-call interception hook that rejects any process_refund call lacking a verified customer ID in its arguments.", "explanation": "Đúng: hook chặn tool call cũng là cưỡng chế xác định."}, {"text": "A system prompt paragraph in bold stating verification is mandatory.", "explanation": "Sai: vẫn dựa vào việc model tuân thủ nên có tỷ lệ lỗi khác 0."}, {"text": "Asking the agent to confirm 'I have verified the customer' in its reply.", "explanation": "Sai: lời xác nhận của model không phải bằng chứng đã gọi get_customer."}, {"text": "Four few-shot examples where the agent always verifies first.", "explanation": "Sai: cải thiện xác suất nhưng không đảm bảo."}, {"text": "A prerequisite gate that blocks process_refund (and lookup_order) until get_customer has returned a verified customer ID.", "explanation": "Đúng: cổng điều kiện tiên quyết là cưỡng chế bằng code, không phụ thuộc việc model nhớ."}], "answers": [0, 4]}, {"id": "S1-17", "scenario": 1, "domain": "D4", "select": 1, "stem": "Responses to customers vary widely in structure: some lack next steps, others bury the refund decision at the end. Detailed written instructions have not fixed this. What technique is most effective?", "source": "TS 4.2 · bài 4.2 Few-shot", "options": [{"text": "Add a few targeted few-shot examples that demonstrate the desired response format.", "explanation": "Đúng: few-shot là kỹ thuật hiệu quả nhất để có đầu ra nhất quán khi hướng dẫn bằng lời chưa đủ."}, {"text": "Lower max_tokens so replies are shorter so the format has less room to drift between replies.", "explanation": "Sai: ngắn hơn không có nghĩa là nhất quán về cấu trúc."}, {"text": "Add the instruction 'Be consistent' at the end of the prompt so the model is reminded of consistency right before it responds.", "explanation": "Sai: hướng dẫn chung chung không cụ thể hóa định dạng."}, {"text": "Run every reply through a second agent that rewrites it so a dedicated agent rewrites each reply into one fixed template before sending.", "explanation": "Sai: thêm chi phí và độ trễ, trong khi chưa thử cách đơn giản và hiệu quả là few-shot."}], "answers": [0]}, {"id": "S1-06", "scenario": 1, "domain": "D1", "select": 1, "stem": "A colleague proposes replacing the model-driven loop with a fixed decision tree: 'if message contains the word refund, run lookup_order then process_refund'. Customers frequently combine unusual requests. What is the best evaluation of the proposal?", "source": "TS 1.1 · bài 1.1 Agentic Loops (model-driven vs decision tree)", "options": [{"text": "Keep model-driven tool selection for flexibility, and enforce only the compliance-critical steps (like identity verification) programmatically.", "explanation": "Đúng: model-driven xử lý được tình huống chưa lường trước; chỉ những bước bắt buộc về tuân thủ mới cần cổng lập trình."}, {"text": "Reject both approaches and have a human triage every request since a human reviewing each request is the only way to guarantee consistent outcomes.", "explanation": "Sai: phá vỡ mục tiêu giải quyết tự động 80%+ mà không có lý do."}, {"text": "Adopt the decision tree but let the model fill in missing branches at runtime so the structure of the flow is predictable while the model handles the gaps.", "explanation": "Sai: tự mâu thuẫn, vừa cứng vừa không kiểm soát được và vẫn gặp trường hợp chưa lường trước."}, {"text": "Adopt the decision tree: deterministic flows are always more reliable than model reasoning since predictable branching removes model variance from every customer interaction.", "explanation": "Sai: cây quyết định cứng không thích ứng với yêu cầu kết hợp bất thường; chỉ cần tính xác định cho các bước tuân thủ."}], "answers": [0]}, {"id": "S1-03", "scenario": 1, "domain": "D1", "select": 1, "stem": "A customer writes: 'I want to return the blender, I was double-charged for my subscription, and please update my shipping address.' What is the best way for the agent to handle this message?", "source": "TS 1.4 · bài 1.4 Workflow Enforcement & Handoff", "options": [{"text": "Start three independent agents with no shared context, one per concern, and concatenate their replies so every concern is handled without one affecting the other.", "explanation": "Sai: không chia sẻ ngữ cảnh khách hàng nên dễ lặp tra cứu, mâu thuẫn và không có câu trả lời thống nhất."}, {"text": "Decompose it into three distinct items, investigate each (in parallel where independent) using shared customer context, then synthesize one unified response.", "explanation": "Đúng: tách yêu cầu nhiều mối quan tâm thành từng mục riêng, điều tra song song với ngữ cảnh chung rồi tổng hợp."}, {"text": "Handle only the first concern and ask the customer to send the others in separate messages so each concern is handled by an agent focused on a single topic.", "explanation": "Sai: làm giảm tỷ lệ giải quyết ngay lần liên hệ đầu (mục tiêu 80%+) và gây phiền cho khách."}, {"text": "Escalate immediately because the message contains multiple issues since multi-issue messages are inherently risky for an automated agent to handle.", "explanation": "Sai: nhiều vấn đề không phải là điều kiện escalate; agent có đủ công cụ để xử lý."}], "answers": [1]}, {"id": "S1-20", "scenario": 1, "domain": "D4", "select": 1, "stem": "When escalating, the agent must produce a handoff object with fixed fields (customer_id, root_cause, refund_amount, recommended_action) that downstream software parses. Which technique is the most reliable way to guarantee schema-compliant output?", "source": "TS 4.3 · bài 4.3 Structured Output", "options": [{"text": "Ask for JSON in the prompt and parse the text with a regular expression and extract the fields from the response with a pattern match.", "explanation": "Sai: không có đảm bảo về schema; dễ lỗi cú pháp."}, {"text": "Request the output as Markdown and convert it later so the output reads naturally and can be turned into structured data afterwards.", "explanation": "Sai: không phải cấu trúc máy đọc được và dễ thiếu trường."}, {"text": "Use tool_choice 'auto' and hope the model calls the tool so the model decides whether the handoff tool is needed in each case.", "explanation": "Sai: 'auto' cho phép model trả text thay vì gọi công cụ."}, {"text": "Define a handoff tool with a JSON schema and force it with tool_choice naming that tool.", "explanation": "Đúng: tool_use với JSON schema loại bỏ lỗi cú pháp; forced tool_choice đảm bảo công cụ đó được gọi."}], "answers": [3]}, {"id": "S1-05", "scenario": 1, "domain": "D1", "select": 1, "stem": "Your MCP tools return dates in three different formats: Unix timestamps from the order service, ISO 8601 from billing, and numeric status codes from shipping. The agent occasionally misreads the order of events. What is the best fix?", "source": "TS 1.5 · bài 1.5 Agent SDK Hooks", "options": [{"text": "Tell the model in the system prompt to convert every date it sees to ISO 8601 in its reasoning so every result is interpreted consistently across all three services.", "explanation": "Sai: bắt model tự chuẩn hóa tốn token và có thể sai; hook làm điều này bằng code đáng tin hơn."}, {"text": "A PostToolUse hook that normalizes timestamps and status codes into one format before the model sees the tool results.", "explanation": "Đúng: PostToolUse can thiệp kết quả công cụ trước khi model xử lý, chuẩn hóa dữ liệu một cách xác định."}, {"text": "Replace all three tools with a single generic tool returning free-form text which gives the model a single, uniform way to read order data.", "explanation": "Sai: gộp công cụ không giải quyết vấn đề định dạng và còn làm mất cấu trúc."}, {"text": "Add a PreToolUse hook that rejects the tool calls whose results use unfamiliar formats so that only tool results in a known, expected format reach the conversation.", "explanation": "Sai: PreToolUse chạy trước khi công cụ thực thi nên không thấy được định dạng của kết quả."}], "answers": [1]}, {"id": "S1-19", "scenario": 1, "domain": "D4", "select": 1, "stem": "Each night you must audit 8,000 closed support conversations for policy compliance. Results are needed by next morning, and cost matters. Which approach fits?", "source": "TS 4.5 · bài 4.5 Batch Processing", "options": [{"text": "Do not audit; rely on the live agent's self-assessment so the audit costs nothing because the live agent already evaluates itself.", "explanation": "Sai: bỏ kiểm toán độc lập."}, {"text": "Synchronous API calls during business hours so users wait for results so the answers arrive while the support team is actually online.", "explanation": "Sai: tốn chi phí gấp đôi mà không cần phản hồi tức thì."}, {"text": "Batches API for the audit, plus polling every second to guarantee sub-minute latency so the audit still finishes within seconds even though the batch is large.", "explanation": "Sai: Batches không có SLA độ trễ; polling không làm nó nhanh hơn."}, {"text": "Message Batches API, correlating results with custom_id.", "explanation": "Đúng: tác vụ không chặn, chịu được độ trễ; Batches giảm 50% chi phí, xử lý tối đa 24 giờ."}], "answers": [3]}, {"id": "S1-16", "scenario": 1, "domain": "D3", "select": 1, "stem": "Claude Code behaves inconsistently between sessions in the same repository and you suspect different memory files are being loaded. Which command helps diagnose this?", "source": "TS 3.1 · bài 3.1 (/memory)", "options": [{"text": "/memory, to verify which memory files are loaded.", "explanation": "Đúng: /memory cho biết các file memory (CLAUDE.md) nào đang được nạp."}, {"text": "/compact, to summarize which files were loaded so the files loaded into the session are condensed and then listed.", "explanation": "Sai: /compact giảm kích thước ngữ cảnh, không liệt kê file memory."}, {"text": "claude --batch, to re-run the session with logs so the full set of memory files is listed together with a debug trace.", "explanation": "Sai: không có cờ --batch trong Claude Code."}, {"text": "/plan, to list the CLAUDE.md files so the memory file hierarchy is printed as a plan.", "explanation": "Sai: không phải lệnh dùng để kiểm tra memory."}], "answers": [0]}, {"id": "S1-27", "scenario": 1, "domain": "D2", "select": 2, "stem": "Which TWO additions most improve the description of your lookup_order tool so it is not confused with get_customer?", "source": "TS 2.1 · bài 2.1", "options": [{"text": "An explicit boundary stating when to use get_customer instead (for example when only a name or email is known).", "explanation": "Đúng: ranh giới với công cụ tương tự giảm nhầm lẫn."}, {"text": "A longer marketing-style summary of the order service's features.", "explanation": "Sai: không giúp phân biệt công cụ."}, {"text": "A note that this tool is 'very important'.", "explanation": "Sai: nhấn mạnh mơ hồ không làm rõ ranh giới."}, {"text": "The internal database table names it queries.", "explanation": "Sai: chi tiết triển khai không giúp chọn công cụ."}, {"text": "The identifier formats it accepts (for example order numbers like ORD-12345) with example requests that should trigger it.", "explanation": "Đúng: định dạng đầu vào và ví dụ truy vấn giúp model chọn đúng."}], "answers": [0, 4]}, {"id": "S1-24", "scenario": 1, "domain": "D5", "select": 1, "stem": "A customer is visibly frustrated about a missing parcel but never asks for a human. A standard replacement is clearly within the agent's authority. What is the best behavior?", "source": "TS 5.2 · bài 5.2 Escalation", "options": [{"text": "Ignore the emotion and continue with a scripted reply so the customer hears a consistent, professional message every time.", "explanation": "Sai: bỏ qua cảm xúc làm trải nghiệm tệ hơn."}, {"text": "Acknowledge the frustration and offer the resolution; escalate only if the customer reiterates a preference for a human.", "explanation": "Đúng: cảm xúc không phải tiêu chí escalate; vấn đề trong khả năng xử lý nên giải quyết."}, {"text": "Escalate right away because negative sentiment indicates a hard case so the agent never wastes the time of an upset customer with a routine task.", "explanation": "Sai: sentiment không tương quan với độ phức tạp ca."}, {"text": "Ask the model for a 1–10 confidence score and escalate below 7 so the agent only escalates when its own estimate says the answer may be wrong.", "explanation": "Sai: tự đánh giá confidence kém hiệu chuẩn."}], "answers": [1]}, {"id": "S1-23", "scenario": 1, "domain": "D5", "select": 1, "stem": "A customer writes: 'Stop. I want a human agent now.' Their issue (a delayed parcel) is something the agent could normally resolve. What should the agent do?", "source": "TS 5.2 · bài 5.2 Escalation", "options": [{"text": "Compute a sentiment score and escalate only if it is above a threshold so escalation is decided by a measurable signal rather than a single request.", "explanation": "Sai: sentiment không phải căn cứ khi khách đã yêu cầu rõ ràng."}, {"text": "Escalate immediately and honor the request, without first trying to investigate.", "explanation": "Đúng: yêu cầu rõ ràng gặp người thật phải được tôn trọng ngay."}, {"text": "Run lookup_order to gather facts before escalating, ignoring the request for now so the agent has full information ready for the human before the handoff.", "explanation": "Sai: điều tra trước tức là chưa tôn trọng yêu cầu."}, {"text": "Offer to resolve the parcel issue first and escalate only if they ask again so the customer gets a quick solution and may not need a human at all.", "explanation": "Sai: dành cho trường hợp khách chỉ bực bội mà chưa yêu cầu rõ ràng; ở đây khách đã yêu cầu thẳng."}], "answers": [1]}, {"id": "S1-12", "scenario": 1, "domain": "D2", "select": 1, "stem": "lookup_order is called for a customer who genuinely has no orders in the last 12 months. The backend responded normally. How should the tool report this?", "source": "TS 2.2 / 5.3 · bài 2.2 & 5.3", "options": [{"text": "As an error with errorCategory 'transient' so the agent retries later so the agent treats the missing data the way it treats any outage.", "explanation": "Sai: không có lỗi truy cập nào xảy ra; retry sẽ chỉ lãng phí và có thể gây vòng lặp."}, {"text": "As a permission error, since the data could not be found so the agent will check again later when the data may have been restored.", "explanation": "Sai: nhầm lẫn giữa 'không có dữ liệu' và 'không có quyền'."}, {"text": "By returning a made-up placeholder order so the schema is satisfied so downstream validation never fails on an empty result.", "explanation": "Sai: bịa dữ liệu dẫn đến quyết định sai cho khách."}, {"text": "As a successful result with an empty list, clearly distinguishable from access failures.", "explanation": "Đúng: truy vấn thành công nhưng không có kết quả là kết quả hợp lệ; không phải lỗi."}], "answers": [3]}, {"id": "S1-10", "scenario": 1, "domain": "D2", "select": 1, "stem": "process_refund currently returns the same text 'Operation failed' for timeouts, invalid order IDs, and refunds outside the return window. The agent retries all of them three times. What should the tool return?", "source": "TS 2.2 · bài 2.2 Structured Error Responses", "options": [{"text": "The same generic message, but with the HTTP status code appended so the agent at least knows which layer of the stack produced the failure.", "explanation": "Sai: mã HTTP vẫn không cho biết lỗi có thể thử lại hay là vi phạm chính sách."}, {"text": "Structured error metadata: errorCategory (transient/validation/permission/business), an isRetryable flag, and a readable description.", "explanation": "Đúng: metadata có cấu trúc cho phép agent quyết định retry, sửa input hay giải thích cho khách."}, {"text": "An empty successful result so the agent does not loop so the agent cannot be misled into retrying a call that actually failed.", "explanation": "Sai: che giấu lỗi như thể thành công, khiến agent báo sai cho khách."}, {"text": "Throw an exception that terminates the whole conversation so the failed call ends the whole flow immediately and nothing is repeated by mistake.", "explanation": "Sai: một lỗi đơn lẻ không nên kết thúc cả phiên, nhất là khi có thể phục hồi."}], "answers": [1]}, {"id": "S1-25", "scenario": 1, "domain": "D5", "select": 1, "stem": "A customer asks the agent to match a competitor's lower price on a TV. Your policy only covers adjusting prices on your own website after purchase and says nothing about competitors. What should the agent do?", "source": "TS 5.2 · bài 5.2 Escalation (policy gap)", "options": [{"text": "Escalate: the policy is silent on this request, so a human must decide.", "explanation": "Đúng: khoảng trống chính sách là điều kiện escalate hợp lệ."}, {"text": "Deny the request, stating that it is against policy so the customer receives a clear and final answer without waiting for anyone.", "explanation": "Sai: chính sách không cấm mà chỉ không đề cập; nói là 'vi phạm' là sai thông tin."}, {"text": "Approve the match to keep the customer happy so the customer gets the outcome they asked for without delay.", "explanation": "Sai: tự ý tạo ngoại lệ chính sách."}, {"text": "Apply the own-site policy by analogy and issue the adjustment so the nearest existing policy is used to give the customer a fair result.", "explanation": "Sai: suy diễn chính sách cho tình huống khác là không đáng tin."}], "answers": [0]}, {"id": "S1-15", "scenario": 1, "domain": "D3", "select": 1, "stem": "A new developer on the support-agent repository says Claude Code ignores the team's coding conventions on their machine, while it works for the senior developer. The conventions live in the senior developer's ~/.claude/CLAUDE.md. What is the issue and the fix?", "source": "TS 3.1 · bài 3.1 CLAUDE.md Hierarchy", "options": [{"text": "The new developer must run /compact so the conventions are loaded so the conventions are loaded for the new developer's session as well.", "explanation": "Sai: /compact nén ngữ cảnh, không tải cấu hình từ người khác."}, {"text": "User-level files apply only to that user and are not version-controlled; move the shared conventions into the project's CLAUDE.md (or .claude/CLAUDE.md).", "explanation": "Đúng: ~/.claude/CLAUDE.md chỉ áp dụng cho người dùng đó; quy ước chung phải ở cấp dự án và được commit."}, {"text": "Add the conventions to the system prompt of the Agent SDK application so the new developer gets exactly the same environment as the senior developer.", "explanation": "Sai: không liên quan đến cấu hình Claude Code của máy phát triển."}, {"text": "Copy the senior developer's ~/.claude directory by email so the conventions become part of the shared codebase history that everyone reads.", "explanation": "Sai: giải pháp thủ công, không bền vững và không đồng bộ qua version control."}], "answers": [1]}, {"id": "S2-29", "scenario": 2, "domain": "D5", "select": 2, "stem": "Which TWO techniques best counter context degradation in a very long Claude Code session working on a large codebase?", "source": "TS 5.4 · bài 5.4", "options": [{"text": "Ask Claude to answer from 'typical patterns' to save tokens.", "explanation": "Sai: đó chính là biểu hiện suy giảm."}, {"text": "Record key findings in a scratchpad file and consult it when answering later questions.", "explanation": "Đúng: lưu phát hiện ngoài ngữ cảnh."}, {"text": "Keep reading additional files so Claude has more patterns to draw on.", "explanation": "Sai: làm ngữ cảnh đầy hơn."}, {"text": "Delegate verbose investigations to subagents (for example the Explore subagent) and keep only their summaries in the main context.", "explanation": "Đúng: cô lập đầu ra khám phá dài dòng."}, {"text": "Raise the iteration cap so the session lasts longer.", "explanation": "Sai: cap không liên quan đến chất lượng ngữ cảnh."}], "answers": [1, 3]}, {"id": "S2-02", "scenario": 2, "domain": "D1", "select": 1, "stem": "You have a named investigation session about a flaky payments module. After lunch, a teammate refactors two of the files you analyzed this morning. You want to continue the same investigation efficiently. What should you do?", "source": "TS 1.7 · bài 1.7 Session State", "options": [{"text": "Discard the session and re-explore the whole module from scratch so no stale conclusions from the earlier session carry over into the new work.", "explanation": "Sai: tốn kém khi chỉ có hai file thay đổi."}, {"text": "Resume the session and assume Claude will notice the file changes by itself so the analysis resumes immediately without any extra instructions.", "explanation": "Sai: model không tự biết file đã bị sửa nếu không được thông báo hoặc đọc lại."}, {"text": "Resume the named session with --resume and tell Claude which files changed so it can re-analyze only those.", "explanation": "Đúng: resume phù hợp khi ngữ cảnh phần lớn còn đúng; thông báo file thay đổi giúp phân tích lại có mục tiêu."}, {"text": "Fork the session and pick whichever branch has the longer history so the longer-running branch preserves more of the earlier analysis.", "explanation": "Sai: fork để thử hướng khác, không để cập nhật theo thay đổi file."}], "answers": [2]}, {"id": "S2-05", "scenario": 2, "domain": "D1", "select": 1, "stem": "A nightly Claude Code job always performs the same three steps on a repository: lint-fix, then update the API docs, then draft a changelog entry. Which decomposition pattern fits?", "source": "TS 1.6 · bài 1.6", "options": [{"text": "Fully dynamic decomposition where Claude invents the steps each night so the model can adapt the steps if the repository changes from night to night.", "explanation": "Sai: không cần linh hoạt cho quy trình cố định; thêm biến động không cần thiết."}, {"text": "A coordinator that spawns a new subagent for each line of code so each part of the code gets its own dedicated analysis.", "explanation": "Sai: quá mức cần thiết."}, {"text": "One giant prompt that performs everything in one pass so the three steps run together and share the whole context.", "explanation": "Sai: dễ giảm chất lượng từng phần khi trộn nhiều mục tiêu."}, {"text": "A fixed sequential pipeline (prompt chaining), one focused prompt per step.", "explanation": "Đúng: các bước dự đoán được, lặp lại nên prompt chaining là phù hợp."}], "answers": [3]}, {"id": "S2-03", "scenario": 2, "domain": "D1", "select": 1, "stem": "After analyzing a service, you want to compare two possible refactoring strategies (a strangler-pattern rewrite versus an in-place cleanup) without one polluting the other's context. Which mechanism fits best?", "source": "TS 1.7 · bài 1.7 (fork_session)", "options": [{"text": "fork_session, creating independent branches from the shared analysis baseline.", "explanation": "Đúng: fork cho phép khám phá các hướng khác nhau từ cùng một nền phân tích mà không ảnh hưởng nhau."}, {"text": "Ask Claude to do both strategies in the same conversation and hope they stay separate so both approaches are developed in a single place and easy to compare.", "explanation": "Sai: hai hướng sẽ lẫn vào ngữ cảnh của nhau."}, {"text": "Use --resume twice on the same session name so the same session name can be reopened as two separate conversations.", "explanation": "Sai: resume tiếp tục cùng một phiên chứ không tạo nhánh độc lập."}, {"text": "Run /compact between the strategies so the session history is shortened between the two strategies.", "explanation": "Sai: /compact nén ngữ cảnh, không tạo nhánh song song."}], "answers": [0]}, {"id": "S2-17", "scenario": 2, "domain": "D4", "select": 1, "stem": "Your docs-automation prompt says 'check that code comments are accurate' and produces many nitpicks. Which revised criterion best improves precision?", "source": "TS 4.1 · bài 4.1 Explicit Criteria", "options": [{"text": "Only report issues you are highly confident about so only the strongest findings are surfaced to reviewers.", "explanation": "Sai: hướng dẫn 'tự tin cao' chung chung không cải thiện độ chính xác."}, {"text": "Flag every comment so reviewers can decide so no inaccurate comment can slip through unreported.", "explanation": "Sai: tăng nhiễu và làm mất niềm tin vào công cụ."}, {"text": "Flag a comment only when the behavior it claims contradicts what the code actually does.", "explanation": "Đúng: tiêu chí cụ thể, có thể kiểm chứng giúp giảm dương tính giả."}, {"text": "Be conservative when flagging comments so reviewers are not surprised by comments that were not raised.", "explanation": "Sai: mơ hồ, không xác định danh mục cần báo cáo."}], "answers": [2]}, {"id": "S2-07", "scenario": 2, "domain": "D2", "select": 1, "stem": "You edit a config file with the Edit tool, but it fails because the text you want to replace appears in several places and is not unique. What is the tested fallback?", "source": "TS 2.5 · bài 2.5 Built-in Tools", "options": [{"text": "Use Glob to rename the file and recreate it so the file is replaced by a freshly generated copy.", "explanation": "Sai: Glob tìm tên file theo mẫu, không sửa nội dung."}, {"text": "Use Grep to replace the text across the repository so the replacement is applied everywhere in one operation.", "explanation": "Sai: Grep dùng để tìm kiếm, không phải sửa file."}, {"text": "Retry the same Edit until it succeeds so the same operation is attempted again until the text matches.", "explanation": "Sai: kết quả không đổi khi đoạn text vẫn không duy nhất."}, {"text": "Use Read to load the full file, then Write the complete modified file.", "explanation": "Đúng: theo Exam Guide, khi Edit không tìm được đoạn duy nhất, dùng Read + Write để sửa đáng tin cậy."}], "answers": [3]}, {"id": "S2-21", "scenario": 2, "domain": "D4", "select": 2, "stem": "Which TWO changes best help Claude Code generate a unit-test suite with consistent structure and fewer low-value tests?", "source": "TS 3.6 · bài 3.6 CI/CD & test generation", "options": [{"text": "Instruct Claude to generate as many tests as possible.", "explanation": "Sai: tăng số lượng test giá trị thấp."}, {"text": "Ask for tests only for trivial getters and setters.", "explanation": "Sai: giá trị thấp, không phải tiêu chí tốt."}, {"text": "Include existing test files in context so duplicate scenarios are not suggested.", "explanation": "Đúng: giúp tránh đề xuất kịch bản đã có."}, {"text": "Document testing standards, what counts as a valuable test, and available fixtures in CLAUDE.md.", "explanation": "Đúng: CLAUDE.md cung cấp ngữ cảnh dự án luôn được nạp, nâng chất lượng bài kiểm thử."}, {"text": "Hide the existing tests to avoid bias.", "explanation": "Sai: khiến test trùng lặp."}], "answers": [2, 3]}, {"id": "S2-01", "scenario": 2, "domain": "D1", "select": 1, "stem": "You must migrate a codebase from one HTTP client library to another. The call sites are scattered across a very large repository, and discovery output (grep results, file dumps) is flooding the main conversation. Which approach best protects the main context?", "source": "TS 3.4 / 5.4 · bài 3.4 & 5.4 (Explore subagent)", "options": [{"text": "Disable the Grep tool so fewer results are returned so less raw output ever has to be read in the first place.", "explanation": "Sai: làm mất khả năng tìm kiếm cần thiết thay vì cô lập đầu ra."}, {"text": "Delegate the discovery phase to the Explore subagent and have it return a concise summary to the main conversation.", "explanation": "Đúng: Explore subagent cô lập đầu ra khám phá dài dòng và chỉ trả về bản tóm tắt, giữ ngữ cảnh chính gọn."}, {"text": "Run all grep and read operations in the main conversation, then ask Claude to forget the output so the main conversation never loses the earlier detail by mistake.", "explanation": "Sai: model không thể 'quên'; nội dung vẫn nằm trong ngữ cảnh."}, {"text": "Restart the session after every search and paste results manually so every search starts from a clean context without carrying earlier results.", "explanation": "Sai: tốn công và mất mạch làm việc mà không có lợi ích so với việc ủy quyền cho subagent."}], "answers": [1]}, {"id": "S2-08", "scenario": 2, "domain": "D3", "select": 1, "stem": "You want a /analyze-architecture skill that produces very verbose output while exploring the codebase. You do not want this output cluttering the main conversation. What should you configure?", "source": "TS 3.2 · bài 3.2 Skills (context: fork)", "options": [{"text": "Add an instruction to CLAUDE.md telling Claude to be brief so the verbose output is shortened wherever it appears.", "explanation": "Sai: không cô lập được đầu ra của skill."}, {"text": "Use context: fork in the skill's SKILL.md frontmatter so it runs in an isolated sub-agent context.", "explanation": "Đúng: context: fork chạy skill trong ngữ cảnh cô lập, tránh làm nhiễu cuộc trò chuyện chính."}, {"text": "Put the skill in ~/.claude/skills/ instead of .claude/skills/ so the skill is available across all of the user's projects.", "explanation": "Sai: thay đổi phạm vi chia sẻ, không thay đổi cách cô lập ngữ cảnh."}, {"text": "Set argument-hint to 'short' so the skill is told to limit the length of what it prints.", "explanation": "Sai: argument-hint chỉ nhắc tham số cần nhập."}], "answers": [1]}, {"id": "S2-06", "scenario": 2, "domain": "D2", "select": 1, "stem": "Your team wants a shared GitHub MCP server for every developer in the repository, without committing access tokens. Where and how should it be configured?", "source": "TS 2.4 · bài 2.4 MCP Integration", "options": [{"text": "In each developer's ~/.claude.json with the token pasted inline with the token pasted inline so each developer can use the server immediately.", "explanation": "Sai: cấu hình cá nhân không được chia sẻ cho cả nhóm."}, {"text": "In .mcp.json with the literal token committed for convenience so the setup works on every machine without extra environment configuration.", "explanation": "Sai: lộ bí mật trong version control."}, {"text": "In a project-level .mcp.json using environment variable expansion such as ${GITHUB_TOKEN}.", "explanation": "Đúng: .mcp.json ở cấp dự án được chia sẻ; biến môi trường giữ bí mật ngoài repo."}, {"text": "In CLAUDE.md with the token written in the first line so the instruction and the credentials are loaded together in every session.", "explanation": "Sai: CLAUDE.md là hướng dẫn, không phải cấu hình máy chủ MCP; token còn bị commit."}], "answers": [2]}, {"id": "S2-09", "scenario": 2, "domain": "D3", "select": 1, "stem": "A skill that scaffolds boilerplate files should only be able to write files and must not run arbitrary shell commands. Which frontmatter setting expresses this tool restriction in the exam's terms?", "source": "TS 3.2 · bài 3.2 Skills (allowed-tools)", "options": [{"text": "argument-hint so the skill's invocation is guided by an input hint.", "explanation": "Sai: chỉ gợi ý tham số khi gọi skill."}, {"text": "context: fork so the skill runs in a separate context where tools are different.", "explanation": "Sai: chỉ cô lập ngữ cảnh, không hạn chế công cụ."}, {"text": "allowed-tools, limited to the file-writing tools.", "explanation": "Đúng: allowed-tools trong frontmatter của skill giới hạn công cụ có thể dùng khi skill chạy."}, {"text": "A line in CLAUDE.md saying 'never use Bash' so the model is told never to use the shell tool anywhere in the project.", "explanation": "Sai: chỉ là hướng dẫn xác suất, không phải cấu hình công cụ của skill."}], "answers": [2]}, {"id": "S2-23", "scenario": 2, "domain": "D5", "select": 1, "stem": "Your session is full of verbose discovery output but you still need to keep working in the same session. Which built-in command reduces context usage?", "source": "TS 5.4 · bài 5.4 (/compact)", "options": [{"text": "/memory", "explanation": "Sai: chỉ hiển thị/quản lý các file memory."}, {"text": "--resume", "explanation": "Sai: tiếp tục phiên, không giảm ngữ cảnh."}, {"text": "/compact", "explanation": "Đúng: /compact nén ngữ cảnh khi phiên khám phá dài đầy đầu ra chi tiết."}, {"text": "-p", "explanation": "Sai: chế độ không tương tác cho CI."}], "answers": [2]}, {"id": "S2-20", "scenario": 2, "domain": "D4", "select": 1, "stem": "Code reviews produced by your prompt classify almost everything as 'high severity'. What helps most to get consistent severity labels?", "source": "TS 4.1 · bài 4.1 (severity criteria)", "options": [{"text": "Only report issues with confidence above 90% so only findings the model feels very sure about are labeled at all.", "explanation": "Sai: confidence không phải tiêu chí mức độ nghiêm trọng."}, {"text": "Tell the model to 'use good judgment about severity' so each issue's severity is left to the model's own judgment.", "explanation": "Sai: mơ hồ."}, {"text": "Reduce temperature to 0 so the model becomes more deterministic in its labeling.", "explanation": "Sai: không xác định tiêu chuẩn phân loại."}, {"text": "Define explicit severity criteria, with concrete code examples for each level.", "explanation": "Đúng: tiêu chí rõ + ví dụ code cụ thể cho từng mức giúp phân loại nhất quán."}], "answers": [3]}, {"id": "S2-12", "scenario": 2, "domain": "D3", "select": 1, "stem": "A stack trace clearly shows a null-pointer crash in a single function of one file, and the fix is a one-line guard. Which working mode is most appropriate?", "source": "TS 3.4 · bài 3.4 Plan Mode vs Direct", "options": [{"text": "Direct execution: the change is well-scoped and clearly understood.", "explanation": "Đúng: sửa lỗi một file có stack trace rõ ràng không cần lập kế hoạch dài."}, {"text": "Defer the fix until the team decides on a new architecture so a design decision is made before any fix is applied.", "explanation": "Sai: không liên quan đến sửa lỗi cục bộ."}, {"text": "Plan mode followed by forking three sessions so several approaches to the one-line fix are explored in parallel.", "explanation": "Sai: phức tạp hóa không cần thiết."}, {"text": "Plan mode with a full architectural exploration of the codebase so every change is investigated thoroughly before any edit is made.", "explanation": "Sai: quá mức cần thiết cho thay đổi nhỏ."}], "answers": [0]}]}</script>
<script>
(function(){
"use strict";
var EXAM = JSON.parse(document.getElementById('exam-data').textContent);
var BASE = EXAM.questions, Q = [], N = BASE.length, DURATION = EXAM.durationSec;
var KEY = 'ccarf-mock::' + EXAM.examId;
var LET = 'ABCDEFG';
var state = load() || {phase:'intro', answers:{}, flags:{}, cur:0, startedAt:null, endsAt:null, submittedAt:null, result:null};
function shuf(n){ var a=[],i,j,t; for(i=0;i<n;i++)a.push(i); for(i=n-1;i>0;i--){ j=Math.floor(Math.random()*(i+1)); t=a[i];a[i]=a[j];a[j]=t; } return a; }
function newOrder(){ state.ord=shuf(N); state.oo=BASE.map(function(b){ return shuf(b.options.length); }); }
function applyOrder(){
  if(!state.ord || state.ord.length!==N || !state.oo){ if(state.answers && Object.keys(state.answers).length){ state.ord=shuf(0).concat(BASE.map(function(_,i){return i;})); state.oo=BASE.map(function(b){return b.options.map(function(_,k){return k;});}); } else newOrder(); save(); }
  Q = state.ord.map(function(qi){ var b=BASE[qi], p=state.oo[qi], o={}; for(var k in b) o[k]=b[k];
    o.options=p.map(function(k){ return b.options[k]; });
    o.answers=b.answers.map(function(a){ return p.indexOf(a); }).sort(function(x,y){return x-y;}); return o; });
}
applyOrder();
var timerH = null;

function load(){ try{ var s = localStorage.getItem(KEY); return s ? JSON.parse(s) : null; }catch(e){ return null; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function $(id){ return document.getElementById(id); }
function fmt(sec){ sec = Math.max(0, sec); var m = Math.floor(sec/60), s = sec%60; return (m<10?'0':'')+m+':'+(s<10?'0':'')+s; }
function remaining(){ return Math.max(0, Math.round((state.endsAt - Date.now())/1000)); }
function ansOf(i){ return state.answers[i] || []; }

/* ---------- chấm điểm ---------- */
function isCorrect(i){
  var a = ansOf(i).slice().sort(), c = Q[i].answers.slice().sort();
  if(a.length !== c.length) return false;
  for(var k=0;k<a.length;k++) if(a[k]!==c[k]) return false;
  return true;
}
function grade(){
  var correct = 0, dom = {}, scen = {};
  Object.keys(EXAM.domains).forEach(function(d){ dom[d] = {c:0,t:0}; });
  for(var i=0;i<N;i++){
    var q = Q[i], ok = isCorrect(i);
    if(ok) correct++;
    dom[q.domain].t++; if(ok) dom[q.domain].c++;
    scen[q.scenario] = scen[q.scenario] || {c:0,t:0};
    scen[q.scenario].t++; if(ok) scen[q.scenario].c++;
  }
  var scaled = Math.round(100 + 900*correct/N);
  return {correct:correct, total:N, scaled:scaled, pass: scaled >= 720, dom:dom, scen:scen};
}

/* ---------- màn hình ---------- */
function render(){
  clearInterval(timerH); timerH = null;
  var app = $('app');
  if(state.phase === 'intro') app.innerHTML = introHTML();
  else if(state.phase === 'exam') { app.innerHTML = examHTML(); startTimer(); bindExam(); }
  else app.innerHTML = resultHTML();
  if(state.phase === 'intro') bindIntro();
  if(state.phase === 'result') bindResult();
  window.scrollTo(0,0);
}

function introHTML(){
  var sc = EXAM.scenarioOrder.map(function(s){ var o = EXAM.scenarios[s]; return '<li><b>'+esc(o.title)+'</b><br><span class="mut small">'+esc(o.vi)+'</span></li>'; }).join('');
  var dm = Object.keys(EXAM.blueprint).map(function(d){ return '<tr><td>'+d+'</td><td>'+esc(EXAM.domains[d])+'</td><td>'+EXAM.blueprint[d]+' câu</td></tr>'; }).join('');
  return '<div class="wrap"><div class="card"><h1>Claude Certified Architect – Foundations (CCAR-F)</h1>'+
   '<div class="mut">Đề thi thử hằng ngày · '+esc(EXAM.date)+' · mã đề '+esc(EXAM.examId)+'</div></div>'+
   '<div class="card"><h2>Thông tin bài thi</h2><ul class="rules">'+
   '<li><b>'+N+' câu</b> trắc nghiệm một đáp án hoặc nhiều đáp án — mỗi câu ghi rõ “chọn N đáp án”.</li>'+
   '<li><b>Thời gian 120 phút</b>, đồng hồ đếm ngược; hết giờ bài tự nộp. Tải lại trang không mất bài và không reset đồng hồ.</li>'+
   '<li>Đề gồm <b>4 kịch bản</b> bốc từ 6 kịch bản. Hôm nay: '+EXAM.scenarioOrder.length+' kịch bản dưới đây.</li>'+
   '<li>Không hiện đúng/sai cho đến khi nộp bài. Câu nhiều đáp án chỉ được tính điểm khi chọn <b>đúng và đủ</b>.</li>'+
   '<li>Điểm quy đổi tuyến tính 100–1000 (<code>100 + 900 × số câu đúng / '+N+'</code>); <b>đạt từ 720</b> (≈ 42/60 câu đúng). Đây là ước lượng, không phải thang chấm thật.</li>'+
   '<li>Câu hỏi do bot tự biên soạn dựa trên Exam Guide v1.0, không phải đề thật — dùng để tìm chỗ yếu.</li></ul></div>'+
   '<div class="card"><h2>Kịch bản trong đề này</h2><ol>'+sc+'</ol></div>'+
   '<div class="card"><h2>Phân bổ theo lĩnh vực</h2><table>'+dm+'</table></div>'+
   '<div class="card"><button class="btn pri" id="start">Bắt đầu làm bài</button></div></div>';
}
function bindIntro(){
  $('start').onclick = function(){
    if(!state.answers || !Object.keys(state.answers).length){ newOrder(); applyOrder(); } state.phase='exam'; state.startedAt=Date.now(); state.endsAt=Date.now()+DURATION*1000; state.cur=0; save(); render();
  };
}

function examHTML(){
  return '<div class="top"><div class="title">CCAR-F · '+esc(EXAM.date)+'</div><div class="sp"></div>'+
   '<div class="mut small" id="prog"></div><div class="timer" id="timer">--:--</div>'+
   '<button class="btn pri" id="submit">Nộp bài</button></div>'+
   '<div class="wrap"><div class="layout"><div class="card" id="qbox"></div>'+
   '<div><div class="card"><h3>Bản đồ câu hỏi</h3><div class="map" id="map"></div>'+
   '<div class="legend" style="margin-top:10px"><span><i class="dot a"></i>Đã trả lời</span><span><i class="dot f"></i>Gắn cờ ⚑</span></div></div></div></div></div>'+
   '<div id="modal"></div>';
}
function bindExam(){
  $('submit').onclick = confirmSubmit;
  drawQ(); drawMap(); tick();
  document.onkeydown = function(e){
    if(state.phase!=='exam' || $('modal').innerHTML) return;
    if(e.key==='ArrowRight'){ go(state.cur+1); } else if(e.key==='ArrowLeft'){ go(state.cur-1); }
  };
}
function startTimer(){ timerH = setInterval(tick, 500); }
function tick(){
  if(state.phase!=='exam') return;
  var r = remaining(), t = $('timer');
  if(t){ t.textContent = fmt(r); t.className = 'timer'+(r<=600?' low':''); }
  if(r<=0) doSubmit(true);
}
function go(i){ if(i<0||i>=N) return; state.cur=i; save(); drawQ(); drawMap(); }
function drawProg(){
  var n=0; for(var i=0;i<N;i++) if(ansOf(i).length) n++;
  var p=$('prog'); if(p) p.textContent='Đã trả lời '+n+'/'+N;
}
function drawQ(){
  var i = state.cur, q = Q[i], a = ansOf(i), box = $('qbox');
  var prev = i>0 ? Q[i-1].scenario : null, newScen = (i===0 || prev !== q.scenario);
  var sc = EXAM.scenarios[q.scenario];
  var h = '<div class="scen"><b>'+esc(sc.title)+'</b>'+(newScen?'<br>':'<br>')+'<span class="small">'+esc(sc.text)+'</span></div>';
  h += '<div class="qno"><b>Câu '+(i+1)+' / '+N+'</b><span class="tag sel">'+(q.select>1?'Chọn '+q.select+' đáp án':'Chọn 1 đáp án')+'</span></div>';
  h += '<div class="stem">'+esc(q.stem)+'</div>';
  q.options.forEach(function(o, k){
    var on = a.indexOf(k) >= 0;
    h += '<label class="opt'+(on?' on':'')+'" data-k="'+k+'"><input type="'+(q.select>1?'checkbox':'radio')+'" name="q'+i+'" '+(on?'checked':'')+'><span class="l">'+LET[k]+'.</span><span>'+esc(o.text)+'</span></label>';
  });
  if(q.select>1) h += '<div class="small mut" id="selhint">Đã chọn '+a.length+'/'+q.select+'</div>';
  h += '<div class="nav"><button class="btn" id="prev"'+(i===0?' disabled':'')+'>← Câu trước</button>'+
       '<button class="btn flagbtn'+(state.flags[i]?' on':'')+'" id="flag">⚑ '+(state.flags[i]?'Bỏ cờ':'Gắn cờ xem lại')+'</button>'+
       '<button class="btn pri" id="next"'+(i===N-1?' disabled':'')+'>Câu sau →</button></div>';
  box.innerHTML = h;
  var opts = box.querySelectorAll('.opt');
  Array.prototype.forEach.call(opts, function(el){
    el.addEventListener('click', function(ev){
      ev.preventDefault();
