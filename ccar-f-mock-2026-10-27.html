      pick(i, parseInt(el.getAttribute('data-k'),10));
    });
  });
  $('prev').onclick = function(){ go(i-1); };
  $('next').onclick = function(){ go(i+1); };
  $('flag').onclick = function(){ if(state.flags[i]) delete state.flags[i]; else state.flags[i]=1; save(); drawQ(); drawMap(); };
  drawProg();
}
function pick(i, k){
  var q = Q[i], a = ansOf(i).slice(), pos = a.indexOf(k);
  if(q.select===1){ a=[k]; }
  else if(pos>=0){ a.splice(pos,1); }
  else if(a.length < q.select){ a.push(k); }
  else { var h=$('selhint'); if(h){ h.textContent='Đã đủ '+q.select+' đáp án — bỏ chọn một đáp án trước khi chọn đáp án khác.'; h.style.color='#b42318'; } return; }
  state.answers[i]=a.sort(function(x,y){return x-y;}); if(!a.length) delete state.answers[i];
  save(); drawQ(); drawMap();
}
function drawMap(){
  var m=$('map'); if(!m) return; var h='';
  for(var i=0;i<N;i++){
    var c=[]; if(ansOf(i).length) c.push('ans'); if(state.flags[i]) c.push('flag'); if(i===state.cur) c.push('cur');
    h+='<button class="'+c.join(' ')+'" data-i="'+i+'">'+(i+1)+'</button>';
  }
  m.innerHTML=h;
  Array.prototype.forEach.call(m.querySelectorAll('button'), function(b){ b.onclick=function(){ go(parseInt(b.getAttribute('data-i'),10)); }; });
  drawProg();
}

/* ---------- nộp bài ---------- */
function confirmSubmit(){
  var un=0, fl=0; for(var i=0;i<N;i++){ if(!ansOf(i).length) un++; if(state.flags[i]) fl++; }
  $('modal').innerHTML='<div class="modal"><div class="box"><h2>Nộp bài?</h2><p>Chưa trả lời: <b>'+un+'</b> câu · Đang gắn cờ: <b>'+fl+'</b> câu · Còn lại: <b>'+fmt(remaining())+'</b>.</p><p class="mut small">Sau khi nộp không sửa được đáp án.</p><div class="nav"><button class="btn" id="no">Làm tiếp</button><button class="btn bad" id="yes">Nộp bài</button></div></div></div>';
  $('no').onclick=function(){ $('modal').innerHTML=''; };
  $('yes').onclick=function(){ doSubmit(false); };
}
function doSubmit(auto){
  if(state.phase!=='exam') return;
  state.phase='result'; state.submittedAt=Date.now(); state.result=grade(); state.auto=!!auto; save();
  document.onkeydown=null; render();
}

/* ---------- kết quả ---------- */
var filter='all';
function resultHTML(){
  var r = state.result, used = Math.round(((state.submittedAt||Date.now()) - state.startedAt)/1000);
  var dm = Object.keys(EXAM.domains).map(function(d){
    var x=r.dom[d], p = x.t? Math.round(100*x.c/x.t):0;
    return '<tr><td><b>'+d+'</b> '+esc(EXAM.domains[d])+'</td><td>'+x.c+'/'+x.t+'</td><td style="width:35%"><div class="bar"><i style="width:'+p+'%"></i></div></td><td><b>'+p+'%</b></td></tr>';
  }).join('');
  var sc = Object.keys(r.scen).map(function(s){ var x=r.scen[s], p=Math.round(100*x.c/x.t); return '<tr><td>'+esc(EXAM.scenarios[s].title)+'</td><td>'+x.c+'/'+x.t+'</td><td><b>'+p+'%</b></td></tr>'; }).join('');
  var skip=0, wrong=0; for(var i=0;i<N;i++){ if(!ansOf(i).length) skip++; else if(!isCorrect(i)) wrong++; }
  var h='<div class="wrap"><div class="card"><div class="result-head"><div><div class="score '+(r.pass?'pass':'fail')+'">'+r.scaled+'</div><div class="mut">/ 1000 · điểm quy đổi tuyến tính</div></div>'+
   '<div><h1 class="'+(r.pass?'pass':'fail')+'">'+(r.pass?'ĐẠT (≥ 720)':'CHƯA ĐẠT (< 720)')+'</h1>'+
   '<div>Đúng <b>'+r.correct+'/'+r.total+'</b> · sai '+wrong+' · bỏ trống '+skip+'</div>'+
   '<div class="mut small">Thời gian làm: '+fmt(used)+(state.auto?' (hết giờ, tự nộp)':'')+' · Cần ≥ 42/60 câu để đạt theo quy đổi này.</div></div></div></div>'+
   '<div class="card"><h2>Phần trăm đúng theo lĩnh vực</h2><table>'+dm+'</table><div class="small mut" style="margin-top:8px">Lĩnh vực dưới 70% là chỗ cần ôn trước. Theo Exam Guide, % theo lĩnh vực chỉ để tham khảo, đạt/trượt tính theo tổng điểm.</div></div>'+
   '<div class="card"><h2>Theo kịch bản</h2><table>'+sc+'</table></div>'+
   '<div class="card"><h2>Xem lại bài làm và giải thích</h2><div class="filters" id="filters">'+
   fbtn('all','Tất cả')+fbtn('wrong','Sai / bỏ trống')+fbtn('flag','Đã gắn cờ')+fbtn('right','Đúng')+'</div><div id="review"></div></div>'+
   '<div class="card againbar"><button class="btn" id="again">Làm lại đề này</button> <span class="mut small">Xoá bài làm đã lưu và thi lại cùng đề (đề mới sinh bằng build_exam.py cho ngày khác).</span></div></div>';
  return h;
}
function fbtn(k,t){ return '<button class="btn'+(filter===k?' on':'')+'" data-f="'+k+'">'+t+'</button>'; }
function bindResult(){
  Array.prototype.forEach.call(document.querySelectorAll('#filters .btn'), function(b){ b.onclick=function(){ filter=b.getAttribute('data-f'); document.getElementById('filters').innerHTML=fbtn('all','Tất cả')+fbtn('wrong','Sai / bỏ trống')+fbtn('flag','Đã gắn cờ')+fbtn('right','Đúng'); bindResult(); }; });
  drawReview();
  $('again').onclick=function(){ if(confirm('Xoá bài làm và thi lại đề này?')){ try{localStorage.removeItem(KEY);}catch(e){} state={phase:'intro',answers:{},flags:{},cur:0,startedAt:null,endsAt:null,submittedAt:null,result:null}; newOrder(); applyOrder(); save(); render(); } };
}
function drawReview(){
  var h='';
  for(var i=0;i<N;i++){
    var q=Q[i], a=ansOf(i), ok=isCorrect(i), skip=!a.length;
    if(filter==='wrong' && ok) continue;
    if(filter==='right' && !ok) continue;
    if(filter==='flag' && !state.flags[i]) continue;
    var cls = ok?'right':(skip?'skip':'wrong');
    h+='<div class="rv '+cls+'"><div class="qno"><b>Câu '+(i+1)+'</b><span>'+
      '<span class="tag">'+q.domain+'</span> <span class="tag">KB'+q.scenario+'</span> <span class="tag">'+(q.select>1?'chọn '+q.select:'chọn 1')+'</span>'+
      (state.flags[i]?' <span class="tag">⚑</span>':'')+
      ' <span class="badge '+(ok?'g':(skip?'y':'r'))+'">'+(ok?'ĐÚNG':(skip?'BỎ TRỐNG':'SAI'))+'</span></span></div>'+
      '<div class="stem">'+esc(q.stem)+'</div>';
    q.options.forEach(function(o,k){
      var isC=q.answers.indexOf(k)>=0, picked=a.indexOf(k)>=0;
      h+='<div class="ro '+(isC?'c':'w')+'"><b>'+LET[k]+'.</b> '+esc(o.text)+
        (isC?'<span class="badge g">ĐÁP ÁN ĐÚNG</span>':'')+(picked?'<span class="badge '+(isC?'g':'r')+'">BẠN CHỌN</span>':'')+
        '<div class="ex">'+(isC?'✔ ':'✘ ')+esc(o.explanation)+'</div></div>';
    });
    h+='<div class="small mut">Nguồn: '+esc(q.source)+' · ID '+esc(q.id)+'</div></div>';
  }
  $('review').innerHTML = h || '<div class="mut">Không có câu nào trong mục này.</div>';
}

render();
})();
</script>
</body>
</html>
