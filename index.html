m; không phải giải pháp gốc."}, {"text": "Keep discovery in the main session but run /compact after each grep so the history stays smaller.", "explanation": "Sai: giúp được phần nào nhưng tóm tắt mất chi tiết và vẫn tốn context."}, {"text": "Delegate discovery to the Explore subagent and bring back a concise summary of the call sites into the main session.", "explanation": "Đúng: output khám phá nằm ở subagent; main giữ context gọn cho việc sửa."}], "answers": [3]}, {"id": "S2-08", "scenario": 2, "domain": "D3", "select": 1, "stem": "You're writing a /analyze-architecture skill that explores the codebase and produces very verbose intermediate output. Users only need the final report, and the main conversation must stay usable afterwards. What should you configure?", "source": "TS 3.2 · bài 3.2 Skills (context: fork)", "options": [{"text": "Set allowed-tools to read-oriented tools so the skill cannot produce side effects during exploration.", "explanation": "Sai: giới hạn quyền, không giới hạn context."}, {"text": "Tell the skill in its instructions to keep output short and to summarize its exploration as it goes along the way.", "explanation": "Sai: giảm độ dài nhưng vẫn vào context chính và giảm chất lượng khám phá."}, {"text": "Run /compact automatically at the end of the skill to shrink whatever it added to the conversation.", "explanation": "Sai: xử lý sau, vẫn tốn context trong lúc chạy."}, {"text": "Set context: fork in the SKILL.md frontmatter so the skill runs in an isolated context and returns its result.", "explanation": "Đúng: chạy cô lập, output dài không làm bẩn hội thoại chính."}], "answers": [3]}, {"id": "S2-06", "scenario": 2, "domain": "D2", "select": 1, "stem": "Your team wants a shared GitHub MCP server available to every developer in the repo. Tokens are personal, must never be committed, and the config should be reviewed like code. Where and how should it be configured?", "source": "TS 2.4 · bài 2.4 MCP Integration", "options": [{"text": "In the project .mcp.json committed to the repo, with the token referenced through ${GITHUB_TOKEN} expansion.", "explanation": "Đúng: cấu hình chung được review; mỗi người dùng token riêng qua biến môi trường."}, {"text": "In CLAUDE.md as instructions telling Claude how to connect to the GitHub server when needed.", "explanation": "Sai: CLAUDE.md không cấu hình MCP server."}, {"text": "In the project .mcp.json with a shared team token written inline, rotated monthly by the platform security team.", "explanation": "Sai: secret bị commit, dù có xoay vòng."}, {"text": "In each developer's user-level config, following a setup guide in the README with the server details.", "explanation": "Sai: không chia sẻ qua repo, dễ lệch cấu hình."}], "answers": [0]}, {"id": "S2-09", "scenario": 2, "domain": "D3", "select": 1, "stem": "A skill that scaffolds boilerplate files should be able to create files but must not run arbitrary shell commands, because it runs in repos with production deploy scripts. Which SKILL.md frontmatter setting expresses this?", "source": "TS 3.2 · bài 3.2 Skills (allowed-tools)", "options": [{"text": "allowed-tools, listing only the file-writing tools the skill needs and leaving out Bash.", "explanation": "Đúng: giới hạn tool ở mức cấu hình, tất định."}, {"text": "context: fork, so the skill runs in a separate context where shell commands cannot reach the repo.", "explanation": "Sai: fork cô lập context, không giới hạn quyền."}, {"text": "argument-hint, describing the allowed inputs so users cannot ask the skill to run commands.", "explanation": "Sai: chỉ là gợi ý tham số."}, {"text": "A line in the skill instructions saying not to run shell commands while scaffolding new files.", "explanation": "Sai: chỉ dẫn là xác suất; với script deploy cần cưỡng chế."}], "answers": [0]}, {"id": "S2-23", "scenario": 2, "domain": "D5", "select": 1, "stem": "Your session is full of verbose discovery output, responses are slowing down, but you still need the current working context to finish a refactor in the same session. Which built-in command reduces context usage?", "source": "TS 5.4 · bài 5.4 (/compact)", "options": [{"text": "/clear, which empties the conversation so the session continues with no prior history.", "explanation": "Sai: giải phóng hết nhưng mất ngữ cảnh đang cần."}, {"text": "/memory, which moves the current conversation into CLAUDE.md so it no longer counts as context.", "explanation": "Sai: /memory xem/sửa file memory, không nén hội thoại."}, {"text": "/compact, which summarizes the conversation so far and frees space while keeping the key context.", "explanation": "Đúng: giữ mạch làm việc, giảm token."}, {"text": "/resume, which reloads the session from disk in a lighter form without the earlier tool outputs.", "explanation": "Sai: tiếp tục phiên, không giảm context."}], "answers": [2]}, {"id": "S2-20", "scenario": 2, "domain": "D4", "select": 1, "stem": "Your code-review prompt labels almost everything 'high severity', so on-call engineers get paged for trivia. You need consistent labels across reviewers and repos. What helps most?", "source": "TS 4.1 · bài 4.1 (severity criteria)", "options": [{"text": "Define explicit criteria for each severity level, with one or two concrete code examples for every level.", "explanation": "Đúng: tiêu chí cụ thể + ví dụ cho nhãn nhất quán."}, {"text": "Reduce the number of levels to two (high and low) so there are fewer chances to mislabel.", "explanation": "Sai: đơn giản hơn nhưng không định nghĩa ranh giới."}, {"text": "Tell the model to be conservative and use 'high' just when it is very sure the issue matters to users.", "explanation": "Sai: vẫn mơ hồ, mỗi lần hiểu khác nhau."}, {"text": "Post-process the output and cap the number of high-severity findings at two per review.", "explanation": "Sai: cắt cơ học, có thể hạ nhãn lỗi thật."}], "answers": [0]}, {"id": "S2-12", "scenario": 2, "domain": "D3", "select": 1, "stem": "A stack trace clearly shows a null-pointer crash in one function of one file, and the fix is a one-line guard. Production is affected and the hotfix should ship within the hour. Which working mode fits?", "source": "TS 3.4 · bài 3.4 Plan Mode vs Direct", "options": [{"text": "An Explore subagent to search for similar null bugs elsewhere in the codebase before applying the fix.", "explanation": "Sai: có thể làm sau; không nên chặn hotfix."}, {"text": "Direct execution, because the change is small, the cause is known, and speed matters for the production hotfix.", "explanation": "Đúng: việc rõ, phạm vi nhỏ — làm luôn là hợp lý."}, {"text": "Plan mode first, so Claude can review the whole module before touching the file in production.", "explanation": "Sai: hợp với thay đổi lớn/mơ hồ; ở đây chỉ làm chậm hotfix."}, {"text": "Ask Claude to rewrite the function defensively with null checks on each variable it uses.", "explanation": "Sai: thay đổi rộng tăng rủi ro hotfix."}], "answers": [1]}]}</script>
<script>
(function(){
"use strict";
var EXAM = JSON.parse(document.getElementById('exam-data').textContent);
var BASE = EXAM.questions, Q = [], N = BASE.length, DURATION = EXAM.durationSec;
var KEY = 'ccarf-mock::' + EXAM.examId;
var LET = 'ABCDEFG';
var state = load() || {phase:'intro', answers:{}, flags:{}, cur:0, startedAt:null, endsAt:null, submittedAt:null, result:null};
function shuf(n){ var a=[],i,j,t; for(i=0;i<n;i++)a.push(i); for(i=n-1;i>0;i--){ j=Math.floor(Math.random()*(i+1)); t=a[i];a[i]=a[j];a[j]=t; } return a; }
function newOrder(){ state.ord=shuf(N); state.oo=BASE.map(function(b){ return shuf(b.options.length); }); }
function applyOrder(){
  if(!state.ord || state.ord.length!==N || !state.oo){ if(state.answers && Object.keys(state.answers).length){ state.ord=shuf(0).concat(BASE.map(function(_,i){return i;})); state.oo=BASE.map(function(b){return b.options.map(function(_,k){return k;});}); } else newOrder(); save(); }
  Q = state.ord.map(function(qi){ var b=BASE[qi], p=state.oo[qi], o={}; for(var k in b) o[k]=b[k];
    o.options=p.map(function(k){ return b.options[k]; });
    o.answers=b.answers.map(function(a){ return p.indexOf(a); }).sort(function(x,y){return x-y;}); return o; });
}
applyOrder();
var timerH = null;

function load(){ try{ var s = localStorage.getItem(KEY); return s ? JSON.parse(s) : null; }catch(e){ return null; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function $(id){ return document.getElementById(id); }
function fmt(sec){ sec = Math.max(0, sec); var m = Math.floor(sec/60), s = sec%60; return (m<10?'0':'')+m+':'+(s<10?'0':'')+s; }
function remaining(){ return Math.max(0, Math.round((state.endsAt - Date.now())/1000)); }
function ansOf(i){ return state.answers[i] || []; }

/* ---------- chấm điểm ---------- */
function isCorrect(i){
  var a = ansOf(i).slice().sort(), c = Q[i].answers.slice().sort();
  if(a.length !== c.length) return false;
  for(var k=0;k<a.length;k++) if(a[k]!==c[k]) return false;
  return true;
}
function grade(){
  var correct = 0, dom = {}, scen = {};
  Object.keys(EXAM.domains).forEach(function(d){ dom[d] = {c:0,t:0}; });
  for(var i=0;i<N;i++){
    var q = Q[i], ok = isCorrect(i);
    if(ok) correct++;
    dom[q.domain].t++; if(ok) dom[q.domain].c++;
    scen[q.scenario] = scen[q.scenario] || {c:0,t:0};
    scen[q.scenario].t++; if(ok) scen[q.scenario].c++;
  }
  var scaled = Math.round(100 + 900*correct/N);
  return {correct:correct, total:N, scaled:scaled, pass: scaled >= 720, dom:dom, scen:scen};
}

/* ---------- màn hình ---------- */
function render(){
  clearInterval(timerH); timerH = null;
  var app = $('app');
  if(state.phase === 'intro') app.innerHTML = introHTML();
  else if(state.phase === 'exam') { app.innerHTML = examHTML(); startTimer(); bindExam(); }
  else app.innerHTML = resultHTML();
  if(state.phase === 'intro') bindIntro();
  if(state.phase === 'result') bindResult();
  window.scrollTo(0,0);
}

function introHTML(){
  var sc = EXAM.scenarioOrder.map(function(s){ var o = EXAM.scenarios[s]; return '<li><b>'+esc(o.title)+'</b><br><span class="mut small">'+esc(o.vi)+'</span></li>'; }).join('');
  var dm = Object.keys(EXAM.blueprint).map(function(d){ return '<tr><td>'+d+'</td><td>'+esc(EXAM.domains[d])+'</td><td>'+EXAM.blueprint[d]+' câu</td></tr>'; }).join('');
  return '<div class="wrap"><div class="card"><h1>Claude Certified Architect – Foundations (CCAR-F)</h1>'+
   '<div class="mut">Đề thi thử hằng ngày · '+esc(EXAM.date)+' · mã đề '+esc(EXAM.examId)+'</div></div>'+
   '<div class="card"><h2>Thông tin bài thi</h2><ul class="rules">'+
   '<li><b>'+N+' câu</b> trắc nghiệm một đáp án hoặc nhiều đáp án — mỗi câu ghi rõ “chọn N đáp án”.</li>'+
   '<li><b>Thời gian 120 phút</b>, đồng hồ đếm ngược; hết giờ bài tự nộp. Tải lại trang không mất bài và không reset đồng hồ.</li>'+
   '<li>Đề gồm <b>4 kịch bản</b> bốc từ 6 kịch bản. Hôm nay: '+EXAM.scenarioOrder.length+' kịch bản dưới đây.</li>'+
   '<li>Không hiện đúng/sai cho đến khi nộp bài. Câu nhiều đáp án chỉ được tính điểm khi chọn <b>đúng và đủ</b>.</li>'+
   '<li>Điểm quy đổi tuyến tính 100–1000 (<code>100 + 900 × số câu đúng / '+N+'</code>); <b>đạt từ 720</b> (≈ 42/60 câu đúng). Đây là ước lượng, không phải thang chấm thật.</li>'+
   '<li>Câu hỏi do bot tự biên soạn dựa trên Exam Guide v1.0, không phải đề thật — dùng để tìm chỗ yếu.</li></ul></div>'+
   '<div class="card"><h2>Kịch bản trong đề này</h2><ol>'+sc+'</ol></div>'+
   '<div class="card"><h2>Phân bổ theo lĩnh vực</h2><table>'+dm+'</table></div>'+
   '<div class="card"><button class="btn pri" id="start">Bắt đầu làm bài</button></div></div>';
}
function bindIntro(){
  $('start').onclick = function(){
    if(!state.answers || !Object.keys(state.answers).length){ newOrder(); applyOrder(); } state.phase='exam'; state.startedAt=Date.now(); state.endsAt=Date.now()+DURATION*1000; state.cur=0; save(); render();
  };
}

function examHTML(){
  return '<div class="top"><div class="title">CCAR-F · '+esc(EXAM.date)+'</div><div class="sp"></div>'+
   '<div class="mut small" id="prog"></div><div class="timer" id="timer">--:--</div>'+
   '<button class="btn pri" id="submit">Nộp bài</button></div>'+
   '<div class="wrap"><div class="layout"><div class="card" id="qbox"></div>'+
   '<div><div class="card"><h3>Bản đồ câu hỏi</h3><div class="map" id="map"></div>'+
   '<div class="legend" style="margin-top:10px"><span><i class="dot a"></i>Đã trả lời</span><span><i class="dot f"></i>Gắn cờ ⚑</span></div></div></div></div></div>'+
   '<div id="modal"></div>';
}
function bindExam(){
  $('submit').onclick = confirmSubmit;
  drawQ(); drawMap(); tick();
  document.onkeydown = function(e){
    if(state.phase!=='exam' || $('modal').innerHTML) return;
    if(e.key==='ArrowRight'){ go(state.cur+1); } else if(e.key==='ArrowLeft'){ go(state.cur-1); }
  };
}
function startTimer(){ timerH = setInterval(tick, 500); }
function tick(){
  if(state.phase!=='exam') return;
  var r = remaining(), t = $('timer');
  if(t){ t.textContent = fmt(r); t.className = 'timer'+(r<=600?' low':''); }
  if(r<=0) doSubmit(true);
}
function go(i){ if(i<0||i>=N) return; state.cur=i; save(); drawQ(); drawMap(); }
function drawProg(){
  var n=0; for(var i=0;i<N;i++) if(ansOf(i).length) n++;
  var p=$('prog'); if(p) p.textContent='Đã trả lời '+n+'/'+N;
}
function drawQ(){
  var i = state.cur, q = Q[i], a = ansOf(i), box = $('qbox');
  var prev = i>0 ? Q[i-1].scenario : null, newScen = (i===0 || prev !== q.scenario);
  var sc = EXAM.scenarios[q.scenario];
  var h = '<div class="scen"><b>'+esc(sc.title)+'</b>'+(newScen?'<br>':'<br>')+'<span class="small">'+esc(sc.text)+'</span></div>';
  h += '<div class="qno"><b>Câu '+(i+1)+' / '+N+'</b><span class="tag sel">'+(q.select>1?'Chọn '+q.select+' đáp án':'Chọn 1 đáp án')+'</span></div>';
  h += '<div class="stem">'+esc(q.stem)+'</div>';
  q.options.forEach(function(o, k){
    var on = a.indexOf(k) >= 0;
    h += '<label class="opt'+(on?' on':'')+'" data-k="'+k+'"><input type="'+(q.select>1?'checkbox':'radio')+'" name="q'+i+'" '+(on?'checked':'')+'><span class="l">'+LET[k]+'.</span><span>'+esc(o.text)+'</span></label>';
  });
  if(q.select>1) h += '<div class="small mut" id="selhint">Đã chọn '+a.length+'/'+q.select+'</div>';
  h += '<div class="nav"><button class="btn" id="prev"'+(i===0?' disabled':'')+'>← Câu trước</button>'+
       '<button class="btn flagbtn'+(state.flags[i]?' on':'')+'" id="flag">⚑ '+(state.flags[i]?'Bỏ cờ':'Gắn cờ xem lại')+'</button>'+
       '<button class="btn pri" id="next"'+(i===N-1?' disabled':'')+'>Câu sau →</button></div>';
  box.innerHTML = h;
  var opts = box.querySelectorAll('.opt');
  Array.prototype.forEach.call(opts, function(el){
    el.addEventListener('click', function(ev){
      ev.preventDefault();
      pick(i, parseInt(el.getAttribute('data-k'),10));
    });
  });
  $('prev').onclick = function(){ go(i-1); };
  $('next').onclick = function(){ go(i+1); };
  $('flag').onclick = function(){ if(state.flags[i]) delete state.flags[i]; else state.flags[i]=1; save(); drawQ(); drawMap(); };
  drawProg();
}
function pick(i, k){
  var q = Q[i], a = ansOf(i).slice(), pos = a.indexOf(k);
  if(q.select===1){ a=[k]; }
  else if(pos>=0){ a.splice(pos,1); }
  else if(a.length < q.select){ a.push(k); }
  else { var h=$('selhint'); if(h){ h.textContent='Đã đủ '+q.select+' đáp án — bỏ chọn một đáp án trước khi chọn đáp án khác.'; h.style.color='#b42318'; } return; }
  state.answers[i]=a.sort(function(x,y){return x-y;}); if(!a.length) delete state.answers[i];
  save(); drawQ(); drawMap();
}
function drawMap(){
  var m=$('map'); if(!m) return; var h='';
  for(var i=0;i<N;i++){
    var c=[]; if(ansOf(i).length) c.push('ans'); if(state.flags[i]) c.push('flag'); if(i===state.cur) c.push('cur');
    h+='<button class="'+c.join(' ')+'" data-i="'+i+'">'+(i+1)+'</button>';
  }
  m.innerHTML=h;
  Array.prototype.forEach.call(m.querySelectorAll('button'), function(b){ b.onclick=function(){ go(parseInt(b.getAttribute('data-i'),10)); }; });
  drawProg();
}

/* ---------- nộp bài ---------- */
function confirmSubmit(){
  var un=0, fl=0; for(var i=0;i<N;i++){ if(!ansOf(i).length) un++; if(state.flags[i]) fl++; }
  $('modal').innerHTML='<div class="modal"><div class="box"><h2>Nộp bài?</h2><p>Chưa trả lời: <b>'+un+'</b> câu · Đang gắn cờ: <b>'+fl+'</b> câu · Còn lại: <b>'+fmt(remaining())+'</b>.</p><p class="mut small">Sau khi nộp không sửa được đáp án.</p><div class="nav"><button class="btn" id="no">Làm tiếp</button><button class="btn bad" id="yes">Nộp bài</button></div></div></div>';
  $('no').onclick=function(){ $('modal').innerHTML=''; };
  $('yes').onclick=function(){ doSubmit(false); };
}
function doSubmit(auto){
  if(state.phase!=='exam') return;
  state.phase='result'; state.submittedAt=Date.now(); state.result=grade(); state.auto=!!auto; save();
  document.onkeydown=null; render();
}

/* ---------- kết quả ---------- */
var filter='all';
function resultHTML(){
  var r = state.result, used = Math.round(((state.submittedAt||Date.now()) - state.startedAt)/1000);
  var dm = Object.keys(EXAM.domains).map(function(d){
    var x=r.dom[d], p = x.t? Math.round(100*x.c/x.t):0;
    return '<tr><td><b>'+d+'</b> '+esc(EXAM.domains[d])+'</td><td>'+x.c+'/'+x.t+'</td><td style="width:35%"><div class="bar"><i style="width:'+p+'%"></i></div></td><td><b>'+p+'%</b></td></tr>';
  }).join('');
  var sc = Object.keys(r.scen).map(function(s){ var x=r.scen[s], p=Math.round(100*x.c/x.t); return '<tr><td>'+esc(EXAM.scenarios[s].title)+'</td><td>'+x.c+'/'+x.t+'</td><td><b>'+p+'%</b></td></tr>'; }).join('');
  var skip=0, wrong=0; for(var i=0;i<N;i++){ if(!ansOf(i).length) skip++; else if(!isCorrect(i)) wrong++; }
  var h='<div class="wrap"><div class="card"><div class="result-head"><div><div class="score '+(r.pass?'pass':'fail')+'">'+r.scaled+'</div><div class="mut">/ 1000 · điểm quy đổi tuyến tính</div></div>'+
   '<div><h1 class="'+(r.pass?'pass':'fail')+'">'+(r.pass?'ĐẠT (≥ 720)':'CHƯA ĐẠT (< 720)')+'</h1>'+
   '<div>Đúng <b>'+r.correct+'/'+r.total+'</b> · sai '+wrong+' · bỏ trống '+skip+'</div>'+
   '<div class="mut small">Thời gian làm: '+fmt(used)+(state.auto?' (hết giờ, tự nộp)':'')+' · Cần ≥ 42/60 câu để đạt theo quy đổi này.</div></div></div></div>'+
   '<div class="card"><h2>Phần trăm đúng theo lĩnh vực</h2><table>'+dm+'</table><div class="small mut" style="margin-top:8px">Lĩnh vực dưới 70% là chỗ cần ôn trước. Theo Exam Guide, % theo lĩnh vực chỉ để tham khảo, đạt/trượt tính theo tổng điểm.</div></div>'+
   '<div class="card"><h2>Theo kịch bản</h2><table>'+sc+'</table></div>'+
   pqHTML()+
   '<div class="card"><h2>Xem lại bài làm và giải thích</h2><div class="filters" id="filters">'+
   fbtn('all','Tất cả')+fbtn('wrong','Sai / bỏ trống')+fbtn('flag','Đã gắn cờ')+fbtn('right','Đúng')+'</div><div id="review"></div></div>'+
   '<div class="card againbar"><button class="btn" id="again">Làm lại đề này</button> <span class="mut small">Xoá bài làm đã lưu và thi lại cùng đề (đề mới sinh bằng build_exam.py cho ngày khác).</span></div></div>';
  return h;
}
function pqHTML(){
  var rows='';
  for(var i=0;i<N;i++){
    var q=Q[i], a=ansOf(i), ok=isCorrect(i), hit=0;
    a.forEach(function(k){ if(q.answers.indexOf(k)>=0) hit++; });
    var sel=a.length?a.map(function(k){return LET[k];}).join(', '):'—';
    var cor=q.answers.map(function(k){return LET[k];}).join(', ');
    rows+='<tr><td>Câu '+(i+1)+'</td><td>'+q.domain+'</td><td>'+(q.select>1?'chọn '+q.select:'chọn 1')+'</td><td>'+sel+'</td><td>'+cor+'</td>'+
      '<td>'+(q.select>1?hit+'/'+q.answers.length+' ý đúng':'')+'</td><td><b class="'+(ok?'pass':'fail')+'">'+(ok?1:0)+'/1</b></td></tr>';
  }
  return '<div class="card"><h2>Điểm từng câu</h2><div class="small mut">Mỗi câu 1 điểm, chấm cả câu: câu chọn nhiều phải chọn đúng và đủ mới được 1 điểm (không có điểm từng phần).</div>'+
    '<table><tr><th>Câu</th><th>Lĩnh vực</th><th>Loại</th><th>Bạn chọn</th><th>Đáp án</th><th>Ý đúng</th><th>Điểm</th></tr>'+rows+'</table></div>';
}
function fbtn(k,t){ return '<button class="btn'+(filter===k?' on':'')+'" data-f="'+k+'">'+t+'</button>'; }
function bindResult(){
  Array.prototype.forEach.call(document.querySelectorAll('#filters .btn'), function(b){ b.onclick=function(){ filter=b.getAttribute('data-f'); document.getElementById('filters').innerHTML=fbtn('all','Tất cả')+fbtn('wrong','Sai / bỏ trống')+fbtn('flag','Đã gắn cờ')+fbtn('right','Đúng'); bindResult(); }; });
  drawReview();
  $('again').onclick=function(){ if(confirm('Xoá bài làm và thi lại đề này?')){ try{localStorage.removeItem(KEY);}catch(e){} state={phase:'intro',answers:{},flags:{},cur:0,startedAt:null,endsAt:null,submittedAt:null,result:null}; newOrder(); applyOrder(); save(); render(); } };
}
function drawReview(){
  var h='';
  for(var i=0;i<N;i++){
    var q=Q[i], a=ansOf(i), ok=isCorrect(i), skip=!a.length;
    if(filter==='wrong' && ok) continue;
    if(filter==='right' && !ok) continue;
    if(filter==='flag' && !state.flags[i]) continue;
    var cls = ok?'right':(skip?'skip':'wrong');
    h+='<div class="rv '+cls+'"><div class="qno"><b>Câu '+(i+1)+'</b><span>'+
      '<span class="tag">'+q.domain+'</span> <span class="tag">KB'+q.scenario+'</span> <span class="tag">'+(q.select>1?'chọn '+q.select:'chọn 1')+'</span>'+
      (state.flags[i]?' <span class="tag">⚑</span>':'')+
      ' <span class="badge '+(ok?'g':(skip?'y':'r'))+'">'+(ok?'ĐÚNG':(skip?'BỎ TRỐNG':'SAI'))+'</span></span></div>'+
      '<div class="stem">'+esc(q.stem)+'</div>';
    q.options.forEach(function(o,k){
      var isC=q.answers.indexOf(k)>=0, picked=a.indexOf(k)>=0;
      h+='<div class="ro '+(isC?'c':'w')+'"><b>'+LET[k]+'.</b> '+esc(o.text)+
        (isC?'<span class="badge g">ĐÁP ÁN ĐÚNG</span>':'')+(picked?'<span class="badge '+(isC?'g':'r')+'">BẠN CHỌN</span>':'')+
        '<div class="ex">'+(isC?'✔ ':'✘ ')+esc(o.explanation)+'</div></div>';
    });
    h+='<div class="small mut">Nguồn: '+esc(q.source)+' · ID '+esc(q.id)+'</div></div>';
  }
  $('review').innerHTML = h || '<div class="mut">Không có câu nào trong mục này.</div>';
}

render();
})();
</script>
</body>
</html>
