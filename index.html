<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CCAR-F Mock Exam — 2026-10-27</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#1c2230;--mut:#5d6677;--line:#d9dde5;--pri:#c2570b;--pri2:#9a4309;--ok:#157347;--bad:#b42318;--warn:#b7791f;--sel:#fff3e6}
*{box-sizing:border-box}
body{margin:0;font:16px/1.5 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink)}
button{font:inherit;cursor:pointer}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:16px}
h1{margin:0 0 6px;font-size:24px}h2{margin:0 0 10px;font-size:19px}h3{margin:0 0 8px;font-size:16px}
.mut{color:var(--mut)}.small{font-size:13px}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 16px}
.btn:hover{background:#f0f1f4}.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}.btn.pri:hover{background:var(--pri2)}
.btn.bad{background:var(--bad);border-color:var(--bad);color:#fff}.btn:disabled{opacity:.45;cursor:not-allowed}
.top{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.top .title{font-weight:600}.top .sp{flex:1}
.timer{font:700 22px ui-monospace,Menlo,Consolas,monospace;padding:4px 12px;border-radius:8px;background:#eef1f6}
.timer.low{background:#fde8e6;color:var(--bad)}
.layout{display:grid;grid-template-columns:1fr 280px;gap:16px}
@media(max-width:820px){.layout{grid-template-columns:1fr}}
.scen{background:#fff7ee;border:1px solid #f0cfae;border-radius:8px;padding:12px 14px;margin-bottom:14px}
.scen b{color:var(--pri2)}
.qno{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px;flex-wrap:wrap}
.tag{display:inline-block;background:#eef1f6;border-radius:999px;padding:2px 10px;font-size:13px;color:var(--mut)}
.tag.sel{background:#ffe9d1;color:var(--pri2);font-weight:600}
.stem{font-size:17px;margin:8px 0 14px;white-space:pre-wrap}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px;cursor:pointer;background:#fff}
.opt:hover{border-color:#b9bfcc}.opt.on{background:var(--sel);border-color:var(--pri)}
.opt input{margin-top:5px;accent-color:var(--pri)}
.opt .l{font-weight:700;min-width:20px}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.flagbtn.on{background:#fff3cd;border-color:var(--warn);color:#7a5200}
.map{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.map button{padding:6px 0;border:1px solid var(--line);border-radius:6px;background:#fff;font-size:13px;position:relative}
.map button.ans{background:#dff3e6;border-color:#8fcca6}
.map button.cur{outline:2px solid var(--pri)}
.map button.flag::after{content:"⚑";position:absolute;top:-6px;right:-2px;font-size:12px;color:var(--warn)}
.legend span{display:inline-block;margin-right:10px;font-size:12px;color:var(--mut)}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;border:1px solid var(--line);vertical-align:-1px;margin-right:4px}
.dot.a{background:#dff3e6}.dot.f{background:#fff3cd}
.hide{display:none!important}
.result-head{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.score{font-size:54px;font-weight:800;line-height:1}
.pass{color:var(--ok)}.fail{color:var(--bad)}
.bar{height:12px;border-radius:6px;background:#e6e9ef;overflow:hidden;min-width:140px}
.bar i{display:block;height:100%;background:var(--pri)}
table{border-collapse:collapse;width:100%}th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.rv{border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px;background:#fff}
.rv.right{border-left:5px solid var(--ok)}.rv.wrong{border-left:5px solid var(--bad)}.rv.skip{border-left:5px solid var(--warn)}
.ro{border-radius:8px;padding:8px 10px;margin:6px 0;border:1px solid var(--line)}
.ro.c{background:#e8f6ee;border-color:#9fd3b4}.ro.w{background:#fdeceb;border-color:#f0b3ae}
.ro .ex{font-size:14px;color:#33394a;margin-top:4px}
.badge{font-size:12px;font-weight:700;border-radius:4px;padding:1px 6px;margin-left:6px}
.badge.g{background:var(--ok);color:#fff}.badge.r{background:var(--bad);color:#fff}.badge.y{background:#e5e7eb;color:#333}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.filters .btn.on{background:#1c2230;color:#fff}
.modal{position:fixed;inset:0;background:rgba(15,20,30,.55);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
.modal .box{background:#fff;border-radius:12px;padding:22px;max-width:480px;width:100%}
ul.rules li{margin:4px 0}
.againbar{position:sticky;bottom:8px;z-index:20;box-shadow:0 -2px 12px rgba(0,0,0,.25);margin-top:12px}@media(max-width:600px){.againbar{padding:8px 10px}.againbar .small{display:none}}
</style>
</head>

<script type="application/json" id="exam-data">{"examId": "2026-10-27-1256", "date": "2026-10-27", "durationSec": 7200, "blueprint": {"D1": 16, "D2": 11, "D3": 12, "D4": 12, "D5": 9}, "domains": {"D1": "Agentic Architecture & Orchestration", "D2": "Tool Design & MCP Integration", "D3": "Claude Code Configuration & Workflows", "D4": "Prompt Engineering & Structured Output", "D5": "Context Management & Reliability"}, "scenarios": {"1": {"title": "Kịch bản 1 — Customer Support Resolution Agent", "text": "You are building a customer support resolution agent using the Claude Agent SDK. The agent handles high-ambiguity requests such as returns, billing disputes and account issues, using custom MCP tools (get_customer, lookup_order, process_refund, escalate_to_human). Target: 80%+ first-contact resolution while knowing when to escalate.", "vi": "Agent hỗ trợ khách hàng (Agent SDK + MCP tools): xử lý đổi trả, khiếu nại; biết lúc nào phải chuyển cho người."}, "2": {"title": "Kịch bản 2 — Code Generation with Claude Code", "text": "Your team uses Claude Code for code generation, refactoring, debugging and documentation. You need to integrate it into the workflow with custom slash commands, CLAUDE.md configuration, and understand when to use plan mode versus direct execution.", "vi": "Viết code với Claude Code: CLAUDE.md, lệnh tắt riêng, khi nào lập kế hoạch trước, khi nào làm luôn."}, "5": {"title": "Kịch bản 5 — Claude Code for Continuous Integration", "text": "You are integrating Claude Code into your CI/CD pipeline. The system runs automated code reviews, generates test cases and provides feedback on pull requests. You need prompts that give actionable feedback and minimize false positives.", "vi": "Claude Code trong CI/CD: tự review code, sinh test, góp ý pull request mà ít báo sai."}, "6": {"title": "Kịch bản 6 — Structured Data Extraction", "text": "You are building a structured data extraction system with Claude. It extracts information from unstructured documents, validates output with JSON schemas and maintains high accuracy. It must handle edge cases gracefully and integrate with downstream systems.", "vi": "Trích xuất dữ liệu: biến tài liệu thô thành JSON đúng định dạng, xử lý được trường hợp lạ."}}, "scenarioOrder": ["6", "5", "1", "2"], "questions": [{"id": "S6-04", "scenario": 6, "domain": "D1", "select": 1, "stem": "An insurer's claims-extraction agent runs ~40k documents/day. Some runs return a partial record because the loop exits as soon as the first content block is text, even though the model also requested extract_fields. The team wants a fix that is reliable without adding per-call cost or latency budgets that ops must tune. What should they do?", "source": "TS 1.1 · bài 1.1", "options": [{"text": "Ask the model to append the marker DONE when finished and exit the loop when that marker appears anywhere in the assistant's text.", "explanation": "Sai: parse ngôn ngữ tự nhiên dễ vỡ (model quên, hoặc in DONE giữa chừng). Chỉ hợp khi API không có tín hiệu dừng — ở đây có."}, {"text": "Add a short system instruction telling the model to emit the tool call before any text, and keep checking the first block.", "explanation": "Sai: chỉ giảm xác suất, không đảm bảo; vẫn dựa vào thứ tự block thay vì stop_reason. Hợp lý như bổ trợ, không phải cách sửa gốc."}, {"text": "Keep looping while stop_reason is 'tool_use', appending each tool_result, and exit when the response ends with 'end_turn'.", "explanation": "Đúng: stop_reason là tín hiệu có cấu trúc do API trả về, không tốn thêm token hay tham số phải tinh chỉnh. Vòng lặp chỉ dừng khi model thực sự xong."}, {"text": "Cap the loop at a fixed five iterations so long documents finish, and treat any text block after that as the final extracted answer.", "explanation": "Sai: cap cố định là lưới an toàn chống loop vô hạn, nhưng không trả lời câu 'đã xong chưa'; vẫn cắt sớm hoặc chạy thừa."}], "answers": [2]}, {"id": "S6-27", "scenario": 6, "domain": "D5", "select": 2, "stem": "A lender's document-extraction service auto-accepts most loan files, but only three reviewers are available per shift and SLA penalties apply if the review queue grows. Which TWO categories should be routed to the human queue to get the most risk reduction per reviewer hour?", "source": "TS 5.5 · bài 5.5", "options": [{"text": "Extractions with low confidence, using thresholds calibrated on a labeled validation set rather than the model's raw self-reported score.", "explanation": "Đúng: confidence đã hiệu chuẩn khoanh đúng vùng hay sai, giữ queue nhỏ. Điểm tự báo chưa hiệu chuẩn thì không tin được."}, {"text": "A rotating sample of the largest loans by amount, because financial impact is highest there even when the extraction itself looks clean.", "explanation": "Sai: chọn theo giá trị khoản vay là quyết định chính sách rủi ro, không phải theo khả năng extraction sai; tốn công cho file rõ ràng."}, {"text": "Every extraction from the newest customer segment during the first quarter, so reviewers can build a baseline before trusting automation.", "explanation": "Sai: an toàn nhưng tốn công cho cả ca dễ, vượt năng lực 3 người. Hợp khi chưa có dữ liệu hiệu chuẩn và còn dư người review."}, {"text": "Files where processing took longer than average, since slow runs usually mean the model struggled and the output is more likely wrong.", "explanation": "Sai: độ trễ phản ánh độ dài tài liệu/tải hệ thống nhiều hơn độ khó; tín hiệu yếu, làm phình queue."}, {"text": "Extractions whose source documents are ambiguous or contradict themselves, where the model cannot settle the value from the text alone.", "explanation": "Đúng: người có thêm ngữ cảnh/quyền xác minh giải quyết được, model thì không — mỗi giờ review đem lại nhiều giá trị nhất."}], "answers": [0, 4]}, {"id": "S6-12", "scenario": 6, "domain": "D3", "select": 1, "stem": "Your extraction team needs to add an optional 'tax_id' field (nullable) to a stable invoice schema that lives in one file and is well covered by tests. A release is due today and the reviewer wants minimal churn. How should you use Claude Code?", "source": "TS 3.4 · bài 3.4", "options": [{"text": "Start in plan mode so Claude can survey each consumer of the schema first, then approve the written plan before any edit is applied.", "explanation": "Sai: plan mode đáng giá khi thay đổi chạm nhiều file/còn mơ hồ; ở đây làm chậm release mà không giảm rủi ro đáng kể."}, {"text": "Use direct execution: the change is small, the location and intent are clear, and the existing tests will catch regressions quickly.", "explanation": "Đúng: việc nhỏ, rõ phạm vi — plan mode chỉ thêm thời gian. Test có sẵn đóng vai lưới an toàn."}, {"text": "Ask Claude to regenerate the whole schema file from a fresh description so formatting and field ordering become fully consistent.", "explanation": "Sai: viết lại cả file tăng churn và rủi ro thay đổi ngoài ý muốn, trái với yêu cầu tối thiểu thay đổi."}, {"text": "Delegate the change to an Explore subagent that maps the call sites, then let the main session apply edits based on its summary.", "explanation": "Sai: Explore hợp khi khám phá codebase lớn làm đầy context; một file rõ ràng thì là overhead."}], "answers": [1]}, {"id": "S6-01", "scenario": 6, "domain": "D1", "select": 1, "stem": "A logistics extractor calls three tools: OCR returns Unix timestamps, the CRM returns ISO 8601, and a legacy ERP returns '03/04/24' with ambiguous day/month. Validation keeps failing on event order. You want one fix that is deterministic, keeps prompts short, and doesn't require changing vendor systems. What fits best?", "source": "TS 1.5 · bài 1.5 Hooks", "options": [{"text": "Add a validation retry: when the event order is wrong, send the error back to the model and ask it to re-extract with more care.", "explanation": "Sai: retry hữu ích với lỗi định dạng, nhưng ngày dd/mm mơ hồ thì model vẫn đoán; tốn thêm call mà không tất định."}, {"text": "Ask each vendor team to change their API to return ISO 8601, and hold the pipeline rollout until the three teams have shipped it.", "explanation": "Sai: về lâu dài sạch nhất nhưng phụ thuộc đội khác, chậm, và đề yêu cầu không sửa hệ thống vendor."}, {"text": "A PostToolUse hook that converts each tool's dates to one canonical format, using the ERP's known locale, before the model sees them.", "explanation": "Đúng: hook chạy bằng code, tất định, không tốn token prompt và không cần sửa hệ thống ngoài."}, {"text": "A longer system prompt describing each source's date format with worked examples, asking the model to normalize dates itself while it reasons.", "explanation": "Sai: rẻ để làm nhưng chỉ là xác suất và tốn token mỗi lượt. Hợp khi không có điểm can thiệp vào kết quả tool."}], "answers": [2]}, {"id": "S6-03", "scenario": 6, "domain": "D1", "select": 1, "stem": "A procurement pipeline always runs: extract fields → validate against schema → enrich from master data → format for ERP export. Each stage needs different instructions, and auditors want to see where a bad value entered. Which design balances quality, debuggability and cost?", "source": "TS 1.6 · bài 1.6 Prompt Chaining", "options": [{"text": "A coordinator agent that decides dynamically which stage to run next and spawns a dedicated subagent for each stage as it sees fit.", "explanation": "Sai: điều phối động hợp khi luồng không đoán trước; ở đây thêm chi phí và tính bất định cho một quy trình cố định."}, {"text": "A prompt chain with one focused prompt per stage and a programmatic validation check between stages, logging every intermediate result.", "explanation": "Đúng: luồng cố định, dễ đoán → chaining. Mỗi bước tập trung, có điểm kiểm tra và log cho auditor."}, {"text": "One larger prompt that performs the four stages at once, which reduces the number of calls and therefore the total latency per document.", "explanation": "Sai: ít call hơn nhưng lẫn mục tiêu, khó biết lỗi phát sinh ở đâu. Hợp khi tài liệu đơn giản và không cần audit."}, {"text": "Four subagents running in parallel on the same document, with the coordinator merging their outputs into a single export record.", "explanation": "Sai: các bước phụ thuộc tuần tự (enrich cần dữ liệu đã validate) nên chạy song song không đúng bản chất."}], "answers": [1]}, {"id": "S6-10", "scenario": 6, "domain": "D2", "select": 1, "stem": "A load_document tool feeds a contracts pipeline. It fails for three reasons: the PDF is password-protected, the file server times out, or the path is malformed. Today all three return 'Error loading file', and the agent retries each one three times, wasting minutes. Which change best supports recovery?", "source": "TS 2.2 · bài 2.2", "options": [{"text": "Keep the generic message but raise the retry count to five with exponential backoff, which resolves most of the temporary server timeouts.", "explanation": "Sai: giúp lỗi timeout, nhưng vẫn retry vô ích file có mật khẩu/path sai — tốn thêm thời gian."}, {"text": "Return an empty document body on failure so the extractor produces null fields and the run completes without interrupting the batch.", "explanation": "Sai: che lỗi thành 'không có dữ liệu', downstream không phân biệt được — đúng là điều phải tránh."}, {"text": "Return a structured error with a category (auth, transient, invalid_input), an isRetryable flag and a short description.", "explanation": "Đúng: agent biết lỗi tạm thời thì retry, lỗi cố định thì xin mật khẩu/sửa path hoặc chuyển người — tiết kiệm thời gian và call."}, {"text": "Stop the whole pipeline on any load failure so that no partial or inconsistent results can ever reach the later stages of the system.", "explanation": "Sai: an toàn tuyệt đối nhưng một file lỗi chặn cả lô. Hợp khi lô phải nhất quán toàn bộ, không phải ở đây."}], "answers": [2]}, {"id": "S6-13", "scenario": 6, "domain": "D3", "select": 1, "stem": "A migration script mishandles nulls in a 'discount' column. Two rounds of prose bug descriptions produced fixes that broke other rows. The data team needs a fix today and wants evidence it is right before running on production. What gives Claude the clearest target?", "source": "TS 3.5 · bài 3.5", "options": [{"text": "Rewrite the bug description in more detail, explaining the business meaning of the discount column and how nulls arise upstream.", "explanation": "Sai: ngữ cảnh có ích nhưng vẫn là văn xuôi — đã thất bại 2 lần. Hợp khi Claude thiếu hiểu biết nghiệp vụ, không phải thiếu mục tiêu."}, {"text": "Run the script on a copy of production, paste the full error log into the session, and ask Claude to fix whatever fails next.", "explanation": "Sai: sửa theo log từng lỗi một, không định nghĩa kết quả mong muốn, dễ tiếp tục phá các dòng khác."}, {"text": "Switch to plan mode and ask Claude to list every place nulls could appear in the entire codebase before proposing a new fix.", "explanation": "Sai: mở rộng phạm vi, chậm; vấn đề là thiếu tiêu chí đúng cụ thể chứ không phải thiếu khảo sát."}, {"text": "Provide concrete test cases: sample input rows including nulls and edge values, with the exact expected output for each of them.", "explanation": "Đúng: ví dụ input/output loại bỏ mơ hồ của mô tả, đồng thời là bằng chứng kiểm chứng trước khi chạy production."}], "answers": [3]}, {"id": "S6-08", "scenario": 6, "domain": "D2", "select": 1, "stem": "Every document must start with extract_metadata (its output drives routing), and later turns may use any enrichment tool. Model choice of the first tool has been ~95% correct, but the 5% misses cause expensive re-runs. How do you guarantee the first call without losing flexibility later?", "source": "TS 2.3 · bài 2.3", "options": [{"text": "Expose only extract_metadata for the entire conversation and run enrichment in a separate pipeline that is triggered afterwards.", "explanation": "Sai: tất định nhưng phải dựng thêm pipeline, mất khả năng model chọn tool enrichment theo ngữ cảnh."}, {"text": "Force the first request with tool_choice {\"type\": \"tool\", \"name\": \"extract_metadata\"}, then use auto for the following turns.", "explanation": "Đúng: bắt buộc tất định đúng chỗ cần, các lượt sau vẫn linh hoạt. Không tốn thêm token prompt."}, {"text": "Strengthen the system prompt with 'call extract_metadata first' in bold and add two few-shot examples showing this exact ordering.", "explanation": "Sai: cải thiện xác suất (95%→cao hơn) nhưng không bảo đảm; hợp khi lỗi rẻ, ở đây lỗi gây re-run đắt."}, {"text": "Set tool_choice to 'any' on each turn so that the model is required to call some tool and cannot answer with plain text instead.", "explanation": "Sai: 'any' buộc gọi tool nhưng không buộc đúng tool; vẫn có thể chọn sai cái đầu, và cứng nhắc cho các lượt sau."}], "answers": [1]}, {"id": "S6-11", "scenario": 6, "domain": "D3", "select": 1, "stem": "Twelve developers on the extraction repo keep producing inconsistent schema names and null-handling. Rules must apply for everyone who clones the repo, be reviewed like code, and not depend on each person's local setup. Where should they live?", "source": "TS 3.1 · bài 3.1", "options": [{"text": "In each developer's ~/.claude/CLAUDE.md, distributed through an onboarding script that copies the team's rules into place.", "explanation": "Sai: user-level không nằm trong repo, dễ lệch phiên bản. Hợp cho sở thích cá nhân, không cho chuẩn team."}, {"text": "In a wiki page linked from the README, which developers paste into the session at the start of each extraction task.", "explanation": "Sai: phụ thuộc thao tác thủ công, dễ quên; không tự động nạp."}, {"text": "In the project CLAUDE.md (or .claude/CLAUDE.md) committed to the repository, so changes go through normal code review.", "explanation": "Đúng: cấp project được chia sẻ qua git, có review — đáp ứng cả ba ràng buộc."}, {"text": "In a CLAUDE.local.md at the repo root, which each developer keeps identical by following the team's onboarding checklist.", "explanation": "Sai: file .local dành cho cấu hình cá nhân không commit — trái mục tiêu chia sẻ qua review."}], "answers": [2]}, {"id": "S6-05", "scenario": 6, "domain": "D1", "select": 1, "stem": "A legal-ops team checks 30 related supplier contracts for consistent party names and effective dates. Loading all of them into one pass is close to the context limit and gives uneven attention. They need results within an hour and want inconsistencies explained. What structure is best?", "source": "TS 1.6 / 4.6 · bài 1.6", "options": [{"text": "Keep one pass but move the most important contracts to the end of the prompt, where the model tends to pay the most attention.", "explanation": "Sai: sắp xếp vị trí chỉ giảm nhẹ hiệu ứng, không giải quyết gần giới hạn context và chú ý không đều."}, {"text": "Compare contracts pairwise in each combination so a request holds just two documents and attention stays focused on them.", "explanation": "Sai: tập trung tốt nhưng số cặp tăng bậc hai (435 lượt) — tốn chi phí và có thể vượt thời hạn một giờ."}, {"text": "Use a model with a larger context window and send the 30 contracts in one request, which avoids the complexity of a multi-pass design.", "explanation": "Sai: đơn giản hơn nhưng chú ý vẫn suy giảm khi input dài; hợp khi tài liệu ít và ngắn."}, {"text": "Extract key fields from each contract in its own pass, then run a separate cross-document pass over those fields to flag the mismatches.", "explanation": "Đúng: mỗi lượt tập trung một hợp đồng, lượt tổng hợp chỉ cần dữ liệu đã rút gọn — vừa context vừa chất lượng."}], "answers": [3]}, {"id": "S6-29", "scenario": 6, "domain": "D2", "select": 1, "stem": "Your extraction agent has extract_invoice_fields, extract_receipt_fields and extract_contract_terms. Credit notes are routed to the wrong tool about 15% of the time. You want the cheapest change that is likely to work before considering redesign. What is the best first step?", "source": "TS 2.1 · bài 2.1", "options": [{"text": "Add a fourth tool, extract_credit_note_fields, so the problem document type has its own dedicated path with a tailored schema.", "explanation": "Sai: thêm tool làm tập lựa chọn đông hơn, dễ nhầm hơn nếu mô tả vẫn mơ hồ."}, {"text": "Rewrite each tool description to state accepted document types, a short example, and when to use the other tools instead.", "explanation": "Đúng: description là thứ model dùng để chọn tool; sửa rẻ, nhanh, thường đủ. Nên thử trước khi thiết kế lại."}, {"text": "Merge the three tools into one extract_document tool with a 'doc_type' parameter so the model no longer has to choose between them.", "explanation": "Sai: có thể đúng về lâu dài nhưng là thay đổi lớn (schema, downstream); không phải bước đầu rẻ nhất."}, {"text": "Add a classifier model call before extraction that labels the document type and then forces the matching tool through tool_choice.", "explanation": "Sai: tất định hơn nhưng tốn thêm call và độ trễ mỗi tài liệu; hợp khi sửa description vẫn không đủ."}], "answers": [1]}, {"id": "S6-25", "scenario": 6, "domain": "D5", "select": 1, "stem": "An invoice shows two different totals (the summary page says 4,200 and the line items sum to 4,020). Nothing else in the document resolves it. Finance accepts a small review backlog but treats wrong payments as a serious incident. What should the pipeline do?", "source": "TS 4.4 / 5.5 · bài 5.5", "options": [{"text": "Return null for the total so that validation fails cleanly, and let the vendor resubmit the invoice in the next billing cycle.", "explanation": "Sai: mất cả hai giá trị và làm trễ thanh toán cả chu kỳ; hợp khi không có quy trình review."}, {"text": "Use the sum of the line items because it is computed from detail, and note in a comment field that the summary page disagreed.", "explanation": "Sai: thường hợp lý, nhưng có thể chính dòng chi tiết sai; tự quyết rủi ro trả sai — điều finance coi là nghiêm trọng."}, {"text": "Retry extraction with a stronger model and a prompt that asks it to think harder until it returns a single consistent total.", "explanation": "Sai: retry không tạo ra thông tin mới; model chỉ chọn một con số với độ tự tin giả."}, {"text": "Record both values, set a conflict_detected flag on the record, and route the extraction to human review rather than guessing.", "explanation": "Đúng: dữ liệu mâu thuẫn từ nguồn thì model không thể đúng chắc chắn; người review có kênh xác minh. Chi phí backlog nhỏ chấp nhận được."}], "answers": [3]}, {"id": "S6-18", "scenario": 6, "domain": "D4", "select": 1, "stem": "A purchase order says 'payment terms per attached master agreement', but the agreement was never uploaded. The extractor has retried validation on payment_terms four times. Each retry costs a call and delays the batch. What is the right handling?", "source": "TS 4.4 · bài 4.4 (limits of retry)", "options": [{"text": "Ask the model to infer the likely terms from the supplier's previous orders in the same batch, then mark the field as inferred.", "explanation": "Sai: suy luận từ đơn khác có thể hữu ích như gợi ý cho reviewer, nhưng không nên tự điền như dữ liệu trích xuất."}, {"text": "Fill payment_terms with the company's standard Net 30, which applies to most suppliers, so the record can pass validation.", "explanation": "Sai: bịa giá trị mặc định có thể sai hợp đồng; chỉ hợp khi chính sách quy định default rõ ràng."}, {"text": "Stop retrying: the information is absent, so return null with a reason (missing_reference) or route the record for review.", "explanation": "Đúng: retry chỉ giúp lỗi định dạng/hiểu sai khi thông tin có trong nguồn; ở đây nguồn không có."}, {"text": "Retry with the validation error included in the prompt, since feedback about the exact failure usually lets the model correct itself.", "explanation": "Sai: đúng với lỗi định dạng, nhưng không thể sửa dữ liệu không tồn tại — chỉ tốn thêm call."}], "answers": [2]}, {"id": "S6-21", "scenario": 6, "domain": "D4", "select": 1, "stem": "A nightly Message Batches job extracts 1,000 shipping documents. 40 fail: about half exceeded the context limit, the rest hit transient errors. Results are due by 7 a.m. and the budget is tight. What is the best handling?", "source": "TS 4.5 · bài 4.5", "options": [{"text": "Resubmit the whole batch of 1,000 with a larger max_tokens setting so each document gets a consistent second processing pass overnight.", "explanation": "Sai: tốn gấp đôi chi phí; max_tokens là giới hạn output, không sửa lỗi vượt context input."}, {"text": "Drop the 40 failures from tonight's output and let the next nightly run pick them up again with tomorrow's documents.", "explanation": "Sai: rẻ nhất nhưng trễ SLA và tài liệu quá dài sẽ lỗi lại mãi nếu không chia nhỏ."}, {"text": "Resubmit only the failed items by custom_id, splitting the oversized documents into chunks first, and keep the successful results.", "explanation": "Đúng: chỉ xử lý lại phần lỗi (rẻ), sửa nguyên nhân gốc cho tài liệu quá dài, giữ batch cho chi phí thấp."}, {"text": "Move the 40 failures to synchronous calls immediately and send them unchanged, since the real-time API handles bigger inputs.", "explanation": "Sai: gọi đồng bộ nhanh hơn nhưng giới hạn context giống nhau — tài liệu quá dài vẫn lỗi; hợp cho phần lỗi tạm thời gấp."}], "answers": [2]}, {"id": "S6-15", "scenario": 6, "domain": "D4", "select": 1, "stem": "A 'document_category' field feeds routing rules. Most documents fall into eight known types, new types appear a few times a month, and sometimes even humans can't tell the type. Downstream code must not crash on surprises. Which schema fits?", "source": "TS 4.3 · bài 4.3", "options": [{"text": "A free-text string so the model can name any type it sees, with downstream code mapping common spellings to the routing rules.", "explanation": "Sai: linh hoạt nhưng đẩy độ phức tạp xuống downstream, dễ vỡ khi model viết khác nhau."}, {"text": "A required enum of the known types plus a confidence number, routing anything below 0.5 confidence to a manual sorting queue.", "explanation": "Sai: confidence giúp nhưng vẫn không có chỗ cho loại mới; model vẫn phải gán sai một loại đã biết."}, {"text": "A strict enum of the eight known types, which forces the model to pick the closest match and keeps the downstream routing logic simple.", "explanation": "Sai: ép chọn gần nhất tạo dữ liệu sai âm thầm; chỉ hợp khi tập loại thực sự đóng."}, {"text": "An enum of the known types plus 'other' and 'unclear', with an optional detail string that is filled in when 'other' is chosen.", "explanation": "Đúng: routing vẫn dùng enum ổn định, có lối thoát cho loại mới và ca mơ hồ, chi tiết giúp mở rộng enum sau này."}], "answers": [3]}, {"id": "S6-23", "scenario": 6, "domain": "D5", "select": 1, "stem": "Your pipeline auto-accepts extractions above a calibrated confidence threshold, saving most review cost. Last quarter a vendor changed its invoice layout and errors in the accepted stream went unnoticed for weeks. How do you detect such novel error patterns without reviewing everything?", "source": "TS 5.5 · bài 5.5", "options": [{"text": "Review a stratified random sample of the auto-accepted stream (by vendor and document type) and track the error rates per stratum.", "explanation": "Đúng: lấy mẫu phân tầng phát hiện lỗi mới ở luồng đã tự duyệt với chi phí nhỏ, và chỉ ra nhóm nào xấu đi."}, {"text": "Raise the confidence threshold so fewer documents are auto-accepted, which pushes more of the borderline cases into human review.", "explanation": "Sai: giảm rủi ro chung nhưng tăng chi phí, và lỗi tự tin cao (như layout mới) vẫn lọt qua."}, {"text": "Ask the model to re-check each accepted extraction a second time and flag any it now disagrees with for human review.", "explanation": "Sai: gấp đôi chi phí; model có cùng điểm mù với lần đầu nên khó phát hiện lỗi hệ thống."}, {"text": "Monitor the overall accuracy metric weekly and investigate when it drops more than two points below its baseline for the quarter.", "explanation": "Sai: số tổng che lỗi của một vendor nhỏ; phát hiện chậm như sự cố vừa xảy ra."}], "answers": [0]}, {"id": "S5-27", "scenario": 5, "domain": "D3", "select": 2, "stem": "A platform team is adding Claude Code to a GitHub Actions job that reviews PRs. Runners have no TTY, jobs time out after 15 minutes, and review rules must be consistent across 40 repos. Which TWO choices are appropriate?", "source": "TS 3.6 · bài 3.6", "options": [{"text": "Put testing standards and review criteria in the repository's CLAUDE.md so each run loads the same rules without long prompts.", "explanation": "Đúng: chuẩn nằm trong repo, được version, nạp tự động — nhất quán giữa các lần chạy."}, {"text": "Run with the -p (print) flag so the job processes the prompt non-interactively and exits instead of waiting for user input.", "explanation": "Đúng: runner không có TTY; chế độ tương tác sẽ treo đến timeout."}, {"text": "Use --resume with one shared session across PRs so Claude remembers previous reviews and keeps its feedback consistent.", "explanation": "Sai: trộn ngữ cảnh giữa các PR, context phình to; nhất quán nên đến từ CLAUDE.md."}, {"text": "Start an interactive session in the runner and pipe 'yes' into stdin to auto-approve any permission prompts that appear.", "explanation": "Sai: dễ vỡ và tự duyệt mọi quyền — mất kiểm soát an toàn."}, {"text": "Enable plan mode for each CI run so that Claude cannot write files, which makes the review job safe by default across the 40 repos.", "explanation": "Sai: plan mode là chế độ tương tác để duyệt kế hoạch; giới hạn quyền trong CI nên dùng allowed tools."}], "answers": [0, 1]}, {"id": "S5-28", "scenario": 5, "domain": "D1", "select": 1, "stem": "A PR touches 22 files. A single review prompt gives deep comments on the first files and shallow ones on the last. The team also cares about bugs that span files (an API change and its callers). Which restructuring addresses the root cause?", "source": "TS 1.6 / 4.6 · bài 1.6", "options": [{"text": "Review files in parallel independent passes and post their comments directly, skipping any combined step to minimize latency.", "explanation": "Sai: nhanh và tập trung nhưng mất hoàn toàn lỗi liên file mà đội quan tâm."}, {"text": "Review each file in its own focused pass, then run a separate integration pass over the summaries to catch cross-file issues.", "explanation": "Đúng: tách để mỗi file được chú ý đầy đủ, pass tích hợp giữ được góc nhìn liên file."}, {"text": "Keep one prompt but tell the model to give each file equal attention and to write a similar number of comments for each of them.", "explanation": "Sai: chỉ dẫn không khắc phục suy giảm chú ý khi input dài; số comment ép đều còn sinh comment rác."}, {"text": "Review the files with the most changed lines, since those carry most of the risk, and skip trivial files to save cost.", "explanation": "Sai: rẻ hơn nhưng bỏ sót lỗi ở file nhỏ (ví dụ caller bị ảnh hưởng)."}], "answers": [1]}, {"id": "S5-24", "scenario": 5, "domain": "D4", "select": 2, "stem": "Your team is choosing between synchronous calls and the Message Batches API for several CI workloads (some agentic, some bulk analysis). Which TWO statements about the Batches API are correct?", "source": "TS 4.5 · bài 4.5", "options": [{"text": "It guarantees results within one hour, which makes it suitable for blocking pre-merge checks as long as the batch stays small.", "explanation": "Sai: không có SLA độ trễ; batch nhỏ thường nhanh nhưng không được bảo đảm."}, {"text": "Results come back in the same order the requests were submitted, so a custom_id is optional when the batch is small enough.", "explanation": "Sai: phải đối chiếu kết quả bằng custom_id; không dựa vào thứ tự."}, {"text": "A batch request cannot execute tools mid-request and feed results back within that same request, so agent loops do not fit.", "explanation": "Đúng: batch là mỗi request một lượt; vòng lặp tool cần gọi đồng bộ."}, {"text": "Batches automatically retry failed items until they succeed, so callers do not need to handle per-item errors.", "explanation": "Sai: phải tự xử lý và gửi lại item lỗi."}, {"text": "It costs roughly 50% less than synchronous calls, but there is no latency guarantee; results may take up to 24 hours.", "explanation": "Đúng: đánh đổi chi phí lấy độ trễ — hợp việc không ai chờ."}], "answers": [2, 4]}, {"id": "S5-16", "scenario": 5, "domain": "D3", "select": 1, "stem": "A teammate proposes 'add -p to our CI command; that turns on plan mode so Claude can't change files, and we can drop our tool restrictions.' Security wants a clear answer before approving. What is correct?", "source": "TS 3.6 · bài 3.6 (-p)", "options": [{"text": "Incorrect: -p runs Claude non-interactively (print mode); file safety still has to come from tool permissions or hooks.", "explanation": "Đúng: -p và plan mode là hai khái niệm khác nhau; bỏ giới hạn tool sẽ mở quyền ghi trong CI."}, {"text": "Partly correct: -p prevents edits only when combined with --output-format json, so keep JSON output and drop the restrictions.", "explanation": "Sai: định dạng output không ảnh hưởng quyền ghi file."}, {"text": "Correct: -p stands for plan, and in non-interactive runs it prevents edits, so separate tool restrictions become redundant.", "explanation": "Sai: nhầm lẫn phổ biến; -p là print, không chặn ghi file."}, {"text": "Correct for CI: in headless runners Claude Code defaults to read-only mode, so -p simply makes that default behavior explicit.", "explanation": "Sai: không có mặc định read-only kiểu đó; quyền phụ thuộc cấu hình tool."}], "answers": [0]}, {"id": "S5-05", "scenario": 5, "domain": "D1", "select": 1, "stem": "A monorepo PR touches six independent packages. The coordinator agent reviews them one subagent at a time, taking 18 minutes; developers want results in under 5. Packages share no code, and each subagent needs only its package's diff and conventions. Which delegation is best?", "source": "TS 1.3 · bài 1.3", "options": [{"text": "Keep sequential subagents but pass each one the full conversation history so it understands the whole PR before starting.", "explanation": "Sai: vẫn chậm, và nhồi lịch sử thừa làm tốn token, giảm tập trung."}, {"text": "Emit several Task calls in a single coordinator response, giving each subagent its package diff and conventions explicitly.", "explanation": "Đúng: các gói độc lập nên chạy song song; subagent không tự kế thừa context nên phải truyền đủ."}, {"text": "Let each subagent spawn further subagents per file, so the work fans out as widely as possible and the review finishes sooner.", "explanation": "Sai: phân nhánh quá sâu tăng chi phí và phối hợp phức tạp, lợi ích thêm nhỏ."}, {"text": "Have one subagent review the six packages at once so it can spot cross-package issues while avoiding coordination overhead.", "explanation": "Sai: hợp khi các gói phụ thuộc nhau; ở đây độc lập nên chỉ chậm và loãng chú ý."}], "answers": [1]}, {"id": "S5-06", "scenario": 5, "domain": "D2", "select": 1, "stem": "A CI job and all developers need the team's GitHub MCP server. The token is a CI secret on runners and a personal token locally; it must never be committed. Config should be reviewed in PRs like other infra. How should the server be configured?", "source": "TS 2.4 · bài 2.4", "options": [{"text": "Hard-code the server in the CI workflow YAML, and ask developers to register the same server manually on their machines.", "explanation": "Sai: hai nguồn cấu hình dễ lệch; dev phải tự làm thủ công."}, {"text": "In each user's ~/.claude.json with the token written inline, and a separate copy of that file baked into the CI runner image.", "explanation": "Sai: không chia sẻ/review qua repo, secret nằm dạng rõ trong image."}, {"text": "In the project .mcp.json with the token written inline, while adding .mcp.json to .gitignore so it is not pushed.", "explanation": "Sai: ignore file thì không còn cấu hình chung để review; mất mục tiêu chia sẻ."}, {"text": "In the project .mcp.json committed to the repo, referencing the token through env var expansion such as ${GITHUB_TOKEN}.", "explanation": "Đúng: cấu hình chia sẻ, review được; secret ở biến môi trường khác nhau cho CI và máy cá nhân."}], "answers": [3]}, {"id": "S5-15", "scenario": 5, "domain": "D3", "select": 1, "stem": "One CI job asks Claude Code to implement a feature, and a later step in the same session reviews its own diff. Reviews approve almost everything. Budget allows one extra call per PR. What is the best redesign?", "source": "TS 3.6 / 4.6 · bài 3.6", "options": [{"text": "Ask the same session to review twice and approve only when both passes agree, which reduces chance agreement.", "explanation": "Sai: hai lần cùng ngữ cảnh có cùng điểm mù; tốn call mà không độc lập."}, {"text": "Run the review in a separate Claude instance that sees the diff and review criteria, not the reasoning behind the code.", "explanation": "Đúng: phiên tạo code mang theo giả định của chính nó; phiên độc lập soi lỗi khách quan hơn, chỉ thêm một call."}, {"text": "Drop the AI review step and rely on the existing unit tests, which are objective and cannot be biased by the generator.", "explanation": "Sai: test có ích nhưng không bắt lỗi thiết kế/bảo mật ngoài phạm vi test."}, {"text": "Keep the same session but add 'be extremely critical of this code' to the review prompt and require at least three findings per PR.", "explanation": "Sai: ép số lượng finding sinh false positive; vẫn mang thiên kiến từ ngữ cảnh sinh code."}], "answers": [1]}, {"id": "S5-01", "scenario": 5, "domain": "D1", "select": 1, "stem": "Your CI review must check three aspects of every PR in order: style, security, then test coverage. The aspects are always the same and don't depend on each other's findings. You want predictable cost and easy debugging. Which decomposition fits?", "source": "TS 1.6 · bài 1.6 Task Decomposition", "options": [{"text": "A single prompt asking for the three aspects together, which minimizes calls and keeps the whole review in one place for developers.", "explanation": "Sai: rẻ nhất về số call nhưng dễ lẫn mục tiêu, khó tách lỗi theo khía cạnh."}, {"text": "Prompt chaining: a fixed sequence of focused prompts, one per aspect, each with its own criteria and output section.", "explanation": "Đúng: luồng cố định, đoán trước → chaining rẻ, dễ debug từng bước."}, {"text": "A coordinator agent that inspects the PR and decides which aspects are worth checking and in which order each time.", "explanation": "Sai: linh hoạt nhưng tốn chi phí và khó đoán; hợp khi các bước thay đổi theo từng PR."}, {"text": "An open-ended agent loop with tools to explore the repo freely until it judges that the review is complete.", "explanation": "Sai: hợp điều tra mở; với checklist cố định thì tốn và kém ổn định."}], "answers": [1]}, {"id": "S5-03", "scenario": 5, "domain": "D1", "select": 1, "stem": "A CI Claude job must never modify files under .github/workflows/, whatever the model decides, because a change there could leak secrets. Other edits are allowed. What is the best control?", "source": "TS 1.5 · bài 1.5 Hooks", "options": [{"text": "Review the final diff after the job and revert any workflow changes before the branch is pushed to the remote.", "explanation": "Sai: kiểm tra sau có ích làm lớp phụ, nhưng file đã bị sửa và có thể đã chạy."}, {"text": "A clear rule in CLAUDE.md stating that workflow files are off-limits, with an explanation of the secret-leak risk.", "explanation": "Sai: hướng dẫn chỉ là xác suất; với rủi ro lộ secret cần cưỡng chế."}, {"text": "Remove Write and Edit from the job entirely, so Claude can only read files and propose patches as comments.", "explanation": "Sai: an toàn nhưng mất khả năng sửa file hợp lệ mà job cần; hợp khi job chỉ review."}, {"text": "A PreToolUse hook that inspects Write/Edit calls and blocks any whose target path is under .github/workflows/.", "explanation": "Đúng: chặn bằng code, tất định, vẫn cho phép sửa các file khác."}], "answers": [3]}, {"id": "S5-07", "scenario": 5, "domain": "D2", "select": 1, "stem": "A CI review agent should analyze code and report findings but never change anything. It currently has full tool access and once ran a formatter that rewrote files. How should its tools be scoped?", "source": "TS 2.3 · bài 2.3", "options": [{"text": "Restrict it to read-oriented tools such as Read, Grep and Glob, so it can analyze but has no way to modify files.", "explanation": "Đúng: nguyên tắc quyền tối thiểu; agent chỉ cần đọc."}, {"text": "Keep full access but instruct it in the prompt not to modify files and to report its findings as plain text comments.", "explanation": "Sai: chỉ dẫn không ngăn được hành vi như sự cố vừa rồi."}, {"text": "Give it the full tool set but run it on a disposable runner, so any changes are discarded when the job finishes.", "explanation": "Sai: giới hạn tác động nhưng vẫn có thể đẩy commit/gọi API; không đúng nguyên tắc quyền tối thiểu."}, {"text": "Allow Bash but not Write or Edit, since analysis sometimes needs commands, and Bash cannot write files directly.", "explanation": "Sai: Bash ghi file được (redirect, formatter) — chính là đường sự cố đã xảy ra."}], "answers": [0]}, {"id": "S5-11", "scenario": 5, "domain": "D3", "select": 1, "stem": "A script posts findings from a CI Claude run as inline PR comments. Parsing free text broke twice last month when the wording changed. You need output a script can parse every time. Which flags make the output reliably parseable?", "source": "TS 3.6 · bài 3.6", "options": [{"text": "Use --output-format json together with --json-schema describing the findings (file, line, severity, message).", "explanation": "Đúng: định dạng có cấu trúc và schema cố định — script không phụ thuộc cách diễn đạt."}, {"text": "Ask in the prompt for a markdown table with fixed columns, and parse the table rows with a tolerant regular expression.", "explanation": "Sai: dễ làm nhưng vẫn là text tự do, regex vỡ khi model đổi định dạng."}, {"text": "Use --output-format text and post-process with a second Claude call that converts the text into JSON.", "explanation": "Sai: thêm call và thêm một điểm có thể sai; không tất định."}, {"text": "Use --verbose so the full transcript is printed, then extract the findings from the final assistant message.", "explanation": "Sai: verbose để debug, không tạo output có cấu trúc."}], "answers": [0]}, {"id": "S5-29", "scenario": 5, "domain": "D4", "select": 1, "stem": "Your team runs two Claude workloads: a pre-merge security check that developers wait on, and a weekly full-repository audit nobody waits on. Finance asks you to cut costs without hurting developer experience. How should you apply the Message Batches API?", "source": "TS 4.5 · bài 4.5", "options": [{"text": "Keep both synchronous, since mixing two APIs increases maintenance burden and the savings on one weekly job are fairly small.", "explanation": "Sai: đơn giản nhưng bỏ phí tiết kiệm lớn trên job chạy cả repo."}, {"text": "Move both workloads to batches to get the 50% discount everywhere, and poll frequently so pre-merge results arrive quickly.", "explanation": "Sai: tiết kiệm nhiều hơn nhưng pre-merge có thể chờ hàng giờ; poll không làm batch nhanh hơn."}, {"text": "Use batches for the pre-merge check because those requests are small, and synchronous calls for the large weekly audit.", "explanation": "Sai: ngược trade-off: việc cần nhanh lại dùng thứ không bảo đảm độ trễ."}, {"text": "Use batches for the weekly audit and keep synchronous calls for the pre-merge check, where latency directly blocks developers.", "explanation": "Đúng: batch rẻ ~50% nhưng không bảo đảm độ trễ — hợp việc không ai chờ."}], "answers": [3]}, {"id": "S5-09", "scenario": 5, "domain": "D2", "select": 1, "stem": "post_pr_comment returns 403 when the token lacks permission and 503 when GitHub is briefly down, but both reach the agent as 'Failed'. The agent keeps retrying 403s and gives up on 503s. What should change?", "source": "TS 2.2 · bài 2.2", "options": [{"text": "Make the tool retry internally three times for each error, so the agent sees just the failures that persisted after backoff.", "explanation": "Sai: retry nội bộ hợp cho lỗi tạm thời nhưng vô ích với 403 và che thông tin cho agent."}, {"text": "Return structured errors with a category (permission vs. transient) and an isRetryable flag, plus a short readable message text.", "explanation": "Đúng: agent cần biết lỗi nào đáng retry; thông tin này chỉ tool biết."}, {"text": "Pass the raw HTTP response body to the agent, so it can read GitHub's error text and decide what to do.", "explanation": "Sai: có thông tin nhưng không chuẩn hóa; agent phải tự diễn giải, dễ sai."}, {"text": "Tell the agent in its prompt to retry exactly twice on any 'Failed' result, then escalate the PR to a human reviewer.", "explanation": "Sai: quy tắc đồng nhất cho hai loại lỗi khác nhau; vẫn retry 403 vô ích."}], "answers": [1]}, {"id": "S5-19", "scenario": 5, "domain": "D4", "select": 1, "stem": "Developers ignore your bug-focused CI reviewer because a third of its comments are style nits and local-convention complaints. You want fewer false positives without missing real defects. Which prompt change is most effective?", "source": "TS 4.1 · bài 4.1", "options": [{"text": "Lower the temperature to zero so the reviewer behaves more conservatively and produces fewer speculative comments.", "explanation": "Sai: temperature ảnh hưởng tính ngẫu nhiên, không định nghĩa phạm vi cần báo."}, {"text": "Add 'report issues you are highly confident about' so the model filters out uncertain comments by itself before posting.", "explanation": "Sai: chỉ dẫn mơ hồ; model không hiệu chuẩn tốt độ tự tin, có thể bỏ lỡ lỗi thật."}, {"text": "Limit the reviewer to at most three comments per PR, so that the most important issues are what reach the developers each time.", "explanation": "Sai: cắt số lượng không phân biệt loại; có thể vẫn là nit và cắt mất lỗi thật."}, {"text": "State explicit scope: report bugs and security flaws with evidence; skip style nits and local conventions already handled by linters.", "explanation": "Đúng: tiêu chí cụ thể về cái cần và cái bỏ — giảm nhiễu mà không giảm độ phủ lỗi thật."}], "answers": [3]}, {"id": "S5-25", "scenario": 5, "domain": "D5", "select": 1, "stem": "Your CI reviewer shows 96% accuracy overall, yet developers say its dependency-upgrade findings are almost always wrong. Leadership wants to know whether to keep the tool. What is the most appropriate response?", "source": "TS 5.5 · bài 5.5", "options": [{"text": "Measure accuracy per finding category; the aggregate can hide a weak segment that should be fixed or disabled.", "explanation": "Đúng: số tổng che yếu điểm một nhóm nhỏ; đo theo nhóm cho quyết định đúng (giữ phần tốt, sửa/tắt phần xấu)."}, {"text": "Disable the reviewer entirely until accuracy improves, because developer trust matters more than any single metric does.", "explanation": "Sai: mất giá trị ở các nhóm đang hoạt động tốt; hợp chỉ khi lỗi lan rộng."}, {"text": "Trust the 96% overall figure, since anecdotes from a few developers are less reliable than the measured accuracy.", "explanation": "Sai: phản hồi cụ thể chỉ đúng chỗ số tổng che; cần kiểm chứng chứ không bỏ qua."}, {"text": "Retrain the reviewer prompt with more general examples so that overall accuracy rises above 98%.", "explanation": "Sai: nhắm vào số tổng thay vì nhóm yếu; có thể tăng tổng mà nhóm dependency vẫn sai."}], "answers": [0]}, {"id": "S1-26", "scenario": 1, "domain": "D1", "select": 2, "stem": "A retailer's support agent sometimes calls process_refund for an account it never verified; compliance calls each case a reportable incident. The agent must still handle unusual conversations flexibly. Which TWO changes enforce verification deterministically?", "source": "TS 1.4 / 1.5 · bài 1.4 & 1.5", "options": [{"text": "Few-shot examples showing the agent verifying identity before refunding in several different conversation styles.", "explanation": "Sai: cải thiện hành vi trung bình, không bảo đảm; hợp cho chất lượng, không cho tuân thủ bắt buộc."}, {"text": "A nightly audit job that flags refunds without verification so the team can reverse them the next morning.", "explanation": "Sai: phát hiện sau khi sự cố đã xảy ra; là lớp giám sát phụ, không phải cưỡng chế."}, {"text": "A gate in the tool layer that keeps process_refund unavailable until get_customer has returned a verified customer ID.", "explanation": "Đúng: điều kiện tiên quyết được cưỡng chế trong code, không phụ thuộc model nhớ quy tắc."}, {"text": "A PreToolUse hook that rejects any process_refund call whose customer ID was not returned as verified earlier in the session.", "explanation": "Đúng: kiểm tra bằng code trước khi tool chạy — tất định, các bước khác vẫn do model quyết định."}, {"text": "A system prompt rule in capital letters stating that verification has to happen before any refund is issued to a customer.", "explanation": "Sai: giảm tần suất nhưng vẫn xác suất; không đủ cho lỗi bị coi là sự cố tuân thủ."}], "answers": [2, 3]}, {"id": "S1-17", "scenario": 1, "domain": "D4", "select": 1, "stem": "Customer replies from the support agent vary in structure: some lack next steps, others bury the refund decision at the end. CSAT is dropping. Two rounds of more detailed written instructions didn't help, and prompt length is already high. What technique is most effective?", "source": "TS 4.2 · bài 4.2 Few-shot", "options": [{"text": "Run a second model call that rewrites each reply into the right structure before sending it to the customer.", "explanation": "Sai: hiệu quả nhưng gấp đôi chi phí và độ trễ cho mỗi phản hồi."}, {"text": "Add two or three short few-shot examples of replies with the target structure, covering different request types.", "explanation": "Đúng: ví dụ truyền đạt định dạng hiệu quả hơn mô tả dài, tốn ít token hơn thêm chỉ dẫn."}, {"text": "Force each reply through a JSON schema with fixed fields, then render the fields into text with a template.", "explanation": "Sai: rất nhất quán nhưng câu trả lời cứng, mất tự nhiên với khách; hợp khi output cho máy đọc."}, {"text": "Add another paragraph to the instructions that restates the required structure in stronger and more explicit language.", "explanation": "Sai: đã thử 2 lần thất bại, và prompt đã dài; thêm chữ ít tác dụng."}], "answers": [1]}, {"id": "S1-06", "scenario": 1, "domain": "D1", "select": 1, "stem": "A colleague proposes replacing the model-driven loop with a decision tree: 'if the message contains refund, run lookup_order then process_refund.' Customers often combine unusual requests, but refunds above $500 legally require a manager check. What is the best evaluation?", "source": "TS 1.1 · bài 1.1 Agentic Loops (model-driven vs decision tree)", "options": [{"text": "Adopt the decision tree everywhere, since deterministic routing is safer and simpler to test than a loop.", "explanation": "Sai: tất định nhưng vỡ với yêu cầu kết hợp; hợp khi đầu vào hẹp và đồng nhất."}, {"text": "Keep the model loop unchanged and describe the $500 manager rule in the system prompt with a clear example.", "explanation": "Sai: linh hoạt nhưng quy tắc pháp lý chỉ được tuân theo xác suất."}, {"text": "Keep model-driven tool selection, and enforce just the compliance-critical step (the manager check) in code.", "explanation": "Đúng: kết hợp: model xử lý tình huống đa dạng, code cưỡng chế điểm bắt buộc."}, {"text": "Use the decision tree for refunds and the model loop for everything else, switching on the keyword 'refund' in the message.", "explanation": "Sai: từ khóa định tuyến dễ sai với yêu cầu kết hợp; vẫn không cưỡng chế ngưỡng $500."}], "answers": [2]}, {"id": "S1-03", "scenario": 1, "domain": "D1", "select": 1, "stem": "A customer writes: 'I want to return the blender, I was double-charged for my subscription, and please update my shipping address.' Your target is first-contact resolution, and customers dislike getting several separate messages. How should the agent handle it?", "source": "TS 1.4 · bài 1.4 Workflow Enforcement & Handoff", "options": [{"text": "Handle the first request and ask the customer to open new tickets for the other two so each case stays clean.", "explanation": "Sai: gọn cho hệ thống ticket nhưng làm giảm FCR và trải nghiệm khách."}, {"text": "Reply separately to each request as soon as it is resolved, so the customer gets the fastest possible answer for each item.", "explanation": "Sai: nhanh từng phần nhưng khách nhận nhiều tin, đúng điều họ không thích."}, {"text": "Split it into three items, investigate each with the shared customer context, then send one combined reply covering all three.", "explanation": "Đúng: xử lý đủ cả ba (FCR), dùng chung ngữ cảnh, trả lời một lần đúng mong muốn khách."}, {"text": "Escalate the whole conversation to a human, since multi-issue messages are complex and risk mistakes by the agent.", "explanation": "Sai: an toàn nhưng lãng phí người cho các việc agent tự làm được."}], "answers": [2]}, {"id": "S1-20", "scenario": 1, "domain": "D4", "select": 1, "stem": "When escalating, the agent must output a handoff object (customer_id, root_cause, refund_amount, recommended_action) that a ticketing system parses. Parse failures currently drop 3% of escalations. Which technique most reliably guarantees schema-valid output?", "source": "TS 4.3 · bài 4.3 Structured Output", "options": [{"text": "Define a handoff tool with a JSON schema for those fields and force it with tool_choice naming that tool when escalating.", "explanation": "Đúng: tool use với schema + tool_choice bắt buộc là cách đáng tin nhất để có output đúng cấu trúc."}, {"text": "Have the agent write a plain-text summary, then use regular expressions to extract each field for the ticketing system.", "explanation": "Sai: dễ vỡ khi diễn đạt thay đổi, chính là nguồn lỗi parse."}, {"text": "Ask for JSON in the prompt with an example object, and wrap the parser in a retry that re-asks on failure.", "explanation": "Sai: giảm lỗi nhưng không bảo đảm, retry thêm độ trễ; hợp khi không dùng được tool use."}, {"text": "Prefill the assistant turn with an opening brace so the model continues in JSON for the rest of its reply.", "explanation": "Sai: cải thiện định dạng nhưng không ép đúng các trường/kiểu dữ liệu."}], "answers": [0]}, {"id": "S1-05", "scenario": 1, "domain": "D1", "select": 1, "stem": "Your MCP tools return Unix timestamps (orders), ISO 8601 (billing) and numeric codes (shipping status). The agent sometimes misreads event order and tells customers the wrong refund timeline. You can't change the backends this quarter. What is the best fix?", "source": "TS 1.5 · bài 1.5 Agent SDK Hooks", "options": [{"text": "Ask the backend teams to standardize on ISO 8601 and readable statuses in next quarter's roadmap.", "explanation": "Sai: tốt lâu dài nhưng không giải quyết vấn đề quý này."}, {"text": "Explain each format and the status code table in the system prompt so the model converts the values itself while it reasons.", "explanation": "Sai: tốn token mỗi lượt và chỉ xác suất; hợp tạm thời khi không có hook."}, {"text": "Add a final self-check step where the agent re-reads the tool results and verifies the timeline before replying.", "explanation": "Sai: thêm call, vẫn dựa vào model đọc đúng định dạng lẫn lộn."}, {"text": "A PostToolUse hook that normalizes timestamps to one format and maps status codes to names before the model sees them.", "explanation": "Đúng: chuẩn hóa tất định tại điểm trả kết quả, không cần sửa backend, không tốn token giải thích."}], "answers": [3]}, {"id": "S1-19", "scenario": 1, "domain": "D4", "select": 1, "stem": "Each night you audit 8,000 closed support conversations for policy compliance. Results are needed by 9 a.m., cost matters, and each audit is a single-turn judgment with no tools. Which approach fits?", "source": "TS 4.5 · bài 4.5 Batch Processing", "options": [{"text": "Submit them through the Message Batches API and match each result to its conversation by custom_id.", "explanation": "Đúng: việc một lượt, không ai chờ ngay — batch rẻ ~50%, thời hạn sáng hôm sau là đủ."}, {"text": "Send 8,000 synchronous requests with high concurrency so the results are guaranteed before the team arrives.", "explanation": "Sai: nhanh và chắc chắn hơn nhưng đắt gấp đôi; hợp khi thời hạn sát."}, {"text": "Audit a random 10% sample each night synchronously, since that gives a statistically useful compliance estimate.", "explanation": "Sai: rẻ hơn nhưng yêu cầu là audit tất cả, không phải ước lượng."}, {"text": "Concatenate many conversations into each request so fewer calls are needed, then split the results by delimiter.", "explanation": "Sai: giảm số call nhưng giảm chú ý và khó tách kết quả đáng tin."}], "answers": [0]}, {"id": "S1-16", "scenario": 1, "domain": "D3", "select": 1, "stem": "Claude Code follows the team's conventions in some sessions in the support-agent repo but not in others. You suspect different memory files are being loaded depending on the directory. Which command helps you diagnose this first?", "source": "TS 3.1 · bài 3.1 (/memory)", "options": [{"text": "/memory, to see which CLAUDE.md memory files are loaded for the current session and open them for editing.", "explanation": "Đúng: hiển thị trực tiếp các file memory đang nạp — chẩn đoán nhanh nhất."}, {"text": "/clear, to reset the session so the next prompt runs with a clean context and the default memory files.", "explanation": "Sai: có thể tạm che triệu chứng nhưng không chẩn đoán nguyên nhân."}, {"text": "--resume, to reopen a session where conventions were followed and compare its behavior side by side with this one.", "explanation": "Sai: so sánh gián tiếp, chậm; không trực tiếp chỉ ra file memory."}, {"text": "/compact, to shrink the conversation and force Claude Code to reload instructions from the memory files on disk.", "explanation": "Sai: /compact giảm context, không cho biết file nào được nạp."}], "answers": [0]}, {"id": "S1-27", "scenario": 1, "domain": "D2", "select": 2, "stem": "The agent confuses lookup_order with get_customer about 10% of the time, adding an extra tool call and latency to many conversations. You want to fix it through descriptions before changing the tool set. Which TWO additions to lookup_order's description help most?", "source": "TS 2.1 · bài 2.1", "options": [{"text": "A boundary statement: use get_customer instead when just a name or email is known and there is no order ID.", "explanation": "Đúng: nói rõ ranh giới với tool dễ nhầm giúp model chọn đúng."}, {"text": "The accepted order ID format (for example ORD-12345) with sample requests that should trigger this tool.", "explanation": "Đúng: định dạng và ví dụ cụ thể là tín hiệu chọn tool mạnh."}, {"text": "The full list of error codes the tool can return, so the model understands each way the lookup can fail.", "explanation": "Sai: hữu ích cho xử lý lỗi, không cho việc chọn tool."}, {"text": "A detailed explanation of the database tables and joins that the tool uses internally to find the order.", "explanation": "Sai: chi tiết nội bộ không giúp chọn tool, chỉ tốn token."}, {"text": "A note that this tool is fast and cheap, so the model should prefer it whenever it is unsure which tool fits the request.", "explanation": "Sai: khuyến khích dùng nhầm khi không chắc."}], "answers": [0, 1]}, {"id": "S1-24", "scenario": 1, "domain": "D5", "select": 1, "stem": "A customer is visibly frustrated about a missing parcel but never asks for a human. A replacement shipment is clearly within the agent's authority, and human queues are currently 40 minutes long. What is the best behavior?", "source": "TS 5.2 · bài 5.2 Escalation", "options": [{"text": "Offer a discount code instead of a replacement to calm the customer, since it is cheaper than reshipping.", "explanation": "Sai: không giải quyết vấn đề thật (gói hàng mất)."}, {"text": "Ask several clarifying questions about the parcel first to fully confirm the facts before offering anything.", "explanation": "Sai: hỏi thừa khi đã đủ thông tin làm khách bực hơn."}, {"text": "Acknowledge the frustration briefly and offer the replacement right away, escalating if the customer then asks.", "explanation": "Đúng: giải quyết được trong quyền hạn → làm ngay; cảm xúc khách không tự động là lý do chuyển người."}, {"text": "Escalate to a human immediately, since frustrated customers are better handled by a person than by the agent itself.", "explanation": "Sai: tốn hàng chờ 40 phút cho việc agent tự làm được; hợp khi khách yêu cầu người."}], "answers": [2]}, {"id": "S1-23", "scenario": 1, "domain": "D5", "select": 1, "stem": "A customer writes: 'Stop. I want a human agent now.' The issue (a delayed parcel) is something the agent could normally resolve in under a minute, and human queues are long today. What should the agent do?", "source": "TS 5.2 · bài 5.2 Escalation", "options": [{"text": "Investigate the parcel status before escalating so the human receives complete information with the handoff.", "explanation": "Sai: thông tin đầy đủ có ích, nhưng trì hoãn yêu cầu; tóm tắt hiện có là đủ."}, {"text": "Explain that queues are long and ask whether they would prefer the agent to try first before escalating.", "explanation": "Sai: hợp khi khách lưỡng lự; ở đây khách đã nói rõ, hỏi lại là cản trở."}, {"text": "Honor the request and escalate immediately, passing a concise summary so the human agent doesn't need to re-ask.", "explanation": "Đúng: yêu cầu rõ ràng gặp người phải được tôn trọng; tóm tắt giúp tiết kiệm thời gian người xử lý."}, {"text": "Resolve the delay first since it takes a minute, then offer a human if the customer is still unhappy.", "explanation": "Sai: hiệu quả trên giấy nhưng phớt lờ yêu cầu rõ ràng của khách."}], "answers": [2]}, {"id": "S1-12", "scenario": 1, "domain": "D2", "select": 1, "stem": "lookup_order is called for a customer who genuinely has no orders in 12 months; the backend answered normally. Currently the tool returns an error, so the agent apologizes for a 'system problem' and escalates. How should the tool report this?", "source": "TS 2.2 / 5.3 · bài 2.2 & 5.3", "options": [{"text": "As null with no further information, letting the agent decide from the conversation context what an empty response means.", "explanation": "Sai: mơ hồ giữa 'không có' và 'lỗi'."}, {"text": "As a retryable error, since the order database may simply not have synced recent purchases yet.", "explanation": "Sai: retry vô ích khi backend đã trả lời bình thường."}, {"text": "As a successful result with an empty order list, clearly distinct from errors such as timeouts or access failures.", "explanation": "Đúng: 'không có dữ liệu' là kết quả hợp lệ; phân biệt giúp agent trả lời đúng và không chuyển người vô ích."}, {"text": "As an error with code NOT_FOUND, so the agent knows to apologize and offer to escalate the conversation.", "explanation": "Sai: biến kết quả hợp lệ thành lỗi — chính là nguyên nhân hành vi sai hiện tại."}], "answers": [2]}, {"id": "S1-10", "scenario": 1, "domain": "D2", "select": 1, "stem": "process_refund returns 'Operation failed' for timeouts, invalid order IDs and refunds outside the return window. The agent retries all three times, annoying customers and loading the payment service. What should the tool return?", "source": "TS 2.2 · bài 2.2 Structured Error Responses", "options": [{"text": "Structured errors with errorCategory, an isRetryable flag and a readable description to relay to the customer.", "explanation": "Đúng: agent retry chỉ lỗi tạm thời, giải thích đúng lỗi nghiệp vụ, không làm tải dịch vụ."}, {"text": "A different free-text message for each case, so the agent can read the wording and decide whether to retry.", "explanation": "Sai: tốt hơn hiện tại nhưng không có cấu trúc, agent phải đoán."}, {"text": "Just an HTTP-style status code, since the agent can infer the meaning from standard codes like 408 and 422 on its own.", "explanation": "Sai: thiếu ngữ cảnh nghiệp vụ (ngoài thời hạn đổi trả)."}, {"text": "The same message, but with retries moved into the tool using exponential backoff to protect the payment service.", "explanation": "Sai: giảm tải nhưng vẫn retry vô ích lỗi nghiệp vụ và agent không biết giải thích."}], "answers": [0]}, {"id": "S1-25", "scenario": 1, "domain": "D5", "select": 1, "stem": "A customer asks the agent to match a competitor's lower TV price. Policy covers adjusting your own site's price after purchase but says nothing about competitors. Margin on TVs is thin, and customers dislike waiting. What should the agent do?", "source": "TS 5.2 · bài 5.2 Escalation (policy gap)", "options": [{"text": "Decline politely, stating that competitor matching is not offered, since the written policy does not mention it at all.", "explanation": "Sai: 'không nhắc đến' không có nghĩa 'bị cấm'; từ chối có thể sai chính sách thật."}, {"text": "Apply the own-site price adjustment rule by analogy, since the customer's goal of a lower price is the same.", "explanation": "Sai: suy rộng chính sách là tự tạo quy định mới, rủi ro biên lợi nhuận."}, {"text": "Offer a small goodwill coupon instead, which is within authority and resolves the conversation without waiting.", "explanation": "Sai: nhanh nhưng lảng tránh câu hỏi thật và vẫn là quyết định ngoài chính sách."}, {"text": "Escalate to a human with the details, since the policy does not cover competitor matching and the agent shouldn't invent one.", "explanation": "Đúng: chính sách không bao phủ → không tự quyết; người có thẩm quyền quyết ngoại lệ."}], "answers": [3]}, {"id": "S1-15", "scenario": 1, "domain": "D3", "select": 1, "stem": "A new developer says Claude Code ignores the team's coding conventions on their machine, while it works for the senior developer. The conventions live in the senior's ~/.claude/CLAUDE.md. More hires join next month. What should you change?", "source": "TS 3.1 · bài 3.1 CLAUDE.md Hierarchy", "options": [{"text": "Move the team rules from the user-level file into the project CLAUDE.md committed to the repo.", "explanation": "Đúng: cấp project được chia sẻ cho mọi người clone repo, có review."}, {"text": "Have the new developer copy the senior's ~/.claude/CLAUDE.md onto their own machine and keep it in sync by hand.", "explanation": "Sai: sửa nhanh cho một người nhưng lệch phiên bản và phải lặp với mỗi người mới."}, {"text": "Put the rules in CLAUDE.local.md at the repo root so they load for everyone automatically.", "explanation": "Sai: .local là file cá nhân không commit."}, {"text": "Ask the senior to paste the conventions at the start of shared pairing sessions with new hires.", "explanation": "Sai: thủ công, không áp dụng khi làm việc một mình."}], "answers": [0]}, {"id": "S2-29", "scenario": 2, "domain": "D5", "select": 2, "stem": "You've spent four hours in one Claude Code session mapping a 2M-line codebase. Answers about early findings are getting vague, and you can't restart because the investigation is mid-way. Which TWO techniques best counter context degradation?", "source": "TS 5.4 · bài 5.4", "options": [{"text": "Switch to a model with a larger context window mid-session so more history fits without being summarized.", "explanation": "Sai: chú ý vẫn suy giảm với context dài; không giải quyết gốc."}, {"text": "Repeat the most important findings in each new prompt so they stay near the end of the context window.", "explanation": "Sai: tốn token và làm context đầy nhanh hơn."}, {"text": "Lower the temperature so that answers about the earlier findings become more precise and less speculative.", "explanation": "Sai: không liên quan đến việc mất thông tin trong context dài."}, {"text": "Record key findings in a scratchpad file and point Claude to it when later questions depend on them.", "explanation": "Đúng: lưu kiến thức ra ngoài context, nạp lại chính xác khi cần."}, {"text": "Delegate verbose exploration to subagents and keep only their concise summaries in the main conversation.", "explanation": "Đúng: output dài nằm ở context của subagent; main chỉ nhận tóm tắt."}], "answers": [3, 4]}, {"id": "S2-02", "scenario": 2, "domain": "D1", "select": 1, "stem": "You have a named session investigating a flaky payments module. Over lunch a teammate refactored two of the files you analyzed. Re-running the morning's analysis would take an hour; you want to continue efficiently without acting on stale facts. What should you do?", "source": "TS 1.7 · bài 1.7 Session State", "options": [{"text": "Resume with --resume and tell Claude which two files changed so it re-reads them before continuing.", "explanation": "Đúng: giữ phân tích cũ còn đúng, chỉ làm mới phần đã thay đổi — nhanh và chính xác."}, {"text": "Start a fresh session and redo the investigation so each conclusion is based on the current code.", "explanation": "Sai: chắc chắn đúng nhưng mất cả giờ; hợp khi thay đổi lan rộng."}, {"text": "Resume the session and continue directly, since Claude will notice any file differences when it uses tools.", "explanation": "Sai: Claude có thể dựa vào kết quả đã đọc cũ trong context mà không đọc lại."}, {"text": "Use fork_session from the morning state so that the new branch is isolated from the stale analysis of those files.", "explanation": "Sai: fork vẫn mang cùng context cũ; dùng để so sánh hướng đi, không để làm mới."}], "answers": [0]}, {"id": "S2-05", "scenario": 2, "domain": "D1", "select": 1, "stem": "A nightly Claude Code job always runs the same three steps on a repo: lint-fix, update API docs, draft a changelog entry. It fails silently sometimes and the team needs to know which step broke. Which decomposition fits?", "source": "TS 1.6 · bài 1.6", "options": [{"text": "Three parallel subagents, one per task, merging their separate changes together at the end of the nightly job.", "explanation": "Sai: changelog phụ thuộc kết quả trước; song song dễ xung đột."}, {"text": "One prompt asking for the three tasks in a single run, then checking the final combined diff for any problems.", "explanation": "Sai: ít call nhưng không biết bước nào lỗi."}, {"text": "A coordinator agent that decides each night which of the three steps are needed based on the recent commits.", "explanation": "Sai: linh hoạt hơn nhưng khó đoán, khó debug; hợp khi bước thay đổi theo ngữ cảnh."}, {"text": "A fixed sequential pipeline of focused prompts (prompt chaining), checking each step's output before the next.", "explanation": "Đúng: bước cố định → chaining; kiểm tra giữa các bước chỉ ra chỗ lỗi."}], "answers": [3]}, {"id": "S2-03", "scenario": 2, "domain": "D1", "select": 1, "stem": "After a long analysis of a service, you want to compare two refactoring strategies (a strangler-pattern rewrite vs. in-place cleanup). Each exploration will generate a lot of output, and you want both to start from the same analysis without influencing each other. Which mechanism fits best?", "source": "TS 1.7 · bài 1.7 (fork_session)", "options": [{"text": "Explore both strategies one after another in the same session, then ask Claude to compare them at the end.", "explanation": "Sai: rẻ hơn nhưng hướng sau bị ảnh hưởng bởi hướng trước và context đầy."}, {"text": "Start two fresh sessions and paste a short summary of the analysis into each one before exploring.", "explanation": "Sai: độc lập nhưng mất chi tiết phân tích gốc; hợp khi phân tích ngắn."}, {"text": "Use /compact between the two explorations so the first strategy's output does not crowd the second.", "explanation": "Sai: tóm tắt vẫn để lại ảnh hưởng của hướng đầu."}, {"text": "fork_session, creating two independent branches from the shared analysis baseline, one per strategy.", "explanation": "Đúng: hai nhánh độc lập cùng điểm xuất phát, không làm bẩn context của nhau."}], "answers": [3]}, {"id": "S2-17", "scenario": 2, "domain": "D4", "select": 1, "stem": "Your docs-automation prompt says 'check that code comments are accurate' and produces dozens of nitpicks per PR (grammar, tone, missing articles). Developers now ignore it. Which revised criterion best improves precision?", "source": "TS 4.1 · bài 4.1 Explicit Criteria", "options": [{"text": "Flag each inaccurate comment but group them by file to make the report easier for developers to scan.", "explanation": "Sai: cải thiện trình bày, không giảm nhiễu."}, {"text": "Flag a comment when its claimed behavior contradicts what the code actually does, quoting both.", "explanation": "Đúng: tiêu chí khách quan, cụ thể, nhắm vào lỗi có hậu quả thật."}, {"text": "Limit the review to comments longer than three lines, since short comments rarely cause confusion.", "explanation": "Sai: quy tắc tùy tiện, bỏ sót comment ngắn mà sai."}, {"text": "Flag comments with clear problems and skip minor issues, focusing on what matters to developers.", "explanation": "Sai: vẫn mơ hồ ('rõ ràng', 'quan trọng')."}], "answers": [1]}, {"id": "S2-07", "scenario": 2, "domain": "D2", "select": 1, "stem": "Claude Code's Edit fails on a large YAML config because the text to replace appears in several places and isn't unique. The file is 300 lines and the change touches one block. What is the tested fallback?", "source": "TS 2.5 · bài 2.5 Built-in Tools", "options": [{"text": "Use Bash with sed to replace each occurrence of the text across the file in one command, then re-read it.", "explanation": "Sai: thay tất cả chỗ trùng, sửa nhầm các block khác."}, {"text": "Ask the user to edit the file manually, since Claude Code cannot safely change non-unique text.", "explanation": "Sai: có cách an toàn mà không cần người."}, {"text": "Retry Edit with the same text, since the tool will choose the first occurrence after a second attempt.", "explanation": "Sai: Edit cần chuỗi duy nhất; lặp lại không thay đổi kết quả."}, {"text": "Read the whole file, then use Write to save the complete modified file with just the intended block changed.", "explanation": "Đúng: cách dự phòng chuẩn khi Edit không tìm được chuỗi duy nhất."}], "answers": [3]}, {"id": "S2-21", "scenario": 2, "domain": "D4", "select": 2, "stem": "Claude Code generates unit tests for a payments library, but structure varies by file and many tests duplicate existing ones or check trivial getters. CI time is already long. Which TWO changes help most?", "source": "TS 3.6 · bài 3.6 CI/CD & test generation", "options": [{"text": "Document testing standards, criteria for valuable tests, and shared fixtures in CLAUDE.md for each session.", "explanation": "Đúng: chuẩn ổn định áp dụng cho mọi lần sinh test."}, {"text": "Generate tests in a fresh session each time so that the earlier test files don't bias the new ones it writes.", "explanation": "Sai: mất ngữ cảnh khiến cấu trúc lệch và trùng nhiều hơn."}, {"text": "Ask Claude to maximize line coverage, so each function gets at least one test even if it is trivial.", "explanation": "Sai: chạy theo coverage sinh thêm test giá trị thấp, CI lâu hơn."}, {"text": "Raise the temperature to encourage more varied test scenarios beyond what already exists.", "explanation": "Sai: tăng ngẫu nhiên, giảm nhất quán."}, {"text": "Include the existing test files in context so Claude follows their structure and avoids duplicating scenarios.", "explanation": "Đúng: thấy test sẵn có giúp nhất quán và tránh trùng, giảm thời gian CI."}], "answers": [0, 4]}, {"id": "S2-01", "scenario": 2, "domain": "D1", "select": 1, "stem": "You're migrating a huge repository from one HTTP client library to another. Grep results and file dumps from discovery are flooding the main conversation, and later answers are getting worse. Which approach best keeps the main session effective?", "source": "TS 3.4 / 5.4 · bài 3.4 & 5.4 (Explore subagent)", "options": [{"text": "Paste the full list of call sites into CLAUDE.md so it loads in each new session automatically for the migration.", "explanation": "Sai: làm phình mọi session; CLAUDE.md cho quy ước, không cho dữ liệu tạm."}, {"text": "Use a model with a bigger context window so the discovery output fits without degradation.", "explanation": "Sai: chú ý vẫn suy giả
