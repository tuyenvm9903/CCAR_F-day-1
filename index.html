<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CCAR-F Mock Exam — 2026-10-27</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#1c2230;--mut:#5d6677;--line:#d9dde5;--pri:#c2570b;--pri2:#9a4309;--ok:#157347;--bad:#b42318;--warn:#b7791f;--sel:#fff3e6}
*{box-sizing:border-box}
body{margin:0;font:16px/1.5 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink)}
button{font:inherit;cursor:pointer}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:16px}
h1{margin:0 0 6px;font-size:24px}h2{margin:0 0 10px;font-size:19px}h3{margin:0 0 8px;font-size:16px}
.mut{color:var(--mut)}.small{font-size:13px}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 16px}
.btn:hover{background:#f0f1f4}.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}.btn.pri:hover{background:var(--pri2)}
.btn.bad{background:var(--bad);border-color:var(--bad);color:#fff}.btn:disabled{opacity:.45;cursor:not-allowed}
.top{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.top .title{font-weight:600}.top .sp{flex:1}
.timer{font:700 22px ui-monospace,Menlo,Consolas,monospace;padding:4px 12px;border-radius:8px;background:#eef1f6}
.timer.low{background:#fde8e6;color:var(--bad)}
.layout{display:grid;grid-template-columns:1fr 280px;gap:16px}
@media(max-width:820px){.layout{grid-template-columns:1fr}}
.scen{background:#fff7ee;border:1px solid #f0cfae;border-radius:8px;padding:12px 14px;margin-bottom:14px}
.scen b{color:var(--pri2)}
.qno{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px;flex-wrap:wrap}
.tag{display:inline-block;background:#eef1f6;border-radius:999px;padding:2px 10px;font-size:13px;color:var(--mut)}
.tag.sel{background:#ffe9d1;color:var(--pri2);font-weight:600}
.stem{font-size:17px;margin:8px 0 14px;white-space:pre-wrap}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px;cursor:pointer;background:#fff}
.opt:hover{border-color:#b9bfcc}.opt.on{background:var(--sel);border-color:var(--pri)}
.opt input{margin-top:5px;accent-color:var(--pri)}
.opt .l{font-weight:700;min-width:20px}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.flagbtn.on{background:#fff3cd;border-color:var(--warn);color:#7a5200}
.map{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.map button{padding:6px 0;border:1px solid var(--line);border-radius:6px;background:#fff;font-size:13px;position:relative}
.map button.ans{background:#dff3e6;border-color:#8fcca6}
.map button.cur{outline:2px solid var(--pri)}
.map button.flag::after{content:"⚑";position:absolute;top:-6px;right:-2px;font-size:12px;color:var(--warn)}
.legend span{display:inline-block;margin-right:10px;font-size:12px;color:var(--mut)}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;border:1px solid var(--line);vertical-align:-1px;margin-right:4px}
.dot.a{background:#dff3e6}.dot.f{background:#fff3cd}
.hide{display:none!important}
.result-head{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.score{font-size:54px;font-weight:800;line-height:1}
.pass{color:var(--ok)}.fail{color:var(--bad)}
.bar{height:12px;border-radius:6px;background:#e6e9ef;overflow:hidden;min-width:140px}
.bar i{display:block;height:100%;background:var(--pri)}
table{border-collapse:collapse;width:100%}th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.rv{border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px;background:#fff}
.rv.right{border-left:5px solid var(--ok)}.rv.wrong{border-left:5px solid var(--bad)}.rv.skip{border-left:5px solid var(--warn)}
.ro{border-radius:8px;padding:8px 10px;margin:6px 0;border:1px solid var(--line)}
.ro.c{background:#e8f6ee;border-color:#9fd3b4}.ro.w{background:#fdeceb;border-color:#f0b3ae}
.ro .ex{font-size:14px;color:#33394a;margin-top:4px}
.badge{font-size:12px;font-weight:700;border-radius:4px;padding:1px 6px;margin-left:6px}
.badge.g{background:var(--ok);color:#fff}.badge.r{background:var(--bad);color:#fff}.badge.y{background:#e5e7eb;color:#333}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.filters .btn.on{background:#1c2230;color:#fff}
.modal{position:fixed;inset:0;background:rgba(15,20,30,.55);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
.modal .box{background:#fff;border-radius:12px;padding:22px;max-width:480px;width:100%}
ul.rules li{margin:4px 0}
.againbar{position:sticky;bottom:8px;z-index:20;box-shadow:0 -2px 12px rgba(0,0,0,.25);margin-top:12px}@media(max-width:600px){.againbar{padding:8px 10px}.againbar .small{display:none}}
</style>
</head>

<script type="application/json" id="exam-data">{"examId": "2026-10-27-1256", "date": "2026-10-27", "durationSec": 7200, "blueprint": {"D1": 16, "D2": 11, "D3": 12, "D4": 12, "D5": 9}, "domains": {"D1": "Agentic Architecture & Orchestration", "D2": "Tool Design & MCP Integration", "D3": "Claude Code Configuration & Workflows", "D4": "Prompt Engineering & Structured Output", "D5": "Context Management & Reliability"}, "scenarios": {"1": {"title": "Kịch bản 1 — Customer Support Resolution Agent", "text": "You are building a customer support resolution agent using the Claude Agent SDK. The agent handles high-ambiguity requests such as returns, billing disputes and account issues, using custom MCP tools (get_customer, lookup_order, process_refund, escalate_to_human). Target: 80%+ first-contact resolution while knowing when to escalate.", "vi": "Agent hỗ trợ khách hàng (Agent SDK + MCP tools): xử lý đổi trả, khiếu nại; biết lúc nào phải chuyển cho người."}, "2": {"title": "Kịch bản 2 — Code Generation with Claude Code", "text": "Your team uses Claude Code for code generation, refactoring, debugging and documentation. You need to integrate it into the workflow with custom slash commands, CLAUDE.md configuration, and understand when to use plan mode versus direct execution.", "vi": "Viết code với Claude Code: CLAUDE.md, lệnh tắt riêng, khi nào lập kế hoạch trước, khi nào làm luôn."}, "5": {"title": "Kịch bản 5 — Claude Code for Continuous Integration", "text": "You are integrating Claude Code into your CI/CD pipeline. The system runs automated code reviews, generates test cases and provides feedback on pull requests. You need prompts that give actionable feedback and minimize false positives.", "vi": "Claude Code trong CI/CD: tự review code, sinh test, góp ý pull request mà ít báo sai."}, "6": {"title": "Kịch bản 6 — Structured Data Extraction", "text": "You are building a structured data extraction system with Claude. It extracts information from unstructured documents, validates output with JSON schemas and maintains high accuracy. It must handle edge cases gracefully and integrate with downstream systems.", "vi": "Trích xuất dữ liệu: biến tài liệu thô thành JSON đúng định dạng, xử lý được trường hợp lạ."}}, "scenarioOrder": ["6", "5", "1", "2"], "questions": [{"id": "S6-04", "scenario": 6, "domain": "D1", "select": 1, "stem": "Your extraction agent loop sometimes returns before the extraction tool result is processed. The code stops when the first content block of the response is text. What is the correct fix?", "source": "TS 1.1 · bài 1.1", "options": [{"text": "End the loop when the response text contains the keyword 'done' written by the model.", "explanation": "Sai: parse ngôn ngữ tự nhiên."}, {"text": "End the loop once the response text exceeds 100 characters, treating that as the answer.", "explanation": "Sai: tùy tiện."}, {"text": "Stop the loop after a fixed three iterations, which covers the typical extraction.", "explanation": "Sai: cap cố định không phù hợp."}, {"text": "Loop while stop_reason is 'tool_use', appending tool results; stop on 'end_turn'.", "explanation": "Đúng: stop_reason là tín hiệu quyết định."}], "answers": [3]}, {"id": "S6-27", "scenario": 6, "domain": "D5", "select": 2, "stem": "Which TWO kinds of extractions should be routed to human review to use limited reviewer capacity well?", "source": "TS 5.5 · bài 5.5", "options": [{"text": "A random 50% of all extractions, regardless of type or confidence.", "explanation": "Sai: không ưu tiên."}, {"text": "Extractions from ambiguous or internally contradictory source documents.", "explanation": "Đúng: nguồn mâu thuẫn cần phán đoán của con người."}, {"text": "Low-confidence extractions, with confidence calibrated on labeled data.", "explanation": "Đúng: ưu tiên người xem những ca không chắc chắn."}, {"text": "Extractions with high calibrated confidence, double-checked to be safe.", "explanation": "Sai: lãng phí năng lực; dùng lấy mẫu phân tầng thay thế."}, {"text": "Extractions from the shortest documents, which carry the least context.", "explanation": "Sai: độ dài không phải tiêu chí."}], "answers": [1, 2]}, {"id": "S6-12", "scenario": 6, "domain": "D3", "select": 1, "stem": "You need to add one optional field (null allowed) to an existing, well-understood schema in a single file. Which approach is best?", "source": "TS 3.4 · bài 3.4", "options": [{"text": "Write and approve a design document before making the single-file schema change.", "explanation": "Sai: quá mức."}, {"text": "Use plan mode with a full architectural investigation before adding the field.", "explanation": "Sai: quá mức."}, {"text": "Fork a session to compare alternative architectures before adding the field.", "explanation": "Sai: không cần."}, {"text": "Use direct execution, because the change is small, clear and limited to one file.", "explanation": "Đúng: thay đổi một file rõ ràng không cần lập kế hoạch."}], "answers": [3]}, {"id": "S6-01", "scenario": 6, "domain": "D1", "select": 1, "stem": "Your extraction agent calls several tools: an OCR service returns dates as Unix timestamps, a CRM returns ISO 8601 strings, and a legacy system returns '03/04/24' strings with ambiguous day/month order. Downstream validation keeps failing on date comparisons. What is the best place to fix this?", "source": "TS 1.5 · bài 1.5 Hooks", "options": [{"text": "Add few-shot examples that use only ISO 8601 dates so the model copies that format.", "explanation": "Sai: không giải quyết định dạng đầu vào hỗn hợp."}, {"text": "Retry the extraction whenever date validation fails until the comparisons pass.", "explanation": "Sai: lặp lại không sửa nguyên nhân."}, {"text": "A PostToolUse hook that normalizes each tool's dates before the model sees them.", "explanation": "Đúng: PostToolUse chuẩn hóa dữ liệu hỗn hợp một cách xác định trước khi model xử lý."}, {"text": "Add a system prompt instruction telling the model to be careful when reading dates.", "explanation": "Sai: không xác định, dễ nhầm ngày/tháng."}], "answers": [2]}, {"id": "S6-03", "scenario": 6, "domain": "D1", "select": 1, "stem": "Your document pipeline always goes: extract fields → validate against the schema → enrich with master data → format for export. Each stage has a different focus. Which design is a good fit?", "source": "TS 1.6 · bài 1.6 Prompt Chaining", "options": [{"text": "Run the four stages in a random order for each document to avoid order bias.", "explanation": "Sai: vô nghĩa."}, {"text": "Use a prompt chain with one focused prompt per stage and validate between stages.", "explanation": "Đúng: chuỗi prompt tập trung từng bước, có thể kiểm tra và thử lại riêng từng bước."}, {"text": "Use a dynamic planner that lets the model decide the stage sequence per document.", "explanation": "Sai: biến động không cần thiết."}, {"text": "Use one prompt that performs all four stages together in a single response.", "explanation": "Sai: giảm độ chính xác từng bước."}], "answers": [1]}, {"id": "S6-10", "scenario": 6, "domain": "D2", "select": 1, "stem": "A load_document tool fails when the PDF is password-protected, when the file server times out, and when the file path is malformed. Which response design best supports recovery?", "source": "TS 2.2 · bài 2.2", "options": [{"text": "Return one generic 'load failed' message so the agent handles a single failure signal.", "explanation": "Sai: không thể quyết định phục hồi."}, {"text": "Stop the whole pipeline on any load failure so no partial results reach later stages.", "explanation": "Đúng: phân loại lỗi cho phép xử lý đúng cách."}, {"text": "Return an empty document so the pipeline continues processing with what it has.", "explanation": "Sai: che giấu lỗi, dẫn đến trích xuất rỗng."}, {"text": "Return structured errors with a category, an isRetryable flag and a clear description.", "explanation": "Sai: quá mức."}], "answers": [1]}, {"id": "S6-13", "scenario": 6, "domain": "D3", "select": 1, "stem": "A migration script mishandles null values in a column. Descriptions of the bug keep producing wrong fixes. What gives Claude the clearest way to fix the edge case?", "source": "TS 3.5 · bài 3.5", "options": [{"text": "Tell the model to skip null values so those rows are left out of the migration.", "explanation": "Sai: không giải quyết."}, {"text": "Ask the model to 'fix all edge cases' without giving any concrete examples.", "explanation": "Sai: không cụ thể."}, {"text": "Provide test cases with example inputs and expected outputs for the null handling.", "explanation": "Đúng: ví dụ vào/ra cụ thể cho trường hợp biên."}, {"text": "Write a longer prose description of the null bug with more detail in the prompt.", "explanation": "Sai: có thể vẫn bị hiểu sai."}], "answers": [2]}, {"id": "S6-08", "scenario": 6, "domain": "D2", "select": 1, "stem": "You want the extract_metadata tool to run first on each document, followed by enrichment in later steps. How do you ensure the first call?", "source": "TS 2.3 · bài 2.3", "options": [{"text": "Place extract_metadata first in the tools array so the model tends to start with it.", "explanation": "Sai: không cưỡng chế."}, {"text": "Force it with tool_choice {\"type\": \"tool\", \"name\": \"extract_metadata\"}, then continue.", "explanation": "Đúng: forced tool_choice đảm bảo một công cụ cụ thể chạy trước."}, {"text": "Set tool_choice to \"any\" so the model must call some tool on the first turn.", "explanation": "Sai: không chỉ định công cụ."}, {"text": "Add a prompt instruction asking the model to call extract_metadata first.", "explanation": "Sai: xác suất."}], "answers": [1]}, {"id": "S6-11", "scenario": 6, "domain": "D3", "select": 1, "stem": "The extraction project's conventions (schema naming, null handling rules) must apply for every developer who clones the repository. Where should they live?", "source": "TS 3.1 · bài 3.1", "options": [{"text": "In a pinned team chat message that every developer reads when they join the project.", "explanation": "Sai: không phải cấu hình."}, {"text": "In the project-level CLAUDE.md (or .claude/CLAUDE.md) committed to version control.", "explanation": "Đúng: cấu hình cấp dự án được chia sẻ."}, {"text": "In a personal notes file that each developer keeps alongside their local clone.", "explanation": "Sai: không được nạp tự động."}, {"text": "In the tech lead's ~/.claude/CLAUDE.md, which defines the conventions for the team.", "explanation": "Sai: chỉ áp dụng cho người đó."}], "answers": [1]}, {"id": "S6-05", "scenario": 6, "domain": "D1", "select": 1, "stem": "A batch of related contracts must be checked for consistency of party names and dates across documents. Analyzing all together in one pass gives uneven results. What structure is best?", "source": "TS 1.6 / 4.6 · bài 1.6", "options": [{"text": "Concatenate every contract into one large prompt so they share a single context.", "explanation": "Sai: nguy cơ bỏ sót, pha loãng."}, {"text": "Analyze each contract alone, then run a separate cross-document consistency pass.", "explanation": "Đúng: các lượt tập trung + một lượt tích hợp giảm pha loãng chú ý."}, {"text": "Analyze the longest contract in depth and assume the others follow the same pattern.", "explanation": "Sai: giả định không có cơ sở."}, {"text": "Process the contracts in random order and merge the outputs without a review step.", "explanation": "Sai: thiếu kiểm tra."}], "answers": [1]}, {"id": "S6-29", "scenario": 6, "domain": "D2", "select": 1, "stem": "You expose three extraction tools: extract_invoice_fields, extract_receipt_fields, extract_contract_terms. The model sometimes uses the wrong one for credit notes. What is the best first step?", "source": "TS 2.1 · bài 2.1", "options": [{"text": "Add a dedicated extraction tool for every document subtype, including credit notes.", "explanation": "Sai: tăng độ phức tạp."}, {"text": "Clarify each description: accepted types, examples, and boundaries vs. the others.", "explanation": "Đúng: ranh giới trong mô tả là cơ chế chính để chọn công cụ."}, {"text": "Merge the three tools into one tool with a free-text 'type' field the model fills in.", "explanation": "Sai: làm mờ hợp đồng."}, {"text": "Force extract_invoice_fields for every document regardless of the document type.", "explanation": "Sai: sai cho tài liệu khác."}], "answers": [1]}, {"id": "S6-25", "scenario": 6, "domain": "D5", "select": 1, "stem": "A document contains contradictory values for the same field (two different invoice totals) and cannot be resolved from the source alone. What should the pipeline do?", "source": "TS 4.4 / 5.5 · bài 5.5", "options": [{"text": "Keep the larger of the two totals, since it is more likely to be the correct amount.", "explanation": "Sai: tùy ý."}, {"text": "Drop the document from the output so no contradictory data reaches downstream systems.", "explanation": "Sai: mất dữ liệu."}, {"text": "Report the average of the two totals as a compromise value for the invoice field.", "explanation": "Sai: tạo giá trị không có nguồn."}, {"text": "Set a conflict_detected flag on the record and route the extraction to human review.", "explanation": "Đúng: nguồn mâu thuẫn nên chuyển cho người xem xét."}], "answers": [3]}, {"id": "S6-18", "scenario": 6, "domain": "D4", "select": 1, "stem": "A purchase order says 'see attached master agreement for payment terms', but the agreement was not provided. The extractor fails validation on the payment_terms field repeatedly. What is true about retrying?", "source": "TS 4.4 · bài 4.4 (limits of retry)", "options": [{"text": "Retrying cannot help because the data is absent; return null or route for review.", "explanation": "Đúng: retry vô ích khi thông tin không có trong nguồn."}, {"text": "Remove schema validation for payment_terms so the record passes the check.", "explanation": "Sai: bỏ kiểm tra."}, {"text": "Let the model infer the typical payment terms used in similar purchase agreements.", "explanation": "Sai: bịa."}, {"text": "Keep retrying with stronger wording until the model finds the payment terms.", "explanation": "Sai: không thể trích xuất thông tin không có."}], "answers": [0]}, {"id": "S6-21", "scenario": 6, "domain": "D4", "select": 1, "stem": "A nightly batch of 1,000 documents returns 40 failures, some because the documents exceeded the context limit. What is the best handling strategy?", "source": "TS 4.5 · bài 4.5", "options": [{"text": "Resubmit the full batch of 1,000 documents unchanged and hope more succeed.", "explanation": "Sai: tốn chi phí và vẫn lỗi."}, {"text": "Resubmit only the failures by custom_id, chunking the oversized documents first.", "explanation": "Đúng: sửa theo nguyên nhân và chỉ gửi lại phần lỗi."}, {"text": "Have a person process all 1,000 documents manually to be sure nothing is missed.", "explanation": "Sai: không cần."}, {"text": "Accept the 40 failures as a normal cost of batch processing and move on.", "explanation": "Sai: mất dữ liệu."}], "answers": [1]}, {"id": "S6-15", "scenario": 6, "domain": "D4", "select": 1, "stem": "A 'document_category' field must cover the common types but also handle unexpected types gracefully, and sometimes the type is unclear. Which schema design is best?", "source": "TS 4.3 · bài 4.3", "options": [{"text": "An unconstrained free-text string so that any unexpected category can be captured.", "explanation": "Sai: khó chuẩn hóa."}, {"text": "An enum of known values plus \"unclear\" and \"other\", with a detail string for \"other\".", "explanation": "Đúng: enum mở rộng được với 'other' + chi tiết, 'unclear' cho trường hợp mơ hồ."}, {"text": "An undocumented numeric code for each category to keep the schema compact.", "explanation": "Sai: không mô tả."}, {"text": "A strict enum containing only the known categories, rejecting any other value.", "explanation": "Sai: ép phân loại sai cho trường hợp mới."}], "answers": [1]}, {"id": "S6-23", "scenario": 6, "domain": "D5", "select": 1, "stem": "You auto-accept high-confidence extractions. How do you detect novel error patterns hidden in this accepted stream?", "source": "TS 5.5 · bài 5.5", "options": [{"text": "Stop reviewing auto-accepted extractions, since high confidence means they are correct.", "explanation": "Sai: không phát hiện được."}, {"text": "Run stratified random sampling of high-confidence extractions to measure error rates.", "explanation": "Đúng: lấy mẫu phân tầng ngẫu nhiên phát hiện lỗi mới."}, {"text": "Wait for downstream users or customers to report problems with accepted records.", "explanation": "Sai: phản ứng muộn."}, {"text": "Have reviewers look only at the lowest-confidence records within the accepted stream.", "explanation": "Sai: không bao phủ phần tự động chấp nhận."}], "answers": [1]}, {"id": "S5-27", "scenario": 5, "domain": "D3", "select": 2, "stem": "Which TWO choices are appropriate for running Claude Code in a CI pipeline?", "source": "TS 3.6 · bài 3.6", "options": [{"text": "Provide testing standards and review criteria through CLAUDE.md.", "explanation": "Đúng: ngữ cảnh dự án cho CI."}, {"text": "Have the same session generate the code and then approve it.", "explanation": "Sai: thiên kiến tự đánh giá."}, {"text": "Rely on the interactive permission prompt to approve each edit.", "explanation": "Sai: CI không có người tương tác."}, {"text": "Parse the free-form text output with a regex to build PR comments.", "explanation": "Sai: nên dùng --output-format json + --json-schema."}, {"text": "Use the -p flag so the job never waits for interactive input.", "explanation": "Đúng: chế độ không tương tác."}], "answers": [0, 4]}, {"id": "S5-28", "scenario": 5, "domain": "D1", "select": 1, "stem": "A PR changes 22 files. A single prompt reviewing everything yields detailed comments on early files and shallow ones on later files. Which restructuring addresses the root cause?", "source": "TS 1.6 / 4.6 · bài 1.6", "options": [{"text": "Review each file separately, then run a cross-file integration pass.", "explanation": "Đúng: giảm pha loãng chú ý và vẫn bắt lỗi liên file."}, {"text": "Keep the single prompt but switch to a model with a larger context window.", "explanation": "Sai: ngữ cảnh lớn không sửa chất lượng chú ý."}, {"text": "Review only the files with the most changed lines and skip the smaller diffs.", "explanation": "Sai: bỏ sót."}, {"text": "Require authors to split the change into PRs of at most three files each.", "explanation": "Sai: đẩy gánh nặng sang con người."}], "answers": [0]}, {"id": "S5-24", "scenario": 5, "domain": "D4", "select": 2, "stem": "Which TWO statements about the Message Batches API are correct?", "source": "TS 4.5 · bài 4.5", "options": [{"text": "It guarantees that every result is returned within one hour of submission.", "explanation": "Sai: không có SLA độ trễ."}, {"text": "Responses are returned in the same order as the requests were submitted.", "explanation": "Sai: dùng custom_id để đối chiếu."}, {"text": "It cannot run tools mid-request and return their results in the same request.", "explanation": "Đúng: không hỗ trợ gọi công cụ nhiều lượt trong một yêu cầu."}, {"text": "It is the best fit for a blocking pre-merge check that developers wait on.", "explanation": "Sai: không bảo đảm độ trễ."}, {"text": "It saves about 50% on cost but has no latency guarantee (up to 24 hours).", "explanation": "Đúng: đánh đổi chi phí lấy độ trễ."}], "answers": [2, 4]}, {"id": "S5-16", "scenario": 5, "domain": "D3", "select": 1, "stem": "A teammate says 'adding -p to our CI command enables plan mode so Claude will not change files'. What is correct?", "source": "TS 3.6 · bài 3.6 (-p)", "options": [{"text": "Incorrect: -p submits the job through the Message Batches API at a discount.", "explanation": "Sai: Batches là API khác, không liên quan đến -p."}, {"text": "Correct: -p blocks file edits, so Claude cannot change the working tree.", "explanation": "Sai: không ngăn chỉnh sửa tệp."}, {"text": "Incorrect: -p only enables non-interactive (print) mode; plan mode is separate.", "explanation": "Đúng: -p là chế độ không tương tác, không phải plan mode."}, {"text": "Correct: -p is the plan mode flag, which stops Claude from editing files.", "explanation": "Sai: nhầm lẫn."}], "answers": [2]}, {"id": "S5-05", "scenario": 5, "domain": "D1", "select": 1, "stem": "A monorepo PR touches six independent packages and you want the coordinator to review them quickly. Which delegation is best?", "source": "TS 1.3 · bài 1.3", "options": [{"text": "Emit several Task calls in one response, giving each subagent the context it needs.", "explanation": "Đúng: nhiều Task call trong một phản hồi chạy song song; ngữ cảnh truyền tường minh."}, {"text": "Let the first subagent call the second one directly when it needs more help.", "explanation": "Sai: nên đi qua coordinator."}, {"text": "Emit one Task call per turn so the packages are reviewed strictly one at a time.", "explanation": "Sai: tuần tự và chậm."}, {"text": "Rely on subagents automatically inheriting the coordinator's conversation history.", "explanation": "Sai: không thừa hưởng."}], "answers": [0]}, {"id": "S5-06", "scenario": 5, "domain": "D2", "select": 1, "stem": "A CI job needs the team's GitHub MCP server. The token is stored as a CI secret and must not be committed. How should the server be configured?", "source": "TS 2.4 · bài 2.4", "options": [{"text": "In a ~/.claude.json file that is committed to the repository for the whole team.", "explanation": "Sai: file cá nhân; và commit token là lỗi."}, {"text": "In .mcp.json with the token hard-coded so every pipeline run can reuse it.", "explanation": "Sai: lộ bí mật."}, {"text": "In project .mcp.json with env var expansion such as ${GITHUB_TOKEN}.", "explanation": "Đúng: .mcp.json ở cấp dự án + mở rộng biến môi trường giữ bí mật ngoài repo."}, {"text": "In the PR description so reviewers can see which credentials the job uses.", "explanation": "Sai: không phải cấu hình."}], "answers": [2]}, {"id": "S5-15", "scenario": 5, "domain": "D3", "select": 1, "stem": "One CI job has Claude Code write a feature, and a later step asks the same session to review its own diff. Reviews are consistently lenient. What is the best redesign?", "source": "TS 3.6 / 4.6 · bài 3.6", "options": [{"text": "Ask the same session to review its diff again with extended thinking enabled.", "explanation": "Sai: vẫn giữ ngữ cảnh lập luận."}, {"text": "Skip the review step for model-generated code to keep the pipeline fast.", "explanation": "Sai: bỏ kiểm soát chất lượng."}, {"text": "Instruct the same session to 'be harsher' when it reviews its own diff.", "explanation": "Sai: không giải quyết thiên kiến."}, {"text": "Review in a separate Claude instance without the generation context.", "explanation": "Đúng: instance độc lập hiệu quả hơn trong phát hiện lỗi tinh vi."}], "answers": [3]}, {"id": "S5-01", "scenario": 5, "domain": "D1", "select": 1, "stem": "Your CI review always needs to check three aspects of every PR, in this order: style, security, and test coverage. The aspects are predictable and independent in content. Which task decomposition is most suitable?", "source": "TS 1.6 · bài 1.6 Task Decomposition", "options": [{"text": "Three separate agents that debate their findings until they reach consensus.", "explanation": "Sai: phức tạp không cần thiết, có thể không hội tụ."}, {"text": "One prompt that asks for style, security and coverage feedback together.", "explanation": "Sai: dễ pha loãng chú ý và kém nhất quán."}, {"text": "Let Claude invent a fully dynamic review plan for each PR it receives.", "explanation": "Sai: không cần tính linh hoạt cho quy trình biết trước, chỉ làm tăng biến động."}, {"text": "Prompt chaining: a fixed sequence of focused prompts, one for each aspect.", "explanation": "Đúng: các bước dự đoán được nên chuỗi prompt cố định cho kết quả tập trung và dễ kiểm soát."}], "answers": [3]}, {"id": "S5-03", "scenario": 5, "domain": "D1", "select": 1, "stem": "A CI Claude job must never modify files under .github/workflows/, whatever the model decides. What is the best control?", "source": "TS 1.5 · bài 1.5 Hooks", "options": [{"text": "A hook that intercepts Write/Edit tool calls and blocks any that target those paths.", "explanation": "Đúng: hook chặn tool call là cơ chế xác định cho quy tắc bắt buộc."}, {"text": "A CLAUDE.md instruction that tells Claude never to modify the workflow files.", "explanation": "Sai: hướng dẫn xác suất."}, {"text": "A human reviewer comment that flags any workflow edit after the job finishes.", "explanation": "Sai: phản ứng sau sự việc."}, {"text": "A few-shot example showing Claude refusing to edit files under .github/workflows/.", "explanation": "Sai: không bảo đảm."}], "answers": [0]}, {"id": "S5-07", "scenario": 5, "domain": "D2", "select": 1, "stem": "The CI review agent should analyze code but must not alter anything. How should its tools be scoped?", "source": "TS 2.3 · bài 2.3", "options": [{"text": "Restrict it to read-oriented tools such as Read, Grep and Glob.", "explanation": "Đúng: nguyên tắc đặc quyền tối thiểu, công cụ phù hợp vai trò."}, {"text": "Give it all tools, including Write and Bash, so it can fix small issues.", "explanation": "Sai: tăng rủi ro và độ phức tạp chọn công cụ."}, {"text": "Give it only the Bash tool, since Bash can run any command it needs.", "explanation": "Sai: công cụ chuyên biệt tốt hơn; Bash quá rộng."}, {"text": "Give it no tools and let it review only from the diff in the prompt.", "explanation": "Sai: không thể phân tích mã."}], "answers": [0]}, {"id": "S5-11", "scenario": 5, "domain": "D3", "select": 1, "stem": "You want findings from a CI Claude run to be posted automatically as inline PR comments by a script. Which flags make the output reliably parseable?", "source": "TS 3.6 · bài 3.6", "options": [{"text": "--output-format json with --json-schema describing the findings.", "explanation": "Đúng: kết hợp hai cờ để có phát hiện có cấu trúc."}, {"text": "--verbose, then have the script read the findings from the detailed run log.", "explanation": "Sai: không phải đầu ra có cấu trúc."}, {"text": "-p alone, then extract the findings from the plain-text output with regular expressions.", "explanation": "Sai: không bảo đảm cấu trúc."}, {"text": "Ask for JSON in the prompt text and parse whatever the model returns.", "explanation": "Sai: không bảo đảm."}], "answers": [0]}, {"id": "S5-29", "scenario": 5, "domain": "D4", "select": 1, "stem": "Your team has two Claude workloads: a pre-merge security check developers wait on, and a weekly full-repository audit. How should you apply the Message Batches API?", "source": "TS 4.5 · bài 4.5", "options": [{"text": "Use batches for the pre-merge check, accepting that results may take up to a day.", "explanation": "Sai: ngược lại."}, {"text": "Use batches for both workloads and poll frequently to get the results back faster.", "explanation": "Sai: polling không tăng tốc."}, {"text": "Use batches for the weekly audit and keep synchronous calls for the pre-merge check.", "explanation": "Đúng: Batches không có SLA độ trễ nên không phù hợp tác vụ chặn."}, {"text": "Use neither, because batch results cannot be matched back to their original requests.", "explanation": "Sai: custom_id dùng để đối chiếu."}], "answers": [2]}, {"id": "S5-09", "scenario": 5, "domain": "D2", "select": 1, "stem": "The post_pr_comment tool returns a 403 when the token lacks permission and a 503 when GitHub is briefly unavailable, but both appear to the agent as 'Failed'. What should be changed?", "source": "TS 2.2 · bài 2.2", "options": [{"text": "Never retry any failure so that no comment is ever posted twice by mistake.", "explanation": "Sai: bỏ lỡ phục hồi lỗi tạm thời."}, {"text": "Report success when a comment fails so the CI job always stays green.", "explanation": "Sai: che giấu lỗi."}, {"text": "Retry every failure five times, whatever the cause, before giving up.", "explanation": "Sai: lỗi quyền sẽ không bao giờ thành công khi retry."}, {"text": "Return structured errors with a category and an isRetryable flag.", "explanation": "Đúng: phân biệt lỗi quyền và lỗi tạm thời để agent quyết định retry hay escalate."}], "answers": [3]}, {"id": "S5-19", "scenario": 5, "domain": "D4", "select": 1, "stem": "Which prompt statement is the most effective way to reduce false positives for a bug-focused reviewer?", "source": "TS 4.1 · bài 4.1", "options": [{"text": "'Report bugs and security flaws; skip style nits and local conventions.'", "explanation": "Đúng: tiêu chí danh mục cụ thể về cái cần báo cáo và bỏ qua."}, {"text": "'Be conservative and only flag issues you are very confident about.'", "explanation": "Sai: chỉ dẫn chung, không cải thiện độ chính xác."}, {"text": "'Flag everything that might be a problem and let the developers filter it.'", "explanation": "Sai: tăng dương tính giả."}, {"text": "'Review the changes carefully and report anything that looks wrong.'", "explanation": "Sai: vô nghĩa."}], "answers": [0]}, {"id": "S5-25", "scenario": 5, "domain": "D5", "select": 1, "stem": "Your reviewer's overall accuracy is 96%, yet developers say its dependency-upgrade findings are almost always wrong. What is the most appropriate response?", "source": "TS 5.5 · bài 5.5", "options": [{"text": "Grow the evaluation set evenly across all categories and re-measure overall accuracy.", "explanation": "Sai: không nhắm vào phân khúc yếu."}, {"text": "Measure accuracy per finding category; aggregate metrics can hide weak segments.", "explanation": "Đúng: phân tích theo phân khúc để thấy vùng yếu."}, {"text": "Trust the 96% overall accuracy, since it shows the reviewer performs well everywhere.", "explanation": "Sai: số tổng hợp có thể che giấu."}, {"text": "Tell developers to ignore findings in the dependency-upgrade category from now on.", "explanation": "Sai: không sửa."}], "answers": [1]}, {"id": "S1-26", "scenario": 1, "domain": "D1", "select": 2, "stem": "Production data shows the agent sometimes processes refunds for an account it never verified. Which TWO changes enforce identity verification deterministically rather than probabilistically?", "source": "TS 1.4 / 1.5 · bài 1.4 & 1.5", "options": [{"text": "Requiring the agent to state 'I have verified the customer' before any refund.", "explanation": "Sai: lời xác nhận của model không phải bằng chứng đã gọi get_customer."}, {"text": "A hook that intercepts process_refund calls lacking a verified customer ID.", "explanation": "Đúng: hook chặn tool call cũng là cưỡng chế xác định."}, {"text": "A bold system prompt paragraph stating that identity verification is mandatory.", "explanation": "Sai: vẫn dựa vào việc model tuân thủ nên có tỷ lệ lỗi khác 0."}, {"text": "Several few-shot examples in which the agent always verifies identity first.", "explanation": "Sai: cải thiện xác suất nhưng không đảm bảo."}, {"text": "A gate that blocks process_refund until get_customer returns a verified ID.", "explanation": "Đúng: cổng điều kiện tiên quyết là cưỡng chế bằng code, không phụ thuộc việc model nhớ."}], "answers": [1, 4]}, {"id": "S1-17", "scenario": 1, "domain": "D4", "select": 1, "stem": "Responses to customers vary widely in structure: some lack next steps, others bury the refund decision at the end. Detailed written instructions have not fixed this. What technique is most effective?", "source": "TS 4.2 · bài 4.2 Few-shot", "options": [{"text": "Send every reply through a second agent that rewrites it into a fixed template.", "explanation": "Sai: thêm chi phí và độ trễ, trong khi chưa thử cách đơn giản và hiệu quả là few-shot."}, {"text": "Lower max_tokens so shorter replies leave less room for the structure to drift.", "explanation": "Sai: ngắn hơn không có nghĩa là nhất quán về cấu trúc."}, {"text": "Add a few targeted few-shot examples that show the desired response format.", "explanation": "Đúng: few-shot là kỹ thuật hiệu quả nhất để có đầu ra nhất quán khi hướng dẫn bằng lời chưa đủ."}, {"text": "Append the instruction 'Be consistent' to the end of the system prompt.", "explanation": "Sai: hướng dẫn chung chung không cụ thể hóa định dạng."}], "answers": [2]}, {"id": "S1-06", "scenario": 1, "domain": "D1", "select": 1, "stem": "A colleague proposes replacing the model-driven loop with a fixed decision tree: 'if message contains the word refund, run lookup_order then process_refund'. Customers frequently combine unusual requests. What is the best evaluation of the proposal?", "source": "TS 1.1 · bài 1.1 Agentic Loops (model-driven vs decision tree)", "options": [{"text": "Keep model-driven tool selection and enforce only compliance-critical steps in code.", "explanation": "Đúng: model-driven xử lý được tình huống chưa lường trước; chỉ những bước bắt buộc về tuân thủ mới cần cổng lập trình."}, {"text": "Have a human triage every request, since only people guarantee consistent outcomes.", "explanation": "Sai: phá vỡ mục tiêu giải quyết tự động 80%+ mà không có lý do."}, {"text": "Adopt the decision tree, since deterministic flows are more reliable than the model.", "explanation": "Sai: cây quyết định cứng không thích ứng với yêu cầu kết hợp bất thường; chỉ cần tính xác định cho các bước tuân thủ."}, {"text": "Adopt the decision tree and let the model fill in missing branches at runtime.", "explanation": "Sai: tự mâu thuẫn, vừa cứng vừa không kiểm soát được và vẫn gặp trường hợp chưa lường trước."}], "answers": [0]}, {"id": "S1-03", "scenario": 1, "domain": "D1", "select": 1, "stem": "A customer writes: 'I want to return the blender, I was double-charged for my subscription, and please update my shipping address.' What is the best way for the agent to handle this message?", "source": "TS 1.4 · bài 1.4 Workflow Enforcement & Handoff", "options": [{"text": "Escalate immediately, because messages with several issues are too risky to automate.", "explanation": "Sai: nhiều vấn đề không phải là điều kiện escalate; agent có đủ công cụ để xử lý."}, {"text": "Start three agents with no shared context, one per concern, and join their replies.", "explanation": "Sai: không chia sẻ ngữ cảnh khách hàng nên dễ lặp tra cứu, mâu thuẫn và không có câu trả lời thống nhất."}, {"text": "Split it into three items, investigate each with shared context, then reply once.", "explanation": "Đúng: tách yêu cầu nhiều mối quan tâm thành từng mục riêng, điều tra song song với ngữ cảnh chung rồi tổng hợp."}, {"text": "Handle only the first concern and ask the customer to resend the other two.", "explanation": "Sai: làm giảm tỷ lệ giải quyết ngay lần liên hệ đầu (mục tiêu 80%+) và gây phiền cho khách."}], "answers": [2]}, {"id": "S1-20", "scenario": 1, "domain": "D4", "select": 1, "stem": "When escalating, the agent must produce a handoff object with fixed fields (customer_id, root_cause, refund_amount, recommended_action) that downstream software parses. Which technique is the most reliable way to guarantee schema-compliant output?", "source": "TS 4.3 · bài 4.3 Structured Output", "options": [{"text": "Ask for JSON in the prompt and extract the fields from the text with a regex.", "explanation": "Sai: không có đảm bảo về schema; dễ lỗi cú pháp."}, {"text": "Provide the handoff tool with tool_choice 'auto' and let the model decide to call it.", "explanation": "Sai: 'auto' cho phép model trả text thay vì gọi công cụ."}, {"text": "Request Markdown output and convert it into the handoff structure afterwards.", "explanation": "Sai: không phải cấu trúc máy đọc được và dễ thiếu trường."}, {"text": "Define a handoff tool with a JSON schema and force it with tool_choice naming that tool.", "explanation": "Đúng: tool_use với JSON schema loại bỏ lỗi cú pháp; forced tool_choice đảm bảo công cụ đó được gọi."}], "answers": [3]}, {"id": "S1-05", "scenario": 1, "domain": "D1", "select": 1, "stem": "Your MCP tools return dates in three different formats: Unix timestamps from the order service, ISO 8601 from billing, and numeric status codes from shipping. The agent occasionally misreads the order of events. What is the best fix?", "source": "TS 1.5 · bài 1.5 Agent SDK Hooks", "options": [{"text": "Add a PreToolUse hook that rejects tool calls whose results use unfamiliar formats.", "explanation": "Sai: PreToolUse chạy trước khi công cụ thực thi nên không thấy được định dạng của kết quả."}, {"text": "Instruct the model in the system prompt to convert every date it reads to ISO 8601.", "explanation": "Sai: bắt model tự chuẩn hóa tốn token và có thể sai; hook làm điều này bằng code đáng tin hơn."}, {"text": "A PostToolUse hook that normalizes timestamps and status codes to one format.", "explanation": "Đúng: PostToolUse can thiệp kết quả công cụ trước khi model xử lý, chuẩn hóa dữ liệu một cách xác định."}, {"text": "Replace the three tools with one generic tool that returns free-form text.", "explanation": "Sai: gộp công cụ không giải quyết vấn đề định dạng và còn làm mất cấu trúc."}], "answers": [2]}, {"id": "S1-19", "scenario": 1, "domain": "D4", "select": 1, "stem": "Each night you must audit 8,000 closed support conversations for policy compliance. Results are needed by next morning, and cost matters. Which approach fits?", "source": "TS 4.5 · bài 4.5 Batch Processing", "options": [{"text": "Use the Message Batches API and correlate each result with its custom_id.", "explanation": "Đúng: tác vụ không chặn, chịu được độ trễ; Batches giảm 50% chi phí, xử lý tối đa 24 giờ."}, {"text": "Skip the audit and rely on the live agent's self-assessment of each conversation.", "explanation": "Sai: bỏ kiểm toán độc lập."}, {"text": "Use the Batches API and poll every second to guarantee results within a minute.", "explanation": "Sai: Batches không có SLA độ trễ; polling không làm nó nhanh hơn."}, {"text": "Make synchronous API calls during business hours while staff wait for the results.", "explanation": "Sai: tốn chi phí gấp đôi mà không cần phản hồi tức thì."}], "answers": [0]}, {"id": "S1-16", "scenario": 1, "domain": "D3", "select": 1, "stem": "Claude Code behaves inconsistently between sessions in the same repository and you suspect different memory files are being loaded. Which command helps diagnose this?", "source": "TS 3.1 · bài 3.1 (/memory)", "options": [{"text": "/plan, to print the CLAUDE.md hierarchy as part of a plan.", "explanation": "Sai: không phải lệnh dùng để kiểm tra memory."}, {"text": "/memory, to check which memory files are loaded in the session.", "explanation": "Đúng: /memory cho biết các file memory (CLAUDE.md) nào đang được nạp."}, {"text": "claude --batch, to re-run the session with a full debug log.", "explanation": "Sai: không có cờ --batch trong Claude Code."}, {"text": "/compact, to summarize the session and list which files were loaded.", "explanation": "Sai: /compact giảm kích thước ngữ cảnh, không liệt kê file memory."}], "answers": [1]}, {"id": "S1-27", "scenario": 1, "domain": "D2", "select": 2, "stem": "Which TWO additions most improve the description of your lookup_order tool so it is not confused with get_customer?", "source": "TS 2.1 · bài 2.1", "options": [{"text": "A longer summary of the order service's features and business capabilities.", "explanation": "Sai: không giúp phân biệt công cụ."}, {"text": "A boundary saying to use get_customer instead when only a name or email is known.", "explanation": "Đúng: ranh giới với công cụ tương tự giảm nhầm lẫn."}, {"text": "A note stressing that this tool is very important and should be preferred.", "explanation": "Sai: nhấn mạnh mơ hồ không làm rõ ranh giới."}, {"text": "Accepted ID formats (e.g. ORD-12345) with example requests that should trigger it.", "explanation": "Đúng: định dạng đầu vào và ví dụ truy vấn giúp model chọn đúng."}, {"text": "The names of the internal database tables that the tool queries behind the scenes.", "explanation": "Sai: chi tiết triển khai không giúp chọn công cụ."}], "answers": [1, 3]}, {"id": "S1-24", "scenario": 1, "domain": "D5", "select": 1, "stem": "A customer is visibly frustrated about a missing parcel but never asks for a human. A standard replacement is clearly within the agent's authority. What is the best behavior?", "source": "TS 5.2 · bài 5.2 Escalation", "options": [{"text": "Acknowledge the frustration and offer the replacement right away.", "explanation": "Đúng: cảm xúc không phải tiêu chí escalate; vấn đề trong khả năng xử lý nên giải quyết."}, {"text": "Ignore the emotion and send the standard scripted reply for missing parcels.", "explanation": "Sai: bỏ qua cảm xúc làm trải nghiệm tệ hơn."}, {"text": "Ask the model for a 1–10 confidence score and escalate whenever it is below 7.", "explanation": "Sai: tự đánh giá confidence kém hiệu chuẩn."}, {"text": "Escalate right away, because negative sentiment signals a difficult case.", "explanation": "Sai: sentiment không tương quan với độ phức tạp ca."}], "answers": [0]}, {"id": "S1-23", "scenario": 1, "domain": "D5", "select": 1, "stem": "A customer writes: 'Stop. I want a human agent now.' Their issue (a delayed parcel) is something the agent could normally resolve. What should the agent do?", "source": "TS 5.2 · bài 5.2 Escalation", "options": [{"text": "Run lookup_order to gather the facts first, then escalate to a human.", "explanation": "Sai: điều tra trước tức là chưa tôn trọng yêu cầu."}, {"text": "Offer to resolve the parcel issue first and escalate if they ask again.", "explanation": "Sai: dành cho trường hợp khách chỉ bực bội mà chưa yêu cầu rõ ràng; ở đây khách đã yêu cầu thẳng."}, {"text": "Compute a sentiment score and escalate only if it exceeds a set threshold.", "explanation": "Sai: sentiment không phải căn cứ khi khách đã yêu cầu rõ ràng."}, {"text": "Escalate immediately and honor the request, without investigating first.", "explanation": "Đúng: yêu cầu rõ ràng gặp người thật phải được tôn trọng ngay."}], "answers": [3]}, {"id": "S1-12", "scenario": 1, "domain": "D2", "select": 1, "stem": "lookup_order is called for a customer who genuinely has no orders in the last 12 months. The backend responded normally. How should the tool report this?", "source": "TS 2.2 / 5.3 · bài 2.2 & 5.3", "options": [{"text": "As a successful result with an empty list, distinct from access failures.", "explanation": "Đúng: truy vấn thành công nhưng không có kết quả là kết quả hợp lệ; không phải lỗi."}, {"text": "As an error with errorCategory 'transient', so the agent retries the call later.", "explanation": "Sai: không có lỗi truy cập nào xảy ra; retry sẽ chỉ lãng phí và có thể gây vòng lặp."}, {"text": "As a permission error, since no matching order data could be found.", "explanation": "Sai: nhầm lẫn giữa 'không có dữ liệu' và 'không có quyền'."}, {"text": "As a placeholder order record so the response always satisfies the schema.", "explanation": "Sai: bịa dữ liệu dẫn đến quyết định sai cho khách."}], "answers": [0]}, {"id": "S1-10", "scenario": 1, "domain": "D2", "select": 1, "stem": "process_refund currently returns the same text 'Operation failed' for timeouts, invalid order IDs, and refunds outside the return window. The agent retries all of them three times. What should the tool return?", "source": "TS 2.2 · bài 2.2 Structured Error Responses", "options": [{"text": "An exception that ends the whole conversation so the call is never repeated.", "explanation": "Sai: một lỗi đơn lẻ không nên kết thúc cả phiên, nhất là khi có thể phục hồi."}, {"text": "Structured errors: errorCategory, isRetryable and a readable description.", "explanation": "Đúng: metadata có cấu trúc cho phép agent quyết định retry, sửa input hay giải thích cho khách."}, {"text": "An empty successful result, so that the agent does not loop on retries.", "explanation": "Sai: che giấu lỗi như thể thành công, khiến agent báo sai cho khách."}, {"text": "The same generic message, with the HTTP status code appended to the text.", "explanation": "Sai: mã HTTP vẫn không cho biết lỗi có thể thử lại hay là vi phạm chính sách."}], "answers": [1]}, {"id": "S1-25", "scenario": 1, "domain": "D5", "select": 1, "stem": "A customer asks the agent to match a competitor's lower price on a TV. Your policy only covers adjusting prices on your own website after purchase and says nothing about competitors. What should the agent do?", "source": "TS 5.2 · bài 5.2 Escalation (policy gap)", "options": [{"text": "Approve the price match to keep the customer satisfied and avoid a delay.", "explanation": "Sai: tự ý tạo ngoại lệ chính sách."}, {"text": "Apply the own-site adjustment policy by analogy and issue the price difference.", "explanation": "Sai: suy diễn chính sách cho tình huống khác là không đáng tin."}, {"text": "Deny the request and tell the customer that price matching is against policy.", "explanation": "Sai: chính sách không cấm mà chỉ không đề cập; nói là 'vi phạm' là sai thông tin."}, {"text": "Escalate to a human, because the policy does not cover competitor price matching.", "explanation": "Đúng: khoảng trống chính sách là điều kiện escalate hợp lệ."}], "answers": [3]}, {"id": "S1-15", "scenario": 1, "domain": "D3", "select": 1, "stem": "A new developer on the support-agent repository says Claude Code ignores the team's coding conventions on their machine, while it works for the senior developer. The conventions live in the senior developer's ~/.claude/CLAUDE.md. What is the issue and the fix?", "source": "TS 3.1 · bài 3.1 CLAUDE.md Hierarchy", "options": [{"text": "Email a copy of the senior developer's ~/.claude directory to the new developer.", "explanation": "Sai: giải pháp thủ công, không bền vững và không đồng bộ qua version control."}, {"text": "Add the conventions to the Agent SDK application's system prompt instead.", "explanation": "Sai: không liên quan đến cấu hình Claude Code của máy phát triển."}, {"text": "The new developer must run /compact so that the conventions get loaded.", "explanation": "Sai: /compact nén ngữ cảnh, không tải cấu hình từ người khác."}, {"text": "Move the rules from the user-level file into the project's CLAUDE.md.", "explanation": "Đúng: ~/.claude/CLAUDE.md chỉ áp dụng cho người dùng đó; quy ước chung phải ở cấp dự án và được commit."}], "answers": [3]}, {"id": "S2-29", "scenario": 2, "domain": "D5", "select": 2, "stem": "Which TWO techniques best counter context degradation in a very long Claude Code session working on a large codebase?", "source": "TS 5.4 · bài 5.4", "options": [{"text": "Record key findings in a scratchpad file and consult it for later questions.", "explanation": "Đúng: lưu phát hiện ngoài ngữ cảnh."}, {"text": "Ask Claude to answer from typical patterns instead of re-reading code, to save tokens.", "explanation": "Sai: đó chính là biểu hiện suy giảm."}, {"text": "Raise the iteration cap so the session can continue for longer before it stops.", "explanation": "Sai: cap không liên quan đến chất lượng ngữ cảnh."}, {"text": "Delegate verbose investigation to subagents and keep only their summaries.", "explanation": "Đúng: cô lập đầu ra khám phá dài dòng."}, {"text": "Keep reading additional files so Claude has more patterns to draw on for answers.", "explanation": "Sai: làm ngữ cảnh đầy hơn."}], "answers": [0, 3]}, {"id": "S2-02", "scenario": 2, "domain": "D1", "select": 1, "stem": "You have a named investigation session about a flaky payments module. After lunch, a teammate refactors two of the files you analyzed this morning. You want to continue the same investigation efficiently. What should you do?", "source": "TS 1.7 · bài 1.7 Session State", "options": [{"text": "Use --resume and tell Claude which files changed so it re-checks them.", "explanation": "Đúng: resume phù hợp khi ngữ cảnh phần lớn còn đúng; thông báo file thay đổi giúp phân tích lại có mục tiêu."}, {"text": "Resume the session and rely on Claude to notice the changed files by itself.", "explanation": "Sai: model không tự biết file đã bị sửa nếu không được thông báo hoặc đọc lại."}, {"text": "Discard the session and re-explore the whole module from scratch.", "explanation": "Sai: tốn kém khi chỉ có hai file thay đổi."}, {"text": "Fork the session and continue on whichever branch has the longer history.", "explanation": "Sai: fork để thử hướng khác, không để cập nhật theo thay đổi file."}], "answers": [0]}, {"id": "S2-05", "scenario": 2, "domain": "D1", "select": 1, "stem": "A nightly Claude Code job always performs the same three steps on a repository: lint-fix, then update the API docs, then draft a changelog entry. Which decomposition pattern fits?", "source": "TS 1.6 · bài 1.6", "options": [{"text": "A coordinator that spawns a separate subagent for every changed line of code.", "explanation": "Sai: quá mức cần thiết."}, {"text": "Fully dynamic decomposition in which Claude decides the steps each night.", "explanation": "Sai: không cần linh hoạt cho quy trình cố định; thêm biến động không cần thiết."}, {"text": "A fixed sequential pipeline (prompt chaining), with one focused prompt per step.", "explanation": "Đúng: các bước dự đoán được, lặp lại nên prompt chaining là phù hợp."}, {"text": "One large prompt that performs all three steps together in a single pass.", "explanation": "Sai: dễ giảm chất lượng từng phần khi trộn nhiều mục tiêu."}], "answers": [2]}, {"id": "S2-03", "scenario": 2, "domain": "D1", "select": 1, "stem": "After analyzing a service, you want to compare two possible refactoring strategies (a strangler-pattern rewrite versus an in-place cleanup) without one polluting the other's context. Which mechanism fits best?", "source": "TS 1.7 · bài 1.7 (fork_session)", "options": [{"text": "Run --resume twice on the same session name to open two parallel conversations.", "explanation": "Sai: resume tiếp tục cùng một phiên chứ không tạo nhánh độc lập."}, {"text": "Run /compact between the two strategies to shorten the session history.", "explanation": "Sai: /compact nén ngữ cảnh, không tạo nhánh song song."}, {"text": "Develop both strategies in the same conversation and keep them apart by topic.", "explanation": "Sai: hai hướng sẽ lẫn vào ngữ cảnh của nhau."}, {"text": "fork_session, creating independent branches from the shared analysis baseline.", "explanation": "Đúng: fork cho phép khám phá các hướng khác nhau từ cùng một nền phân tích mà không ảnh hưởng nhau."}], "answers": [3]}, {"id": "S2-17", "scenario": 2, "domain": "D4", "select": 1, "stem": "Your docs-automation prompt says 'check that code comments are accurate' and produces many nitpicks. Which revised criterion best improves precision?", "source": "TS 4.1 · bài 4.1 Explicit Criteria", "options": [{"text": "Flag every code comment and let the human reviewers decide which matter.", "explanation": "Sai: tăng nhiễu và làm mất niềm tin vào công cụ."}, {"text": "Report only the comment issues that you are highly confident about.", "explanation": "Sai: hướng dẫn 'tự tin cao' chung chung không cải thiện độ chính xác."}, {"text": "Be conservative when flagging comments to avoid surprising the reviewers.", "explanation": "Sai: mơ hồ, không xác định danh mục cần báo cáo."}, {"text": "Flag a comment only when its claimed behavior contradicts what the code does.", "explanation": "Đúng: tiêu chí cụ thể, có thể kiểm chứng giúp giảm dương tính giả."}], "answers": [3]}, {"id": "S2-07", "scenario": 2, "domain": "D2", "select": 1, "stem": "You edit a config file with the Edit tool, but it fails because the text you want to replace appears in several places and is not unique. What is the tested fallback?", "source": "TS 2.5 · bài 2.5 Built-in Tools", "options": [{"text": "Use Glob to rename the file, then recreate it with the intended content.", "explanation": "Sai: Glob tìm tên file theo mẫu, không sửa nội dung."}, {"text": "Use Grep to replace the text everywhere across the repository at once.", "explanation": "Sai: Grep dùng để tìm kiếm, không phải sửa file."}, {"text": "Use Read to load the whole file, then Write the complete modified file.", "explanation": "Đúng: theo Exam Guide, khi Edit không tìm được đoạn duy nhất, dùng Read + Write để sửa đáng tin cậy."}, {"text": "Retry the same Edit call until the replacement eventually succeeds.", "explanation": "Sai: kết quả không đổi khi đoạn text vẫn không duy nhất."}], "answers": [2]}, {"id": "S2-21", "scenario": 2, "domain": "D4", "select": 2, "stem": "Which TWO changes best help Claude Code generate a unit-test suite with consistent structure and fewer low-value tests?", "source": "TS 3.6 · bài 3.6 CI/CD & test generation", "options": [{"text": "Include the existing test files in context so duplicate scenarios are avoided.", "explanation": "Đúng: giúp tránh đề xuất kịch bản đã có."}, {"text": "Ask for tests that focus on simple getters and setters, which are easy to verify.", "explanation": "Sai: giá trị thấp, không phải tiêu chí tốt."}, {"text": "Document testing standards, valuable-test criteria and fixtures in CLAUDE.md.", "explanation": "Đúng: CLAUDE.md cung cấp ngữ cảnh dự án luôn được nạp, nâng chất lượng bài kiểm thử."}, {"text": "Hide the existing test files from Claude so they do not bias the new tests.", "explanation": "Sai: khiến test trùng lặp."}, {"text": "Instruct Claude to generate as many tests as possible to maximize coverage.", "explanation": "Sai: tăng số lượng test giá trị thấp."}], "answers": [0, 2]}, {"id": "S2-01", "scenario": 2, "domain": "D1", "select": 1, "stem": "You must migrate a codebase from one HTTP client library to another. The call sites are scattered across a very large repository, and discovery output (grep results, file dumps) is flooding the main conversation. Which approach best protects the main context?", "source": "TS 3.4 / 5.4 · bài 3.4 & 5.4 (Explore subagent)", "options": [{"text": "Disable the Grep tool so that searches return less raw output to the session.", "explanation": "Sai: làm mất khả năng tìm kiếm cần thiết thay vì cô lập đầu ra."}, {"text": "Run all searches in the main conversation, then ask Claude to forget the output.", "explanation": "Sai: model không thể 'quên'; nội dung vẫn nằm trong ngữ cảnh."}, {"text": "Delegate discovery to the Explore subagent and return a concise summary to main.", "explanation": "Đúng: Explore subagent cô lập đầu ra khám phá dài dòng và chỉ trả về bản tóm tắt, giữ ngữ cảnh chính gọn."}, {"text": "Restart the session after each search and paste the relevant results back in.", "explanation": "Sai: tốn công và mất mạch làm việc mà không có lợi ích so với việc ủy quyền cho subagent."}], "answers": [2]}, {"id": "S2-08", "scenario": 2, "domain": "D3", "select": 1, "stem": "You want a /analyze-architecture skill that produces very verbose output while exploring the codebase. You do not want this output cluttering the main conversation. What should you configure?", "source": "TS 3.2 · bài 3.2 Skills (context: fork)", "options": [{"text": "Install the skill in ~/.claude/skills/ instead of the project's .claude/skills/.", "explanation": "Sai: thay đổi phạm vi chia sẻ, không thay đổi cách cô lập ngữ cảnh."}, {"text": "Set argument-hint to 'short' so the skill limits the length of its output.", "explanation": "Sai: argument-hint chỉ nhắc tham số cần nhập."}, {"text": "Set context: fork in SKILL.md frontmatter to run it in isolation.", "explanation": "Đúng: context: fork chạy skill trong ngữ cảnh cô lập, tránh làm nhiễu cuộc trò chuyện chính."}, {"text": "Add a CLAUDE.md instruction telling Claude to keep all of its output brief.", "explanation": "Sai: không cô lập được đầu ra của skill."}], "answers": [2]}, {"id": "S2-06", "scenario": 2, "domain": "D2", "select": 1, "stem": "Your team wants a shared GitHub MCP server for every developer in the repository, without committing access tokens. Where and how should it be configured?", "source": "TS 2.4 · bài 2.4 MCP Integration", "options": [{"text": "In each developer's ~/.claude.json, with the access token pasted inline.", "explanation": "Sai: cấu hình cá nhân không được chia sẻ cho cả nhóm."}, {"text": "In project .mcp.json with env variable expansion like ${GITHUB_TOKEN}.", "explanation": "Đúng: .mcp.json ở cấp dự án được chia sẻ; biến môi trường giữ bí mật ngoài repo."}, {"text": "In CLAUDE.md, with the token written on the first line of the file.", "explanation": "Sai: CLAUDE.md là hướng dẫn, không phải cấu hình máy chủ MCP; token còn bị commit."}, {"text": "In .mcp.json with the literal token committed so it works on every machine.", "explanation": "Sai: lộ bí mật trong version control."}], "answers": [1]}, {"id": "S2-09", "scenario": 2, "domain": "D3", "select": 1, "stem": "A skill that scaffolds boilerplate files should only be able to write files and must not run arbitrary shell commands. Which frontmatter setting expresses this tool restriction in the exam's terms?", "source": "TS 3.2 · bài 3.2 Skills (allowed-tools)", "options": [{"text": "context: fork, so the skill runs in an isolated sub-agent context.", "explanation": "Sai: chỉ cô lập ngữ cảnh, không hạn chế công cụ."}, {"text": "argument-hint, describing the arguments the skill expects when invoked.", "explanation": "Sai: chỉ gợi ý tham số khi gọi skill."}, {"text": "allowed-tools, limited to the file-writing tools the skill needs.", "explanation": "Đúng: allowed-tools trong frontmatter của skill giới hạn công cụ có thể dùng khi skill chạy."}, {"text": "A CLAUDE.md line that tells the model never to use the Bash tool.", "explanation": "Sai: chỉ là hướng dẫn xác suất, không phải cấu hình công cụ của skill."}], "answers": [2]}, {"id": "S2-23", "scenario": 2, "domain": "D5", "select": 1, "stem": "Your session is full of verbose discovery output but you still need to keep working in the same session. Which built-in command reduces context usage?", "source": "TS 5.4 · bài 5.4 (/compact)", "options": [{"text": "/compact", "explanation": "Đúng: /compact nén ngữ cảnh khi phiên khám phá dài đầy đầu ra chi tiết."}, {"text": "--resume", "explanation": "Sai: tiếp tục phiên, không giảm ngữ cảnh."}, {"text": "/memory", "explanation": "Sai: chỉ hiển thị/quản lý các file memory."}, {"text": "/clear", "explanation": "Sai: /clear xoá sạch ngữ cảnh, mất luôn công việc đang làm."}], "answers": [0]}, {"id": "S2-20", "scenario": 2, "domain": "D4", "select": 1, "stem": "Code reviews produced by your prompt classify almost everything as 'high severity'. What helps most to get consistent severity labels?", "source": "TS 4.1 · bài 4.1 (severity criteria)", "options": [{"text": "Define explicit severity criteria with concrete code examples for each level.", "explanation": "Đúng: tiêu chí rõ + ví dụ code cụ thể cho từng mức giúp phân loại nhất quán."}, {"text": "Set temperature to 0 so the severity labels become more deterministic.", "explanation": "Sai: không xác định tiêu chuẩn phân loại."}, {"text": "Report only the issues where the model's confidence is above 90%.", "explanation": "Sai: confidence không phải tiêu chí mức độ nghiêm trọng."}, {"text": "Tell the model to 'use good judgment' when it assigns each severity.", "explanation": "Sai: mơ hồ."}], "answers": [0]}, {"id": "S2-12", "scenario": 2, "domain": "D3", "select": 1, "stem": "A stack trace clearly shows a null-pointer crash in a single function of one file, and the fix is a one-line guard. Which working mode is most appropriate?", "source": "TS 3.4 · bài 3.4 Plan Mode vs Direct", "options": [{"text": "Defer the fix until the team decides on a new overall architecture.", "explanation": "Sai: không liên quan đến sửa lỗi cục bộ."}, {"text": "Plan mode, then fork three sessions to explore alternative fixes in parallel.", "explanation": "Sai: phức tạp hóa không cần thiết."}, {"text": "Plan mode with a full architectural exploration of the codebase first.", "explanation": "Sai: quá mức cần thiết cho thay đổi nhỏ."}, {"text": "Direct execution, because the change is well-scoped and clearly understood.", "explanation": "Đúng: sửa lỗi một file có stack trace rõ ràng không cần lập kế hoạch dài."}], "answers": [3]}]}</script>
<script>
(function(){
"use strict";
var EXAM = JSON.parse(document.getElementById('exam-data').textContent);
var Q = EXAM.questions, N = Q.length, DURATION = EXAM.durationSec;
var KEY = 'ccarf-mock::' + EXAM.examId;
var LET = 'ABCDEFG';
var state = load() || {phase:'intro', answers:{}, flags:{}, cur:0, startedAt:null, endsAt:null, submittedAt:null, result:null};
var timerH = null;

function load(){ try{ var s = localStorage.getItem(KEY); return s ? JSON.parse(s) : null; }catch(e){ return null; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function $(id){ return document.getElementById(id); }
function fmt(sec){ sec = Math.max(0, sec); var m = Math.floor(sec/60), s = sec%60; return (m<10?'0':'')+m+':'+(s<10?'0':'')+s; }
function remaining(){ return Math.max(0, Math.round((state.endsAt - Date.now())/1000)); }
function ansOf(i){ return state.answers[i] || []; }

/* ---------- chấm điểm ---------- */
function isCorrect(i){
  var a = ansOf(i).slice().sort(), c = Q[i].answers.slice().sort();
  if(a.length !== c.length) return false;
  for(var k=0;k<a.length;k++) if(a[k]!==c[k]) return false;
  return true;
}
function grade(){
  var correct = 0, dom = {}, scen = {};
  Object.keys(EXAM.domains).forEach(function(d){ dom[d] = {c:0,t:0}; });
  for(var i=0;i<N;i++){
    var q = Q[i], ok = isCorrect(i);
    if(ok) correct++;
    dom[q.domain].t++; if(ok) dom[q.domain].c++;
    scen[q.scenario] = scen[q.scenario] || {c:0,t:0};
    scen[q.scenario].t++; if(ok) scen[q.scenario].c++;
  }
  var scaled = Math.round(100 + 900*correct/N);
  return {correct:correct, total:N, scaled:scaled, pass: scaled >= 720, dom:dom, scen:scen};
}

/* ---------- màn hình ---------- */
function render(){
  clearInterval(timerH); timerH = null;
  var app = $('app');
  if(state.phase === 'intro') app.innerHTML = introHTML();
  else if(state.phase === 'exam') { app.innerHTML = examHTML(); startTimer(); bindExam(); }
  else app.innerHTML = resultHTML();
  if(state.phase === 'intro') bindIntro();
  if(state.phase === 'result') bindResult();
  window.scrollTo(0,0);
}

function introHTML(){
  var sc = EXAM.scenarioOrder.map(function(s){ var o = EXAM.scenarios[s]; return '<li><b>'+esc(o.title)+'</b><br><span class="mut small">'+esc(o.vi)+'</span></li>'; }).join('');
  var dm = Object.keys(EXAM.blueprint).map(function(d){ return '<tr><td>'+d+'</td><td>'+esc(EXAM.domains[d])+'</td><td>'+EXAM.blueprint[d]+' câu</td></tr>'; }).join('');
  return '<div class="wrap"><div class="card"><h1>Claude Certified Architect – Foundations (CCAR-F)</h1>'+
   '<div class="mut">Đề thi thử hằng ngày · '+esc(EXAM.date)+' · mã đề '+esc(EXAM.examId)+'</div></div>'+
   '<div class="card"><h2>Thông tin bài thi</h2><ul class="rules">'+
   '<li><b>'+N+' câu</b> trắc nghiệm một đáp án hoặc nhiều đáp án — mỗi câu ghi rõ “chọn N đáp án”.</li>'+
   '<li><b>Thời gian 120 phút</b>, đồng hồ đếm ngược; hết giờ bài tự nộp. Tải lại trang không mất bài và không reset đồng hồ.</li>'+
   '<li>Đề gồm <b>4 kịch bản</b> bốc từ 6 kịch bản. Hôm nay: '+EXAM.scenarioOrder.length+' kịch bản dưới đây.</li>'+
   '<li>Không hiện đúng/sai cho đến khi nộp bài. Câu nhiều đáp án chỉ được tính điểm khi chọn <b>đúng và đủ</b>.</li>'+
   '<li>Điểm quy đổi tuyến tính 100–1000 (<code>100 + 900 × số câu đúng / '+N+'</code>); <b>đạt từ 720</b> (≈ 42/60 câu đúng). Đây là ước lượng, không phải thang chấm thật.</li>'+
   '<li>Câu hỏi do bot tự biên soạn dựa trên Exam Guide v1.0, không phải đề thật — dùng để tìm chỗ yếu.</li></ul></div>'+
   '<div class="card"><h2>Kịch bản trong đề này</h2><ol>'+sc+'</ol></div>'+
   '<div class="card"><h2>Phân bổ theo lĩnh vực</h2><table>'+dm+'</table></div>'+
   '<div class="card"><button class="btn pri" id="start">Bắt đầu làm bài</button></div></div>';
}
function bindIntro(){
  $('start').onclick = function(){
    state.phase='exam'; state.startedAt=Date.now(); state.endsAt=Date.now()+DURATION*1000; state.cur=0; save(); render();
  };
}

function examHTML(){
  return '<div class="top"><div class="title">CCAR-F · '+esc(EXAM.date)+'</div><div class="sp"></div>'+
   '<div class="mut small" id="prog"></div><div class="timer" id="timer">--:--</div>'+
   '<button class="btn pri" id="submit">Nộp bài</button></div>'+
   '<div class="wrap"><div class="layout"><div class="card" id="qbox"></div>'+
   '<div><div class="card"><h3>Bản đồ câu hỏi</h3><div class="map" id="map"></div>'+
   '<div class="legend" style="margin-top:10px"><span><i class="dot a"></i>Đã trả lời</span><span><i class="dot f"></i>Gắn cờ ⚑</span></div></div></div></div></div>'+
   '<div id="modal"></div>';
}
function bindExam(){
  $('submit').onclick = confirmSubmit;
  drawQ(); drawMap(); tick();
  document.onkeydown = function(e){
    if(state.phase!=='exam' || $('modal').innerHTML) return;
    if(e.key==='ArrowRight'){ go(state.cur+1); } else if(e.key==='ArrowLeft'){ go(state.cur-1); }
  };
}
function startTimer(){ timerH = setInterval(tick, 500); }
function tick(){
  if(state.phase!=='exam') return;
  var r = remaining(), t = $('timer');
  if(t){ t.textContent = fmt(r); t.className = 'timer'+(r<=600?' low':''); }
  if(r<=0) doSubmit(true);
}
function go(i){ if(i<0||i>=N) return; state.cur=i; save(); drawQ(); drawMap(); }
function drawProg(){
  var n=0; for(var i=0;i<N;i++) if(ansOf(i).length) n++;
  var p=$('prog'); if(p) p.textContent='Đã trả lời '+n+'/'+N;
}
function drawQ(){
  var i = state.cur, q = Q[i], a = ansOf(i), box = $('qbox');
  var prev = i>0 ? Q[i-1].scenario : null, newScen = (i===0 || prev !== q.scenario);
  var sc = EXAM.scenarios[q.scenario];
  var h = '<div class="scen"><b>'+esc(sc.title)+'</b>'+(newScen?'<br>':'<br>')+'<span class="small">'+esc(sc.text)+'</span></div>';
  h += '<div class="qno"><b>Câu '+(i+1)+' / '+N+'</b><span class="tag sel">'+(q.select>1?'Chọn '+q.select+' đáp án':'Chọn 1 đáp án')+'</span></div>';
  h += '<div class="stem">'+esc(q.stem)+'</div>';
  q.options.forEach(function(o, k){
    var on = a.indexOf(k) >= 0;
    h += '<label class="opt'+(on?' on':'')+'" data-k="'+k+'"><input type="'+(q.select>1?'checkbox':'radio')+'" name="q'+i+'" '+(on?'checked':'')+'><span class="l">'+LET[k]+'.</span><span>'+esc(o.text)+'</span></label>';
  });
  if(q.select>1) h += '<div class="small mut" id="selhint">Đã chọn '+a.length+'/'+q.select+'</div>';
  h += '<div class="nav"><button class="btn" id="prev"'+(i===0?' disabled':'')+'>← Câu trước</button>'+
       '<button class="btn flagbtn'+(state.flags[i]?' on':'')+'" id="flag">⚑ '+(state.flags[i]?'Bỏ cờ':'Gắn cờ xem lại')+'</button>'+
       '<button class="btn pri" id="next"'+(i===N-1?' disabled':'')+'>Câu sau →</button></div>';
  box.innerHTML = h;
  var opts = box.querySelectorAll('.opt');
  Array.prototype.forEach.call(opts, function(el){
    el.addEventListener('click', function(ev){
      ev.preventDefault();
      pick(i, parseInt(el.getAttribute('data-k'),10));
    });
  });
  $('prev').onclick = function(){ go(i-1); };
  $('next').onclick = function(){ go(i+1); };
  $('flag').onclick = function(){ if(state.flags[i]) delete state.flags[i]; else state.flags[i]=1; save(); drawQ(); drawMap(); };
  drawProg();
}
function pick(i, k){
  var q = Q[i], a = ansOf(i).slice(), pos = a.indexOf(k);
  if(q.select===1){ a=[k]; }
  else if(pos>=0){ a.splice(pos,1); }
  else if(a.length < q.select){ a.push(k); }
  else { var h=$('selhint'); if(h){ h.textContent='Đã đủ '+q.select+' đáp án — bỏ chọn một đáp án trước khi chọn đáp án khác.'; h.style.color='#b42318'; } return; }
  state.answers[i]=a.sort(function(x,y){return x-y;}); if(!a.length) delete state.answers[i];
  save(); drawQ(); drawMap();
}
function drawMap(){
  var m=$('map'); if(!m) return; var h='';
  for(var i=0;i<N;i++){
    var c=[]; if(ansOf(i).length) c.push('ans'); if(state.flags[i]) c.push('flag'); if(i===state.cur) c.push('cur');
    h+='<button class="'+c.join(' ')+'" data-i="'+i+'">'+(i+1)+'</button>';
  }
  m.innerHTML=h;
  Array.prototype.forEach.call(m.querySelectorAll('button'), function(b){ b.onclick=function(){ go(parseInt(b.getAttribute('data-i'),10)); }; });
  drawProg();
}

/* ---------- nộp bài ---------- */
function confirmSubmit(){
  var un=0, fl=0; for(var i=0;i<N;i++){ if(!ansOf(i).length) un++; if(state.flags[i]) fl++; }
  $('modal').innerHTML='<div class="modal"><div class="box"><h2>Nộp bài?</h2><p>Chưa trả lời: <b>'+un+'</b> câu · Đang gắn cờ: <b>'+fl+'</b> câu · Còn lại: <b>'+fmt(remaining())+'</b>.</p><p class="mut small">Sau khi nộp không sửa được đáp án.</p><div class="nav"><button class="btn" id="no">Làm tiếp</button><button class="btn bad" id="yes">Nộp bài</button></div></div></div>';
  $('no').onclick=function(){ $('modal').innerHTML=''; };
  $('yes').onclick=function(){ doSubmit(false); };
}
function doSubmit(auto){
  if(state.phase!=='exam') return;
  state.phase='result'; state.submittedAt=Date.now(); state.result=grade(); state.auto=!!auto; save();
  document.onkeydown=null; render();
}

/* ---------- kết quả ---------- */
var filter='all';
function resultHTML(){
  var r = state.result, used = Math.round(((state.submittedAt||Date.now()) - state.startedAt)/1000);
  var dm = Object.keys(EXAM.domains).map(function(d){
    var x=r.dom[d], p = x.t? Math.round(100*x.c/x.t):0;
    return '<tr><td><b>'+d+'</b> '+esc(EXAM.domains[d])+'</td><td>'+x.c+'/'+x.t+'</td><td style="width:35%"><div class="bar"><i style="width:'+p+'%"></i></div></td><td><b>'+p+'%</b></td></tr>';
  }).join('');
  var sc = Object.keys(r.scen).map(function(s){ var x=r.scen[s], p=Math.round(100*x.c/x.t); return '<tr><td>'+esc(EXAM.scenarios[s].title)+'</td><td>'+x.c+'/'+x.t+'</td><td><b>'+p+'%</b></td></tr>'; }).join('');
  var skip=0, wrong=0; for(var i=0;i<N;i++){ if(!ansOf(i).length) skip++; else if(!isCorrect(i)) wrong++; }
  var h='<div class="wrap"><div class="card"><div class="result-head"><div><div class="score '+(r.pass?'pass':'fail')+'">'+r.scaled+'</div><div class="mut">/ 1000 · điểm quy đổi tuyến tính</div></div>'+
   '<div><h1 class="'+(r.pass?'pass':'fail')+'">'+(r.pass?'ĐẠT (≥ 720)':'CHƯA ĐẠT (< 720)')+'</h1>'+
   '<div>Đúng <b>'+r.correct+'/'+r.total+'</b> · sai '+wrong+' · bỏ trống '+skip+'</div>'+
   '<div class="mut small">Thời gian làm: '+fmt(used)+(state.auto?' (hết giờ, tự nộp)':'')+' · Cần ≥ 42/60 câu để đạt theo quy đổi này.</div></div></div></div>'+
   '<div class="card"><h2>Phần trăm đúng theo lĩnh vực</h2><table>'+dm+'</table><div class="small mut" style="margin-top:8px">Lĩnh vực dưới 70% là chỗ cần ôn trước. Theo Exam Guide, % theo lĩnh vực chỉ để tham khảo, đạt/trượt tính theo tổng điểm.</div></div>'+
   '<div class="card"><h2>Theo kịch bản</h2><table>'+sc+'</table></div>'+
   pqHTML()+
   '<div class="card"><h2>Xem lại bài làm và giải thích</h2><div class="filters" id="filters">'+
   fbtn('all','Tất cả')+fbtn('wrong','Sai / bỏ trống')+fbtn('flag','Đã gắn cờ')+fbtn('right','Đúng')+'</div><div id="review"></div></div>'+
   '<div class="card againbar"><button class="btn" id="again">Làm lại đề này</button> <span class="mut small">Xoá bài làm đã lưu và thi lại cùng đề (đề mới sinh bằng build_exam.py cho ngày khác).</span></div></div>';
  return h;
}
function pqHTML(){
  var rows='';
  for(var i=0;i<N;i++){
    var q=Q[i], a=ansOf(i), ok=isCorrect(i), hit=0;
    a.forEach(function(k){ if(q.answers.indexOf(k)>=0) hit++; });
    var sel=a.length?a.map(function(k){return LET[k];}).join(', '):'—';
    var cor=q.answers.map(function(k){return LET[k];}).join(', ');
    rows+='<tr><td>Câu '+(i+1)+'</td><td>'+q.domain+'</td><td>'+(q.select>1?'chọn '+q.select:'chọn 1')+'</td><td>'+sel+'</td><td>'+cor+'</td>'+
      '<td>'+(q.select>1?hit+'/'+q.answers.length+' ý đúng':'')+'</td><td><b class="'+(ok?'pass':'fail')+'">'+(ok?1:0)+'/1</b></td></tr>';
  }
  return '<div class="card"><h2>Điểm từng câu</h2><div class="small mut">Mỗi câu 1 điểm, chấm cả câu: câu chọn nhiều phải chọn đúng và đủ mới được 1 điểm (không có điểm từng phần).</div>'+
    '<table><tr><th>Câu</th><th>Lĩnh vực</th><th>Loại</th><th>Bạn chọn</th><th>Đáp án</th><th>Ý đúng</th><th>Điểm</th></tr>'+rows+'</table></div>';
}
function fbtn(k,t){ return '<button class="btn'+(filter===k?' on':'')+'" data-f="'+k+'">'+t+'</button>'; }
function bindResult(){
  Array.prototype.forEach.call(document.querySelectorAll('#filters .btn'), function(b){ b.onclick=function(){ filter=b.getAttribute('data-f'); document.getElementById('filters').innerHTML=fbtn('all','Tất cả')+fbtn('wrong','Sai / bỏ trống')+fbtn('flag','Đã gắn cờ')+fbtn('right','Đúng'); bindResult(); }; });
  drawReview();
  $('again').onclick=function(){ if(confirm('Xoá bài làm và thi lại đề này?')){ try{localStorage.removeItem(KEY);}catch(e){} state={phase:'intro',answers:{},flags:{},cur:0,startedAt:null,endsAt:null,submittedAt:null,result:null}; render(); } };
}
function drawReview(){
  var h='';
  for(var i=0;i<N;i++){
    var q=Q[i], a=ansOf(i), ok=isCorrect(i), skip=!a.length;
    if(filter==='wrong' && ok) continue;
    if(filter==='right' && !ok) continue;
    if(filter==='flag' && !state.flags[i]) continue;
    var cls = ok?'right':(skip?'skip':'wrong');
    h+='<div class="rv '+cls+'"><div class="qno"><b>Câu '+(i+1)+'</b><span>'+
      '<span class="tag">'+q.domain+'</span> <span class="tag">KB'+q.scenario+'</span> <span class="tag">'+(q.select>1?'chọn '+q.select:'chọn 1')+'</span>'+
      (state.flags[i]?' <span class="tag">⚑</span>':'')+
      ' <span class="badge '+(ok?'g':(skip?'y':'r'))+'">'+(ok?'ĐÚNG':(skip?'BỎ TRỐNG':'SAI'))+'</span></span></div>'+
      '<div class="stem">'+esc(q.stem)+'</div>';
    q.options.forEach(function(o,k){
      var isC=q.answers.indexOf(k)>=0, picked=a.indexOf(k)>=0;
      h+='<div class="ro '+(isC?'c':'w')+'"><b>'+LET[k]+'.</b> '+esc(o.text)+
        (isC?'<span class="badge g">ĐÁP ÁN ĐÚNG</span>':'')+(picked?'<span class="badge '+(isC?'g':'r')+'">BẠN CHỌN</span>':'')+
        '<div class="ex">'+(isC?'✔ ':'✘ ')+esc(o.explanation)+'</div></div>';
    });
    h+='<div class="small mut">Nguồn: '+esc(q.source)+' · ID '+esc(q.id)+'</div></div>';
  }
  $('review').innerHTML = h || '<div class="mut">Không có câu nào trong mục này.</div>';
}

render();
})();
</script>
</body>
</html>
